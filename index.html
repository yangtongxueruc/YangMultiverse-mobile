            halo.position.set(sx, sy + 0.042, sz);
            halo.renderOrder = 3;
            fordGroup.add(halo);
          }
        });
        const cobbles = [
          [-1.50,  0.42, 0.22], [-0.84,  0.44, 0.25], [-0.20, -0.46, 0.24],
          [ 0.38, -0.44, 0.22], [ 0.96,  0.46, 0.25], [ 1.54, -0.38, 0.21],
          [-1.44, -0.44, 0.19], [-0.88, -0.46, 0.21], [ 0.34,  0.44, 0.23],
          [ 1.48,  0.40, 0.20], [-0.22,  0.48, 0.18], [ 0.94, -0.45, 0.19]
        ];
        cobbles.forEach(([dx, dz, r], idx) => {
          const cx = BRIDGE_X + dx;
          const cz = BRIDGE_Z + dz;
          const cy = getTerrainHeight(cx, cz);
          const cob = new THREE.Mesh(
            new THREE.DodecahedronGeometry(r, 1),
            stoneMats[(idx + 1) % stoneMats.length]
          );
          cob.scale.set(1.22, 0.44, 0.96);
          cob.position.set(cx, cy + r * 0.24, cz);
          cob.rotation.y = idx * 0.9;
          cob.castShadow = true;
          cob.receiveShadow = true;
          fordGroup.add(cob);
        });
        return fordGroup;
      }

      // Wooden Tree-Stump Stepping Bridge for Forest Sanctuary (木墩子桥)
      function buildForestLogBridge() {
        const bridgeGroup = new THREE.Group();
        // Procedural concentric tree-ring top texture for each wooden stump
        function createStumpRingTex() {
          const c = document.createElement('canvas');
          c.width = 128; c.height = 128;
          const ctx = c.getContext('2d');
          ctx.fillStyle = '#e6c796';
          ctx.fillRect(0, 0, 128, 128);
          ctx.strokeStyle = '#c49a62';
          ctx.lineWidth = 3;
          [14, 28, 42, 54].forEach(r => {
            ctx.beginPath();
            ctx.arc(64, 64, r, 0, Math.PI * 2);
            ctx.stroke();
          });
          ctx.fillStyle = '#b38249';
          ctx.beginPath();
          ctx.arc(64, 64, 7, 0, Math.PI * 2);
          ctx.fill();
          const tex = new THREE.CanvasTexture(c);
          tex.encoding = THREE.sRGBEncoding;
          return tex;
        }
        const ringTex = createStumpRingTex();
        const barkMats = [
          new THREE.MeshStandardMaterial({ color: 0x6e4729, bumpMap: feltBumpTex, bumpScale: 0.028, roughness: 0.95 }),

        ];
        const ringTopMat = new THREE.MeshStandardMaterial({ map: ringTex, bumpMap: feltBumpTex, bumpScale: 0.014, roughness: 0.90 });
        const mossMat = new THREE.MeshStandardMaterial({ color: 0x629144, bumpMap: feltBumpTex, bumpScale: 0.022, roughness: 0.95 });
        const capMat = new THREE.MeshStandardMaterial({ color: 0xc94a36, bumpMap: feltBumpTex, bumpScale: 0.016, roughness: 0.90 });
        const foamMat = new THREE.MeshBasicMaterial({
          color: 0xffffff, transparent: true, opacity: 0.42, side: THREE.DoubleSide, depthWrite: false
        });

        // Main staggered row of thick round tree stumps spanning the brook
        const stumps = [
          { dx: -1.78, dz:  0.04, r: 0.36, h: 0.32, m: 0, moss: true,  shroom: false },
          { dx: -1.18, dz: -0.16, r: 0.40, h: 0.36, m: 1, moss: false, shroom: true  },
          { dx: -0.56, dz:  0.12, r: 0.42, h: 0.38, m: 0, moss: true,  shroom: false },
          { dx:  0.04, dz: -0.10, r: 0.43, h: 0.39, m: 1, moss: false, shroom: false },
          { dx:  0.64, dz:  0.14, r: 0.40, h: 0.37, m: 0, moss: true,  shroom: true  },
          { dx:  1.22, dz: -0.12, r: 0.39, h: 0.35, m: 1, moss: false, shroom: false },
          { dx:  1.80, dz:  0.04, r: 0.36, h: 0.32, m: 0, moss: true,  shroom: false }
        ];
        stumps.forEach((st, idx) => {
          const sx = BRIDGE_X + st.dx;
          const sz = BRIDGE_Z + st.dz;
          const sy = getTerrainHeight(sx, sz);

          const stump = new THREE.Mesh(
            new THREE.CylinderGeometry(st.r, st.r * 1.12, st.h, 14),
            [barkMats[st.m], ringTopMat, barkMats[st.m]]
          );
          stump.position.set(sx, sy + 0.18 - st.h * 0.5, sz);
          stump.rotation.y = idx * 0.85;
          stump.castShadow = true;
          stump.receiveShadow = true;
          bridgeGroup.add(stump);

          // Decorative smaller side-stump pilings flanking the crossing
          if (idx % 2 === 1) {
            const sideDir = idx === 1 ? 1 : -1;
            const miniR = st.r * 0.56;
            const miniH = st.h * 0.72;
            const mini = new THREE.Mesh(
              new THREE.CylinderGeometry(miniR, miniR * 1.12, miniH, 10),
              [barkMats[1 - st.m], ringTopMat, barkMats[1 - st.m]]
            );
            mini.position.set(sx + 0.12, sy + 0.11 - miniH * 0.5, sz + sideDir * (st.r + miniR * 0.62));
            mini.castShadow = true;
            mini.receiveShadow = true;
            bridgeGroup.add(mini);
          }

          if (st.moss) {
            const moss = new THREE.Mesh(new THREE.SphereGeometry(0.11, 8, 6), mossMat);
            moss.scale.set(1.25, 0.52, 0.95);
            moss.position.set(sx + st.r * 0.78, sy + 0.13, sz + 0.12);
            bridgeGroup.add(moss);
          }
          if (st.shroom) {
            const sh = new THREE.Mesh(new THREE.SphereGeometry(0.088, 10, 8, 0, Math.PI * 2, 0, Math.PI * 0.55), capMat);
            sh.scale.set(1.15, 0.68, 1.05);
            sh.position.set(sx - st.r * 0.72, sy + 0.10, sz + 0.24);
            bridgeGroup.add(sh);
          }
          if (isInRiver(sx, sz, -0.05)) {
            const halo = new THREE.Mesh(new THREE.RingGeometry(st.r * 1.04, st.r * 1.24, 20), foamMat);
            halo.rotation.x = -Math.PI / 2;
            halo.position.set(sx, sy + 0.044, sz);
            halo.renderOrder = 3;
            bridgeGroup.add(halo);
          }
        });

        return bridgeGroup;
      }

      // ------------------------------------------------------------------

      function isInsideHouseFootprint(x, z, pad) {
        const p = pad || 0;
        return Math.abs(x - HOUSE_X) < (1.48 + p) && Math.abs(z - HOUSE_Z) < (1.28 + p);
      }

      function isInsidePen(x, z, pad) {
        const p = pad || 0;
        return Math.abs(x - PEN_X) < (PEN_W * 0.5 + p) && Math.abs(z - PEN_Z) < (PEN_D * 0.5 + p);
      }

      function buildCottageAndSheepPen() {
        const farmGroup = new THREE.Group();

        // --- A. Cozy Matte-Clay Cottage (Meadow) OR Bedouin Triangular Goat-Hair Tent (Desert) ---
        const houseGroup = new THREE.Group();

        const roofTrimMat = new THREE.MeshStandardMaterial({ color: 0xb52424, roughness: 0.91 });

        cottageHitMesh.position.set(0, 1.2, 0);
        cottageHitMesh.userData.isCottage = true;
        houseGroup.add(cottageHitMesh);
        const frameMat = new THREE.MeshStandardMaterial({ color: 0xfffaf0, roughness: 0.90 });
        const chimneyMat = new THREE.MeshStandardMaterial({ color: 0xc2987a, bumpMap: feltBumpTex, bumpScale: 0.02, roughness: 0.94 });

        if (isDesert) {
          function createBedouinFabricTexture() {
            const c = document.createElement('canvas');
            c.width = 256;
            c.height = 256;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#4e3524';
            ctx.fillRect(0, 0, 256, 256);
            const bands = [
              { y: 0,   h: 44, col: '#3e291c' },
              { y: 44,  h: 10, col: '#d8c3a0' },
              { y: 54,  h: 28, col: '#5c3d28' },
              { y: 82,  h: 8,  col: '#9e4731' },
              { y: 90,  h: 48, col: '#442d1f' },
              { y: 138, h: 12, col: '#e3d2b4' },
              { y: 150, h: 24, col: '#69472e' },
              { y: 174, h: 10, col: '#9b432d' },
              { y: 184, h: 40, col: '#3c271a' },
              { y: 224, h: 10, col: '#d8c3a0' },
              { y: 234, h: 22, col: '#533725' }
            ];
            bands.forEach(b => { ctx.fillStyle = b.col; ctx.fillRect(0, b.y, 256, b.h); });
            ctx.fillStyle = '#3c271a';
            [49, 144, 229].forEach(cy => {
              for (let x = 8; x < 256; x += 16) {
                ctx.beginPath();
                ctx.moveTo(x, cy - 4); ctx.lineTo(x + 4, cy); ctx.lineTo(x, cy + 4); ctx.lineTo(x - 4, cy);
                ctx.closePath(); ctx.fill();
              }
            });
            ctx.strokeStyle = 'rgba(255, 240, 215, 0.06)';
            ctx.lineWidth = 1;
            for (let y = 2; y < 256; y += 4) {
              ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(256, y); ctx.stroke();
            }
            const tex = new THREE.CanvasTexture(c);
            tex.encoding = THREE.sRGBEncoding;
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            return tex;
          }

          const tentClothMat = new THREE.MeshStandardMaterial({

          const poleWoodMat = new THREE.MeshStandardMaterial({ color: 0x6e4a2e, bumpMap: feltBumpTex, bumpScale: 0.018, roughness: 0.94 });

          const rugMainMat = new THREE.MeshStandardMaterial({ color: 0x8f3a29, bumpMap: feltBumpTex, bumpScale: 0.018, roughness: 0.94 });
          const rugTrimMat = new THREE.MeshStandardMaterial({ color: 0xd9c29c, roughness: 0.94 });
          const innerShadowMat = new THREE.MeshStandardMaterial({ color: 0x24160e, roughness: 0.98 });

          const rugBase = new THREE.Mesh(new THREE.BoxGeometry(2.10, 0.05, 2.28), rugMainMat);
          rugBase.position.set(0, 0.025, 0.14); rugBase.receiveShadow = true; houseGroup.add(rugBase);
          const rugBorder = new THREE.Mesh(new THREE.BoxGeometry(1.78, 0.056, 1.94), rugTrimMat);
          rugBorder.position.set(0, 0.026, 0.14); rugBorder.receiveShadow = true; houseGroup.add(rugBorder);
          const rugCenter = new THREE.Mesh(new THREE.BoxGeometry(1.48, 0.06, 1.62), camelClothMat);
          rugCenter.position.set(0, 0.027, 0.14); rugCenter.receiveShadow = true; houseGroup.add(rugCenter);

          const tentHalfW = 1.24, tentDepth = 1.96, eaveY = 0.24, ridgeY = 1.62;
          const slopeRise = ridgeY - eaveY;
          const slopeLen = Math.hypot(tentHalfW, slopeRise) + 0.10;
          const slopeAngle = Math.atan2(slopeRise, tentHalfW);

          [-1, 1].forEach(side => {
            const slopePanel = new THREE.Mesh(new THREE.BoxGeometry(slopeLen, 0.085, tentDepth + 0.16), tentClothMat);
            slopePanel.position.set(side * (tentHalfW * 0.5), eaveY + slopeRise * 0.5, 0);
            slopePanel.rotation.z = -side * slopeAngle;
            slopePanel.castShadow = true; slopePanel.receiveShadow = true;
            houseGroup.add(slopePanel);

            const skirt = new THREE.Mesh(new THREE.BoxGeometry(0.07, eaveY + 0.06, tentDepth), darkBrownMat);
            skirt.position.set(side * (tentHalfW - 0.04), (eaveY + 0.04) * 0.5, 0);
            skirt.castShadow = true; skirt.receiveShadow = true;
            houseGroup.add(skirt);
          });

          const triShape = new THREE.Shape();
          triShape.moveTo(-tentHalfW + 0.03, 0); triShape.lineTo(tentHalfW - 0.03, 0);
          triShape.lineTo(tentHalfW - 0.03, eaveY); triShape.lineTo(0, ridgeY - 0.02); triShape.lineTo(-tentHalfW + 0.03, eaveY);
          triShape.closePath();
          const backWall = new THREE.Mesh(new THREE.ExtrudeGeometry(triShape, { depth: 0.07, bevelEnabled: false }), tentClothMat);

          const innerBack = new THREE.Mesh(new THREE.PlaneGeometry(1.75, 1.25), innerShadowMat);

          const ridgeBeam = new THREE.Mesh(new THREE.CylinderGeometry(0.052, 0.052, tentDepth + 0.42, 8), poleWoodMat);
          ridgeBeam.rotation.x = Math.PI / 2; ridgeBeam.position.set(0, ridgeY + 0.01, 0); ridgeBeam.castShadow = true;
          houseGroup.add(ridgeBeam);

          [-1, 1].forEach(zDir => {
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.042, 0.05, ridgeY + 0.14, 8), poleWoodMat);
            pole.position.set(0, (ridgeY + 0.14) * 0.5, zDir * (tentDepth * 0.5 + 0.04));
            pole.castShadow = true;
            houseGroup.add(pole);
          });

          const frontLeftFlap = new THREE.Mesh(new THREE.BoxGeometry(0.54, 0.84, 0.06), camelClothMat);
          frontLeftFlap.position.set(-0.62, 0.44, tentDepth * 0.5 - 0.02); frontLeftFlap.rotation.z = -0.32; frontLeftFlap.castShadow = true;
          houseGroup.add(frontLeftFlap);
          const frontRightFlap = new THREE.Mesh(new THREE.BoxGeometry(0.54, 0.84, 0.06), camelClothMat);
          frontRightFlap.position.set(0.62, 0.44, tentDepth * 0.5 - 0.02); frontRightFlap.rotation.z = 0.32; frontRightFlap.castShadow = true;
          houseGroup.add(frontRightFlap);

          const lanternBody = new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.075, 0.18, 8), windowGlowMat);
          lanternBody.position.set(0, 1.12, tentDepth * 0.5 - 0.18);
          houseGroup.add(lanternBody);
          const lanternCap = new THREE.Mesh(new THREE.ConeGeometry(0.11, 0.08, 8), darkBrownMat);
          lanternCap.position.set(0, 1.24, tentDepth * 0.5 - 0.18);
          houseGroup.add(lanternCap);

          cottageDoorPivot = new THREE.Group();
          cottageDoorPivot.position.set(-0.34, 0.48, tentDepth * 0.5);
          const curtainFlap = new THREE.Mesh(new THREE.BoxGeometry(0.68, 0.84, 0.05), darkBrownMat);
          curtainFlap.position.set(0.34, 0, 0); curtainFlap.castShadow = true;
          cottageDoorPivot.add(curtainFlap);
          houseGroup.add(cottageDoorPivot);

          [-0.52, 0.52].forEach((cx, idx) => {
            const cushion = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.14, 0.24), idx === 0 ? rugMainMat : camelClothMat);
            cushion.position.set(cx, 0.12, 0.42); cushion.rotation.y = idx === 0 ? 0.24 : -0.22; cushion.castShadow = true;
            houseGroup.add(cushion);

          function addGuyRopeAndStake(ax, ay, az, sx, sz) {
            const stake = new THREE.Mesh(new THREE.CylinderGeometry(0.026, 0.032, 0.24, 6), poleWoodMat);
            stake.position.set(sx, 0.09, sz);
            stake.rotation.z = (sx >= 0 ? -1 : 1) * 0.34;
            stake.rotation.x = (sz >= 0 ? 1 : -1) * 0.22;

            const pA = new THREE.Vector3(ax, ay, az);

            const rope = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.014, dir.length(), 5), ropeMat);

          addGuyRopeAndStake(0, ridgeY, -tentDepth * 0.5 - 0.12, 0, -1.62);

          const fireX = 1.28, fireZ = 0.86;

        } else if (isTreehouse) {
          // Cozy Storybook Hollow-Tree Cabin with Mushroom-Cap Roof & Hobbit Round Door (树洞木屋)

          const doorWoodMat = new THREE.MeshStandardMaterial({ color: 0xa67346, bumpMap: feltBumpTex, bumpScale: 0.016, roughness: 0.91 });

          // Main gnarled hollow trunk body
          const trunkBody = new THREE.Mesh(new THREE.CylinderGeometry(0.92, 1.12, 1.42, 14), trunkMat);
          trunkBody.position.y = 0.98;

          // Exposed buttress roots

            rt.rotation.x = Math.sin(a) * 0.55;
            rt.castShadow = true;

          }

          // Giant storybook spotted mushroom-cap roof + mossy trim
          const roofCap = new THREE.Mesh(new THREE.SphereGeometry(1.48, 22, 14, 0, Math.PI * 2, 0, Math.PI * 0.54), mushCapMat);
          roofCap.scale.set(1.08, 0.72, 1.04);
          roofCap.position.y = 1.54;
          roofCap.castShadow = true; roofCap.receiveShadow = true;
          houseGroup.add(roofCap);

          const gillRim = new THREE.Mesh(new THREE.CylinderGeometry(1.38, 1.15, 0.14, 20), spotMat);
          gillRim.position.y = 1.54;
          houseGroup.add(gillRim);

          [
            [0.0, 2.52, 0.12, 0.20], [0.76, 2.26, 0.46, 0.17], [-0.72, 2.22, 0.52, 0.16],
            [0.42, 2.34, -0.70, 0.16], [-0.58, 2.18, -0.64, 0.15], [1.05, 1.92, -0.15, 0.14], [-1.04, 1.94, 0.08, 0.14]
          ].forEach(([sx, sy, sz, sr]) => {
            const sp = new THREE.Mesh(new THREE.SphereGeometry(sr, 10, 8), spotMat);
            sp.scale.set(1.0, 0.55, 1.0);

          // Moss cushions along roof eaves
          [-0.95, 0.88].forEach((mx, idx) => {

            mPuff.scale.set(1.2, 0.58, 0.9);
            mPuff.position.set(mx, 1.62, idx === 0 ? 0.58 : -0.45);
            houseGroup.add(mPuff);
          });

          // Round Hobbit-style wooden front door (pivots open when squirrels exit!)
          const doorRing = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.075, 10, 20), barkDarkMat);
          doorRing.position.set(0, 0.58, 1.02);

          cottageDoorPivot = new THREE.Group();
          cottageDoorPivot.position.set(-0.38, 0.58, 1.03);
          const roundDoor = new THREE.Mesh(new THREE.CylinderGeometry(0.39, 0.39, 0.08, 18), doorWoodMat);
          roundDoor.rotation.x = Math.PI / 2;
          roundDoor.position.set(0.38, 0, 0);

          const knob = new THREE.Mesh(new THREE.SphereGeometry(0.045, 8, 8), new THREE.MeshStandardMaterial({ color: 0xeab308, roughness: 0.45, metalness: 0.35 }));
          knob.position.set(0.64, 0, 0.05);

            const puff = new THREE.Mesh(smokeGeo, sMat);
            houseGroup.add(puff);

          }
        } else if (isIgloo) {
          // Cozy Matte-Clay Polar Igloo with Warm Lantern & Top Steam Vent (圆顶冰屋)

          const iglooSeamMat = new THREE.MeshStandardMaterial({ color: 0xc8e0f0, bumpMap: feltBumpTex, bumpScale: 0.018, roughness: 0.94 });

          recCrate.add(crateHit);
          recCrate.userData.shakeTimer = 0;
          forestCrateGroup = recCrate;
          forestCrateHitMesh = crateHit;

          recCrate.position.set(rx, ry, rz);
          recCrate.rotation.y = 0.08;
          farmGroup.add(recCrate);

          // Pre-seed 4 acorns at the bottom of the crate so it reads as a nut storage box immediately
          for (let k = 0; k < 4; k++) {
            const n = createNutMesh(1.15);
            n.position.set((k - 1.5) * 0.16, 0.10, ((k % 2) - 0.5) * 0.18);
            n.rotation.set(0.3 * k, k * 1.1, 0.2);
            forestCrateNutsGroup.add(n);
            forestCrateNutCount++;
          }

          // Backup stacked storage boxes in back-left corner
          [[xL + 0.58, zT + 0.48, 0.20, 0.12], [xL + 1.16, zT + 0.46, 0.18, -0.08]].forEach(([bx, bz, bh, br]) => {
            const sb = new THREE.Mesh(new THREE.BoxGeometry(0.48, bh * 2, 0.44), boxTrimMat);
            sb.position.set(bx, getTerrainHeight(bx, bz) + bh, bz);
            sb.rotation.y = br; sb.castShadow = true; sb.receiveShadow = true;
            farmGroup.add(sb);
          });
        } else if (isIgloo) {
          forestCrateNutsGroup = null;
          forestCrateGroup = null;
          forestCrateHitMesh = null;
          onsenSteamPuffs.length = 0;

          // Steaming Open-Air Polar Hot Spring Pool right at (PEN_X - 1.15, PEN_Z + 0.35)!
          const ox = PEN_X - 1.15;
          const oz = PEN_Z + 0.35;
          const oy = getTerrainHeight(ox, oz);
          const onsenGrp = new THREE.Group();

          const rockMats = [
            new THREE.MeshStandardMaterial({ color: 0x7b8b9e, bumpMap: feltBumpTex, bumpScale: 0.025, roughness: 0.94 }),
            new THREE.MeshStandardMaterial({ color: 0x95a5b8, bumpMap: feltBumpTex, bumpScale: 0.024, roughness: 0.93 }),
            new THREE.MeshStandardMaterial({ color: 0xe6f2fa, bumpMap: feltBumpTex, bumpScale: 0.020, roughness: 0.95 })
          ];
          const hotWaterMat = new THREE.MeshStandardMaterial({
            color: 0x5eead4,
            emissive: 0x2dd4bf,
            emissiveIntensity: 0.36,
            roughness: 0.28,
            transparent: true,
            opacity: 0.90
          });

          // Glowing turquoise hot-spring water basin
          const poolDisc = new THREE.Mesh(new THREE.CylinderGeometry(0.84, 0.88, 0.16, 22), hotWaterMat);
          poolDisc.scale.set(1.12, 1.0, 0.94);
          poolDisc.position.y = 0.08;
          poolDisc.receiveShadow = true;
          onsenGrp.add(poolDisc);

          // Natural snowy boulders ringing the hot spring
          for (let k = 0; k < 12; k++) {
            const a = (k / 12) * Math.PI * 2;
            const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(0.22 + (k % 3) * 0.04, 1), rockMats[k % 2]);
            rock.scale.set(1.25, 0.72, 1.02);
            rock.position.set(Math.cos(a) * 0.94, 0.14, Math.sin(a) * 0.80);
            rock.rotation.set(k * 0.4, a, k * 0.2);
            rock.castShadow = true; rock.receiveShadow = true;
            onsenGrp.add(rock);
            if (k % 2 === 0) {
              const snowCap = new THREE.Mesh(new THREE.SphereGeometry(0.14, 8, 6), rockMats[2]);
              snowCap.scale.set(1.2, 0.45, 1.0);
              snowCap.position.set(Math.cos(a) * 0.94, 0.26, Math.sin(a) * 0.80);
              onsenGrp.add(snowCap);
            }
          }

          // Sculpted snow-capped volcanic rock hot-spring spout with trickling turquoise thermal stream
          const spoutBase = new THREE.Mesh(new THREE.DodecahedronGeometry(0.32, 1), rockMats[0]);
          spoutBase.scale.set(1.15, 1.05, 1.05);
          spoutBase.position.set(-0.82, 0.26, -0.58);
          spoutBase.castShadow = true; spoutBase.receiveShadow = true;
          onsenGrp.add(spoutBase);
          const spoutLedge = new THREE.Mesh(new THREE.DodecahedronGeometry(0.20, 1), rockMats[1]);
          spoutLedge.scale.set(1.35, 0.52, 0.92);
          spoutLedge.position.set(-0.62, 0.44, -0.46);
          spoutLedge.rotation.y = -0.55;
          spoutLedge.castShadow = true;
          onsenGrp.add(spoutLedge);
          const spoutSnow = new THREE.Mesh(new THREE.SphereGeometry(0.20, 10, 8, 0, Math.PI * 2, 0, Math.PI * 0.52), rockMats[2]);
          spoutSnow.scale.set(1.15, 0.50, 1.0);
          spoutSnow.position.set(-0.82, 0.52, -0.58);
          onsenGrp.add(spoutSnow);
          const trickle = new THREE.Mesh(new THREE.CylinderGeometry(0.032, 0.052, 0.34, 8), hotWaterMat);
          trickle.position.set(-0.48, 0.26, -0.36);
          trickle.rotation.z = 0.28; trickle.rotation.x = 0.22;
          onsenGrp.add(trickle);

          // Continuous rising warm white steam puffs above the hot spring
          const steamGeo = new THREE.SphereGeometry(0.18, 10, 8);
          for (let k = 0; k < 6; k++) {
            const stMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.98, transparent: true, opacity: 0.52, depthWrite: false });
            const stMesh = new THREE.Mesh(steamGeo, stMat);
            onsenGrp.add(stMesh);
            onsenSteamPuffs.push({ mesh: stMesh, phase: k / 6, angle: k * 1.15, rad: 0.18 + (k % 3) * 0.18 });
          }

          // Clickable proxy for stirring up joyful extra hot-spring steam
          onsenHitMesh = new THREE.Mesh(new THREE.CylinderGeometry(1.05, 1.05, 0.65, 14), new THREE.MeshBasicMaterial({ visible: false }));
          onsenHitMesh.position.y = 0.25;
          onsenHitMesh.userData.isOnsen = true;
          onsenGrp.add(onsenHitMesh);

          onsenGrp.position.set(ox, oy, oz);
          farmGroup.add(onsenGrp);
        } else {
          forestCrateNutsGroup = null;
          forestCrateGroup = null;
          forestCrateHitMesh = null;
          addHayBale(xL + 0.58, zT + 0.46, 0.17, 0.12);
          addHayBale(xL + 1.24, zT + 0.44, 0.17, -0.08);
          addHayBale(xL + 0.90, zT + 0.46, 0.49, 0.05);

          const crateX = xL + 0.62;
          const crateZ = zT + 1.12;
          const crateY = getTerrainHeight(crateX, crateZ);
          const crate = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.36, 0.46), fenceRailMat);
          crate.position.set(crateX, crateY + 0.18, crateZ);
          crate.rotation.y = 0.24;
          crate.castShadow = true;
          crate.receiveShadow = true;
          farmGroup.add(crate);
        }

        return farmGroup;
      }

      // ------------------------------------------------------------------
      // 4. Stylized Matte-Clay Trees, Flowering Trees & Bushes
      // ------------------------------------------------------------------
      const trunkMat = new THREE.MeshStandardMaterial({ color: 0x7c5c44, roughness: 0.95 });
      const greenLeafMats = [
        new THREE.MeshStandardMaterial({ color: 0x6ea838, bumpMap: feltBumpTex, bumpScale: 0.015, roughness: 0.92 }),
        new THREE.MeshStandardMaterial({ color: 0x7eb842, bumpMap: feltBumpTex, bumpScale: 0.015, roughness: 0.92 }),
        new THREE.MeshStandardMaterial({ color: 0x5e952f, bumpMap: feltBumpTex, bumpScale: 0.015, roughness: 0.92 })
      ];
      const pinkLeafMats = [
        new THREE.MeshStandardMaterial({ color: 0xee7eae, bumpMap: feltBumpTex, bumpScale: 0.015, roughness: 0.90 }),
        new THREE.MeshStandardMaterial({ color: 0xf69dc4, bumpMap: feltBumpTex, bumpScale: 0.015, roughness: 0.90 }),
        new THREE.MeshStandardMaterial({ color: 0xe36b9d, bumpMap: feltBumpTex, bumpScale: 0.015, roughness: 0.90 })
      ];

      function createStylizedTree(x, z, scale, isFlowering) {
        const g = new THREE.Group();
        const trunkH = 0.85 * scale;
        const trunk = new THREE.Mesh(
          new THREE.CylinderGeometry(0.11 * scale, 0.17 * scale, trunkH, 8),
          trunkMat
        );
        trunk.position.y = trunkH / 2;
        trunk.castShadow = true;
        trunk.receiveShadow = true;
        g.add(trunk);

        const puffs = [
          { x: 0, y: trunkH + 0.55 * scale, z: 0, r: 0.68 * scale },
          { x: 0.36 * scale, y: trunkH + 0.32 * scale, z: 0.22 * scale, r: 0.46 * scale },
          { x: -0.35 * scale, y: trunkH + 0.36 * scale, z: -0.18 * scale, r: 0.48 * scale },
          { x: -0.14 * scale, y: trunkH + 0.30 * scale, z: 0.36 * scale, r: 0.42 * scale },
          { x: 0.22 * scale, y: trunkH + 0.72 * scale, z: -0.20 * scale, r: 0.42 * scale }
        ];
        puffs.forEach((p, idx) => {
          const m = new THREE.Mesh(
            new THREE.IcosahedronGeometry(p.r, 2),
            greenLeafMats[idx % greenLeafMats.length]
          );
          m.position.set(p.x, p.y, p.z);
          m.castShadow = true;
          m.receiveShadow = true;
          g.add(m);

          // If flowering tree: delicate 5-petal open pink sakura blossoms with golden stamen centers!
          if (isFlowering) {
            const stamenMat = new THREE.MeshStandardMaterial({ color: 0xfde047, roughness: 0.85 });
            const petalGeo = new THREE.CircleGeometry(0.052 * scale, 8);
            const stamenGeo = new THREE.SphereGeometry(0.024 * scale, 6, 6);
            const upVec = new THREE.Vector3(0, 0, 1);
            const blossomCount = idx === 0 ? 18 : 9;
            for (let b = 0; b < blossomCount; b++) {
              const phi = Math.acos(0.16 + ((b * 0.6180339 + idx * 0.23) % 0.80));
              const theta = (b * 2.39996 + idx * 1.7);
              const nx = Math.sin(phi) * Math.cos(theta);
              const ny = Math.cos(phi);
              const nz = Math.sin(phi) * Math.sin(theta);
              const rad = p.r * 1.01;

              const flower = new THREE.Group();
              const fScale = 0.82 + (b % 3) * 0.20;
              const pMat = pinkLeafMats[(b + idx) % pinkLeafMats.length];
              pMat.side = THREE.DoubleSide;

              // 5 delicate open oval petals arranged in a sakura rosette
              for (let k = 0; k < 5; k++) {
                const pa = (k / 5) * Math.PI * 2;
                const petal = new THREE.Mesh(petalGeo, pMat);
                petal.scale.set(0.85 * fScale, 1.32 * fScale, 1);
                petal.position.set(Math.cos(pa) * 0.058 * scale * fScale, Math.sin(pa) * 0.058 * scale * fScale, 0.008);
                petal.rotation.z = pa - Math.PI / 2;
                flower.add(petal);
              }
              // Tiny sunny golden stamen center
              const center = new THREE.Mesh(stamenGeo, stamenMat);
              center.scale.set(fScale, fScale, 0.55 * fScale);
              center.position.z = 0.015;
              flower.add(center);

              flower.position.set(p.x + rad * nx, p.y + rad * ny, p.z + rad * nz);
              const normalVec = new THREE.Vector3(nx, ny, nz).normalize();
              flower.quaternion.setFromUnitVectors(upVec, normalVec);
              flower.rotateZ(b * 1.1);
              g.add(flower);
            }
          }
        });

        g.position.set(x, getTerrainHeight(x, z) - 0.03, z);
        g.rotation.y = (x * 1.7 + z * 2.3) % (Math.PI * 2);
        worldEnvGroup.add(g);
        return g;
      }

      function createDesertPalm(x, z, scale) {
        const g = new THREE.Group();
        const palmTrunkMat = new THREE.MeshStandardMaterial({ color: 0x9c6e46, bumpMap: feltBumpTex, bumpScale: 0.02, roughness: 0.95 });
        const frondMat = new THREE.MeshStandardMaterial({ color: 0x629e42, bumpMap: feltBumpTex, bumpScale: 0.015, roughness: 0.91, side: THREE.DoubleSide });
        const cocoMat = new THREE.MeshStandardMaterial({ color: 0x6b4423, roughness: 0.92 });
        let topX = 0, topY = 0;
        for (let i = 0; i < 5; i++) {
          const rBot = (0.14 - i * 0.014) * scale;
          const rTop = (0.125 - i * 0.014) * scale;
          const h = 0.34 * scale;
          const seg = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBot, h, 8), palmTrunkMat);
          seg.position.set(topX + i * 0.04 * scale, topY + h * 0.5, 0);
          seg.rotation.z = -0.08 * i;
          seg.castShadow = true;
          g.add(seg);
          topX += i * 0.04 * scale;
          topY += h * 0.94;
        }
        const crown = new THREE.Group();
        crown.position.set(topX, topY, 0);
        for (let k = 0; k < 7; k++) {
          const a = (k / 7) * Math.PI * 2;
          const frond = new THREE.Mesh(new THREE.SphereGeometry(0.46 * scale, 10, 8), frondMat);
          frond.scale.set(0.32, 0.12, 1.55);
          frond.position.set(Math.cos(a) * 0.42 * scale, 0.06 * scale, Math.sin(a) * 0.42 * scale);
          frond.rotation.y = -a + Math.PI / 2;
          frond.rotation.x = 0.38;
          frond.castShadow = true;
          crown.add(frond);
        }
        for (let c = 0; c < 3; c++) {
          const ca = (c / 3) * Math.PI * 2;
          const coco = new THREE.Mesh(new THREE.SphereGeometry(0.095 * scale, 8, 8), cocoMat);
          coco.position.set(Math.cos(ca) * 0.14 * scale, -0.06 * scale, Math.sin(ca) * 0.14 * scale);
          crown.add(coco);
        }
        g.add(crown);
        g.position.set(x, getGroundY(x, z) - 0.03, z);
        g.rotation.y = (x * 1.3 + z * 2.1) % (Math.PI * 2);
        worldEnvGroup.add(g);
        return g;
      }

      function createBush(x, z, scale, isFlowering) {
        const g = new THREE.Group();
        const mat = isFlowering ? pinkLeafMats[0] : greenLeafMats[1];
        const offsets = [
          [0, 0.24 * scale, 0, 0.34 * scale],
          [0.24 * scale, 0.18 * scale, 0.12 * scale, 0.25 * scale],
          [-0.22 * scale, 0.20 * scale, -0.10 * scale, 0.26 * scale]
        ];
        offsets.forEach(([ox, oy, oz, r]) => {
          const m = new THREE.Mesh(new THREE.IcosahedronGeometry(r, 1), mat);
          m.position.set(ox, oy, oz);
          m.castShadow = true;
          m.receiveShadow = true;
          g.add(m);
        });
        g.position.set(x, getTerrainHeight(x, z) - 0.02, z);
        worldEnvGroup.add(g);
      }

      // Iconic sparse tree composition scaled to the 30.0 x 18.4 meadow
      const treeSpecs = [
        // Top-edge row of sunlit green trees
        { x: -11.8, z: -7.6, s: 1.02, flower: false },
        { x: -5.2, z: -7.8, s: 0.90, flower: false },
        { x: 1.6, z: -7.9, s: 0.84, flower: false },
        { x: 15.8, z: -6.8, s: 1.04, flower: false },
        // Iconic vibrant pink cherry-blossom tree on the lower-left bank
        { x: -12.0, z: 2.8, s: 1.30, flower: true },
        // Iconic plump bright-green tree at the bottom-right corner
        { x: 15.4, z: 5.3, s: 1.38, flower: false }
      ];
      const bushSpecs = [
        [-11.8, 5.6, 0.85, false],
        [-4.2, 5.4, 0.75, false],
        [7.8, -0.6, 0.72, false],
        [-12.1, -4.4, 0.74, false]
      ];
      const treeGroups = [];
      const petals = [];
      const petalGeo = new THREE.PlaneGeometry(0.11, 0.08);
      const petalMat = new THREE.MeshBasicMaterial({
        color: 0xfbcfe8,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.85
      });

      const nutBodyMat = new THREE.MeshStandardMaterial({ color: 0xc97b2c, bumpMap: feltBumpTex, bumpScale: 0.015, roughness: 0.72 });
      const nutCapMat = new THREE.MeshStandardMaterial({ color: 0x523018, bumpMap: feltBumpTex, bumpScale: 0.022, roughness: 0.94 });
      const nutStemMat = new THREE.MeshStandardMaterial({ color: 0x3f2411, roughness: 0.94 });
      const nutBodyGeo = new THREE.SphereGeometry(0.082, 10, 8);
      const nutCapGeo = new THREE.SphereGeometry(0.088, 10, 8, 0, Math.PI * 2, 0, Math.PI * 0.54);
      const nutStemGeo = new THREE.CylinderGeometry(0.013, 0.016, 0.048, 6);

      function createNutMesh(scale) {
        const sc = scale || 1.0;
        const g = new THREE.Group();
        const body = new THREE.Mesh(nutBodyGeo, nutBodyMat);
        body.scale.set(0.88, 1.15, 0.88);
        body.castShadow = true;
        g.add(body);
        const cap = new THREE.Mesh(nutCapGeo, nutCapMat);
        cap.position.y = 0.022;
        cap.castShadow = true;
        g.add(cap);
        const stem = new THREE.Mesh(nutStemGeo, nutStemMat);
        stem.position.y = 0.098;
        g.add(stem);
        g.scale.setScalar(sc);
        return g;
      }

      function spawnForestGroundNut(dropFromTree, originTree) {
        if (getWorldConfig().flock.species !== 'squirrel') return null;
        if (forestNuts.length >= 26) return null;
        let nx = 0, nz = 0, startY = 0;
        let valid = false;
        for (let tries = 0; tries < 28; tries++) {
          const underPine = originTree ? true : (Math.random() < 0.52);
          if (underPine && treeSpecs.length > 0) {
            const tr = originTree || treeSpecs[(Math.random() * treeSpecs.length) | 0];
            const ang = Math.random() * Math.PI * 2;
            const rad = 0.90 + Math.random() * 2.25;
            nx = tr.x + Math.cos(ang) * rad;
            nz = tr.z + Math.sin(ang) * rad;
            startY = dropFromTree ? (getTerrainHeight(nx, nz) + 1.9 + Math.random() * 0.7) : (getTerrainHeight(nx, nz) + 0.09);
          } else {
            nx = TERRAIN_CENTER_X + (Math.random() - 0.5) * (SLAB_W - 3.2);
            nz = (Math.random() - 0.5) * (SLAB_D - 2.8);
            startY = dropFromTree ? (getTerrainHeight(nx, nz) + 1.1 + Math.random() * 0.5) : (getTerrainHeight(nx, nz) + 0.09);
          }
          if (nx < TERRAIN_MIN_X + 1.4 || nx > TERRAIN_MAX_X - 1.4 || Math.abs(nz) > SLAB_D / 2 - 1.3) continue;
          if (isInRiver(nx, nz, 0.90) || isInsidePen(nx, nz, 0.95) || isInsideHouseFootprint(nx, nz, 0.8)) continue;
          const tooClose = forestNuts.some(fn => Math.hypot(fn.x - nx, fn.z - nz) < 0.62);
          if (!tooClose) { valid = true; break; }
        }
        if (!valid) return null;
        const mesh = createNutMesh(1.42);
        const groundY = getTerrainHeight(nx, nz) + 0.09;
        mesh.position.set(nx, startY, nz);
        mesh.rotation.set((Math.random() - 0.5) * 0.6, Math.random() * Math.PI * 2, (Math.random() - 0.5) * 0.6);
        worldEnvGroup.add(mesh);
        const item = {
          mesh,
          x: nx,
          z: nz,
          groundY,
          vy: 0,
          falling: Boolean(dropFromTree && startY > groundY + 0.15),
          scalePop: dropFromTree ? 0.15 : 1.0,
          claimedBy: null,
          phase: Math.random() * Math.PI * 2
        };
        if (dropFromTree) mesh.scale.setScalar(0.15 * 1.42);
        forestNuts.push(item);
        return item;
      }

      function updateForestNuts(dt, elapsed) {
        if (getWorldConfig().flock.species !== 'squirrel') return;
        for (let i = 0; i < forestNuts.length; i++) {
          const fn = forestNuts[i];
          if (fn.scalePop < 1.0) {
            fn.scalePop = Math.min(1.0, fn.scalePop + dt * 4.2);
            fn.mesh.scale.setScalar(fn.scalePop * 1.42);
          }
          if (fn.falling) {
            fn.vy -= 9.8 * dt;
            fn.mesh.position.y += fn.vy * dt;
            fn.mesh.rotation.x += dt * 4.5;
            if (fn.mesh.position.y <= fn.groundY) {
              fn.mesh.position.y = fn.groundY;
              fn.falling = false;
              fn.vy = 0;
            }
          }
        }
        forestNutSpawnTimer -= dt;
        if (forestNutSpawnTimer <= 0) {
          if (forestNuts.length < 20) spawnForestGroundNut(true);
          forestNutSpawnTimer = 1.2 + Math.random() * 1.3;
        }
      }

      const moundSoilMat = new THREE.MeshStandardMaterial({ color: 0x6b4423, bumpMap: feltBumpTex, bumpScale: 0.028, roughness: 0.96 });
      const moundGeo = new THREE.SphereGeometry(0.18, 10, 8, 0, Math.PI * 2, 0, Math.PI * 0.55);

      function spawnBuryMound(x, z) {
        const g = new THREE.Group();
        const dirt = new THREE.Mesh(moundGeo, moundSoilMat);
        dirt.scale.set(1.22, 0.52, 1.16);
        dirt.receiveShadow = true; dirt.castShadow = true;
        g.add(dirt);
        const capTip = new THREE.Mesh(nutCapGeo, nutCapMat);
        capTip.scale.setScalar(0.85);
        capTip.position.set(0, 0.075, 0);
        g.add(capTip);
        g.position.set(x, getGroundY(x, z) - 0.01, z);
        g.scale.setScalar(0.1);
        worldEnvGroup.add(g);
        buryMounds.push({ mesh: g, life: 0, maxLife: 7.5 });
      }

      function updateBuryMounds(dt) {
        for (let i = buryMounds.length - 1; i >= 0; i--) {
          const bm = buryMounds[i];
          bm.life += dt;
          if (bm.life >= bm.maxLife) {
            worldEnvGroup.remove(bm.mesh);
            buryMounds.splice(i, 1);
            continue;
          }
          const inS = Math.min(1, bm.life * 4.5);
          const outS = Math.min(1, (bm.maxLife - bm.life) * 2.0);
          bm.mesh.scale.setScalar(Math.max(0.01, inS * outS));
        }
      }

      function triggerCrateFountain() {
        if (!forestCrateGroup || !forestCrateNutsGroup || getWorldConfig().flock.species !== 'squirrel') return;
        forestCrateGroup.userData.shakeTimer = 0.7;
        // Empty most stored nuts back out into the forest (keep 3 base nuts in crate)
        while (forestCrateNutsGroup.children.length > 3) {
          forestCrateNutsGroup.remove(forestCrateNutsGroup.children[forestCrateNutsGroup.children.length - 1]);
        }
        forestCrateNutCount = forestCrateNutsGroup.children.length;

        const startX = PEN_X - 1.15;
        const startZ = PEN_Z + 0.35;
        const startY = getTerrainHeight(startX, startZ) + 0.36;
        const launchCount = 8;
        for (let k = 0; k < launchCount; k++) {
          let tx = startX, tz = startZ;
          for (let tries = 0; tries < 20; tries++) {
            const ang = Math.PI * 0.45 + Math.random() * Math.PI * 0.95; // arc out toward open forest
            const dist = 3.2 + Math.random() * 7.5;
            const cx = startX + Math.cos(ang) * dist;
            const cz = startZ + Math.sin(ang) * dist;
            if (cx >= SLAB_MIN_X + 0.8 && cx <= SLAB_MAX_X - 0.8 && Math.abs(cz) <= SLAB_MARGIN_Z - 0.8 && !isInRiver(cx, cz, 0.95) && !isInsidePen(cx, cz, 0.95)) {
              tx = cx; tz = cz; break;
            }
          }
          const nutMesh = createNutMesh(1.42);
          nutMesh.position.set(startX, startY, startZ);
          dioramaGroup.add(nutMesh);
          fountainNuts.push({
            mesh: nutMesh,
            sx: startX, sy: startY, sz: startZ,
            tx, ty: getTerrainHeight(tx, tz) + 0.09, tz,
            t: -k * 0.06,
            dur: 0.92 + Math.random() * 0.32,
            peak: 2.6 + Math.random() * 1.4
          });
        }
        pendingFrenzyOnLand = true;
        showToast('坚果箱喷出松果雨啦，准备抢果！🤯');
      }

      function startSquirrelNutFrenzy() {
        sheepList.forEach(s => {
          if (!s.isSquirrel || s.deleting || s.grabbed || s.herded) return;
          if (s.pairInteraction) clearPairInteraction(s.pairInteraction);
          s.frenzyTimer = 5.5;
          s.forageTarget = null;
          s.foragePickTimer = 0;
          s.forageCooldown = 0;
          s.state = 'Walk';
          s.dropSquash = 0.7;
        });
      }

      function updateFountainNuts(dt) {
        let landedAny = false;
        for (let i = fountainNuts.length - 1; i >= 0; i--) {
          const fn = fountainNuts[i];
          fn.t += dt;
          if (fn.t < 0) continue;
          const p = Math.min(1, fn.t / fn.dur);
          fn.mesh.position.set(
            fn.sx + (fn.tx - fn.sx) * p,
            fn.sy + (fn.ty - fn.sy) * p + Math.sin(p * Math.PI) * fn.peak,
            fn.sz + (fn.tz - fn.sz) * p
          );
          fn.mesh.rotation.x += dt * 8.0;
          fn.mesh.rotation.z += dt * 6.0;
          if (p >= 1) {
            dioramaGroup.remove(fn.mesh);
            if (forestNuts.length < 28 && getWorldConfig().flock.species === 'squirrel') {
              worldEnvGroup.add(fn.mesh);
              forestNuts.push({
                mesh: fn.mesh,
                x: fn.tx,
                z: fn.tz,
                groundY: fn.ty,
                vy: 0,
                falling: false,
                scalePop: 1.0,
                claimedBy: null,
                phase: Math.random() * Math.PI * 2
              });
            }
            fountainNuts.splice(i, 1);
            landedAny = true;
          }
        }
        if (landedAny && pendingFrenzyOnLand) {
          pendingFrenzyOnLand = false;
          startSquirrelNutFrenzy();
        }
      }

      const SHARED_ENV_RESOURCES = new Set([
        contactAOGeo, petalGeo, nutBodyGeo, nutCapGeo, nutStemGeo, moundGeo,
        trunkMat, ...greenLeafMats, ...pinkLeafMats, petalMat,
        nutBodyMat, nutCapMat, nutStemMat, moundSoilMat,
        feltBumpTex, contactAOTex, waterRippleTex
      ]);

      function disposeObject3D(obj) {
        if (!obj) return;
        obj.traverse(node => {
          if (node.geometry && !SHARED_ENV_RESOURCES.has(node.geometry)) {
            node.geometry.dispose();
          }
          if (node.material) {
            const mats = Array.isArray(node.material) ? node.material : [node.material];
            mats.forEach(mat => {
              if (!mat || SHARED_ENV_RESOURCES.has(mat)) return;
              if (mat.map && mat.map !== oceanShimmerTex && !SHARED_ENV_RESOURCES.has(mat.map)) {
                mat.map.dispose();
              }
              mat.dispose();
            });
          }
        });
      }

      const snowTracks = [];
      const snowTrackGeo = new THREE.CircleGeometry(1, 14);
      snowTrackGeo.rotateX(-Math.PI / 2);

      function spawnSnowTrack(x, z, rotY, rx, rz, maxLife) {
        if (!isSouthOcean() || isInRiver(x, z, 0.15)) return;
        if (snowTracks.length >= 65) {
          const oldest = snowTracks.shift();
          dioramaGroup.remove(oldest.mesh);
          oldest.mesh.material.dispose();
        }
        const mat = new THREE.MeshBasicMaterial({
          color: 0x9ac6e4,
          transparent: true,
          opacity: 0.36,
          depthWrite: false
        });
        const m = new THREE.Mesh(snowTrackGeo, mat);
        m.scale.set(rx, 1, rz);
        m.rotation.y = rotY || 0;
        m.position.set(x, getTerrainHeight(x, z) + 0.018, z);
        m.renderOrder = 2;
        dioramaGroup.add(m);
        snowTracks.push({ mesh: m, life: 0, maxLife: maxLife || 4.8, baseOpacity: 0.36 });
      }

      function updateSnowTracks(dt) {
        for (let i = snowTracks.length - 1; i >= 0; i--) {
          const tr = snowTracks[i];
          tr.life += dt;
          if (tr.life >= tr.maxLife) {
            dioramaGroup.remove(tr.mesh);
            tr.mesh.material.dispose();
            snowTracks.splice(i, 1);
            continue;
          }
          const p = tr.life / tr.maxLife;
          tr.mesh.material.opacity = tr.baseOpacity * (1 - p) * (1 - p);
        }
      }

      function clearSnowTracks() {
        while (snowTracks.length > 0) {
          const tr = snowTracks.pop();
          dioramaGroup.remove(tr.mesh);
          tr.mesh.material.dispose();
        }
      }

      function buildWorldEnvironment() {
        clearSnowTracks();
        while (worldEnvGroup.children.length > 0) {
          const child = worldEnvGroup.children[0];
          worldEnvGroup.remove(child);
          disposeObject3D(child);
        }
        treeGroups.length = 0;
        petals.length = 0;
        forestNuts.length = 0;
        buryMounds.length = 0;
        forestPineHitMeshes.length = 0;
        forestGlowMushroomMats.length = 0;
        arcticCrystalMats.length = 0;
        arcticCrystalHitMeshes.length = 0;
        arcticFloeHitMeshes.length = 0;
        auroraBoostTimer = 0;
        auroraGrandTimer = 0;
        iglooTapCount = 0;
        oceanTapCount = 0;
        if (arcticWhale) {
          dioramaGroup.remove(arcticWhale.group);
          disposeObject3D(arcticWhale.group);
          arcticWhale = null;
        }
        while (arcticMeteors.length > 0) {
          const mt = arcticMeteors.pop();
          dioramaGroup.remove(mt.group);
          disposeObject3D(mt.group);
        }
        while (arcticSnowmen.length > 0) {
          const sm = arcticSnowmen.pop();
          dioramaGroup.remove(sm.group);
          disposeObject3D(sm.group);
        }
        if (snowmanBuildEvent) {
          if (snowmanBuildEvent.fxGroup) {
            dioramaGroup.remove(snowmanBuildEvent.fxGroup);
            disposeObject3D(snowmanBuildEvent.fxGroup);
          }
          snowmanBuildEvent = null;
        }
        onsenSteamPuffs.length = 0;
        onsenHitMesh = null;
        oceanShimmerMesh = null;
        forestCrateNutsGroup = null;
        forestCrateGroup = null;
        forestCrateHitMesh = null;
        forestCrateNutCount = 0;
        pendingFrenzyOnLand = false;
        for (let i = 0; i < ARCTIC_FLOES.length; i++) {
          ARCTIC_FLOES[i].occupants.length = 0;
          ARCTIC_FLOES[i].mesh = null;
          ARCTIC_FLOES[i].dip = 0;
          ARCTIC_FLOES[i].dipVel = 0;
        }
        while (arcticShoreFish.length > 0) {
          const sf = arcticShoreFish.pop();
          dioramaGroup.remove(sf.mesh);
        }
        while (flyingArcticFish.length > 0) {
          const ff = flyingArcticFish.pop();
          dioramaGroup.remove(ff.mesh);
        }
        while (fallingNuts.length > 0) {
          const fn = fallingNuts.pop();
          dioramaGroup.remove(fn.mesh);
        }
        while (fountainNuts.length > 0) {
          const fn = fountainNuts.pop();
          dioramaGroup.remove(fn.mesh);
        }

        const terrainStyle = getWorldConfig().env.terrainStyle;
        const isDesert = terrainStyle === 'desert';
        const isForest = terrainStyle === 'forest';
        const isArctic = terrainStyle === 'arctic';
        const texPack = isArctic ? arcticTex : (isForest ? forestTex : (isDesert ? desertTex : meadowTex));
        terrainMat.map = texPack.colorTex;
        terrainMat.alphaMap = texPack.alphaTex;
        terrainMat.needsUpdate = true;
        rebuildTerrainGeometry();
        riverRibbonMesh.visible = !isSouthOcean();

        if (!isSouthOcean()) {
          buildRiverReef();
        } else {
          reefFoamMesh = null;
        }
        const bridgeStyle = getWorldConfig().env.bridgeStyle;
        if (bridgeStyle !== 'none') {
          worldEnvGroup.add(
            bridgeStyle === 'stepping_stones' ? buildDesertSteppingStones()
              : (bridgeStyle === 'log' ? buildForestLogBridge() : buildWoodenBridge())
          );
        }
        worldEnvGroup.add(buildCottageAndSheepPen());

        if (isDesert) {
          const duneMats = [
            new THREE.MeshStandardMaterial({ color: 0xecc478, bumpMap: feltBumpTex, bumpScale: 0.02, roughness: 0.95 }),
            new THREE.MeshStandardMaterial({ color: 0xe0b264, bumpMap: feltBumpTex, bumpScale: 0.02, roughness: 0.95 })
          ];
          DESERT_DUNES.forEach(dn => {
            const dune = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 14, 0, Math.PI * 2, 0, Math.PI * 0.52), duneMats[dn.matIdx]);
            dune.scale.set(dn.rx, dn.ry, dn.rz);
            dune.position.set(dn.x, getTerrainHeight(dn.x, dn.z) - 0.06, dn.z);
            dune.rotation.y = dn.rot;
            dune.receiveShadow = true; dune.castShadow = true;
            worldEnvGroup.add(dune);
          });

          const sandRockMats = [
            new THREE.MeshStandardMaterial({ color: 0xb67247, bumpMap: feltBumpTex, bumpScale: 0.026, roughness: 0.94 }),
            new THREE.MeshStandardMaterial({ color: 0x9c5a34, bumpMap: feltBumpTex, bumpScale: 0.026, roughness: 0.95 }),
            new THREE.MeshStandardMaterial({ color: 0xc98a5b, bumpMap: feltBumpTex, bumpScale: 0.022, roughness: 0.93 })
          ];
          const desertScrubMat = new THREE.MeshStandardMaterial({ color: 0x7b8f4e, bumpMap: feltBumpTex, bumpScale: 0.018, roughness: 0.94 });

          function createSandstoneCluster(rx, rz, sc) {
            const g = new THREE.Group();
            [
              { x: 0, y: 0.24 * sc, z: 0, r: 0.52 * sc, sx: 1.35, sy: 0.72, sz: 1.05, m: 1 },
              { x: 0.08 * sc, y: 0.54 * sc, z: -0.04 * sc, r: 0.36 * sc, sx: 1.20, sy: 0.62, sz: 0.95, m: 0 },
              { x: -0.34 * sc, y: 0.16 * sc, z: 0.24 * sc, r: 0.28 * sc, sx: 1.15, sy: 0.65, sz: 0.92, m: 2 }
            ].forEach((ly, k) => {
              const m = new THREE.Mesh(new THREE.DodecahedronGeometry(ly.r, 1), sandRockMats[ly.m]);
              m.scale.set(ly.sx, ly.sy, ly.sz); m.position.set(ly.x, ly.y, ly.z);
              m.rotation.set(k * 0.25, k * 1.1, k * 0.18);
              m.castShadow = true; m.receiveShadow = true; g.add(m);
            });
            g.position.set(rx, getGroundY(rx, rz) - 0.04, rz);
            g.rotation.y = (rx * 1.4 + rz * 2.2) % (Math.PI * 2);
            worldEnvGroup.add(g);
            return g;
          }

          function createDesertScrub(sx, sz, sc) {
            const g = new THREE.Group();
            [[0, 0.16 * sc, 0, 0.26 * sc], [0.20 * sc, 0.12 * sc, 0.10 * sc, 0.18 * sc], [-0.18 * sc, 0.13 * sc, -0.08 * sc, 0.19 * sc]].forEach(([ox, oy, oz, r]) => {
              const m = new THREE.Mesh(new THREE.IcosahedronGeometry(r, 1), desertScrubMat);
              m.scale.set(1.15, 0.72, 1.10); m.position.set(ox, oy, oz);
              m.castShadow = true; m.receiveShadow = true; g.add(m);
            });
            g.position.set(sx, getGroundY(sx, sz) - 0.02, sz);
            worldEnvGroup.add(g);
          }

          treeSpecs.forEach((t, idx) => {
            const isNearOasis = Math.abs(t.x - getRiverCenterX(t.z)) < 6.8;
            const grp = (isNearOasis || t.flower || idx === 5)
              ? createDesertPalm(t.x, t.z, t.s * 1.08)
              : createSandstoneCluster(t.x, t.z, t.s * 1.12);
            if (isNearOasis || t.flower || idx === 5) treeGroups.push(grp);
            const ao = makeContactAO(0.88 * t.s, 0.88 * t.s, 0.62);
            ao.position.set(t.x, getGroundY(t.x, t.z) + 0.018, t.z);
            worldEnvGroup.add(ao);
          });
          bushSpecs.forEach((b, idx) => {
            if (idx % 2 === 0) createSandstoneCluster(b[0], b[1], b[2] * 0.78);
            else createDesertScrub(b[0], b[1], b[2] * 0.92);
          });
        } else if (isForest) {
          const pineTrunkMat = new THREE.MeshStandardMaterial({ color: 0x6b4528, bumpMap: feltBumpTex, bumpScale: 0.022, roughness: 0.95 });
          const pineMats = [
            new THREE.MeshStandardMaterial({ color: 0x3b6e3a, bumpMap: feltBumpTex, bumpScale: 0.022, roughness: 0.94 }),
            new THREE.MeshStandardMaterial({ color: 0x4d8242, bumpMap: feltBumpTex, bumpScale: 0.022, roughness: 0.93 }),
            new THREE.MeshStandardMaterial({ color: 0xc97b36, bumpMap: feltBumpTex, bumpScale: 0.020, roughness: 0.92 }),
            new THREE.MeshStandardMaterial({ color: 0xd9a13b, bumpMap: feltBumpTex, bumpScale: 0.020, roughness: 0.92 })
          ];
          const fernMat = new THREE.MeshStandardMaterial({ color: 0x568c44, bumpMap: feltBumpTex, bumpScale: 0.018, roughness: 0.94 });
          const mushCapMat = new THREE.MeshStandardMaterial({ color: 0xc94a36, bumpMap: feltBumpTex, bumpScale: 0.018, roughness: 0.90 });
          const mushStemMat = new THREE.MeshStandardMaterial({ color: 0xf7ecd7, roughness: 0.92 });

          function createForestPine(tx, tz, sc, autumnTint) {
            const g = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.11 * sc, 0.17 * sc, 0.85 * sc, 8), pineTrunkMat);
            trunk.position.y = 0.42 * sc; trunk.castShadow = true; trunk.receiveShadow = true;
            g.add(trunk);
            const mat = autumnTint ? pineMats[2 + (Math.abs(Math.round(tx * 3)) % 2)] : pineMats[Math.abs(Math.round(tz * 3)) % 2];
            [
              { y: 1.05, r: 0.78, h: 1.05 },
              { y: 1.62, r: 0.60, h: 0.92 },
              { y: 2.12, r: 0.40, h: 0.78 }
            ].forEach(tier => {
              const cone = new THREE.Mesh(new THREE.ConeGeometry(tier.r * sc, tier.h * sc, 10), mat);
              cone.position.y = tier.y * sc; cone.castShadow = true; cone.receiveShadow = true;
              g.add(cone);
            });
            const pHit = new THREE.Mesh(
              new THREE.CylinderGeometry(0.75 * sc, 0.92 * sc, 2.4 * sc, 8),
              new THREE.MeshBasicMaterial({ visible: false })
            );
            pHit.position.y = 1.25 * sc;
            pHit.userData.pineTree = g;
            g.add(pHit);
            forestPineHitMeshes.push(pHit);
            g.userData = { tx, tz, shakeTimer: 0 };
            g.position.set(tx, getTerrainHeight(tx, tz) - 0.02, tz);
            worldEnvGroup.add(g);
            return g;
          }

          function createMushroomStump(mx, mz, sc) {
            const g = new THREE.Group();
            const stump = new THREE.Mesh(new THREE.CylinderGeometry(0.24 * sc, 0.30 * sc, 0.28 * sc, 9), pineTrunkMat);
            stump.position.y = 0.14 * sc; stump.castShadow = true; stump.receiveShadow = true;
            g.add(stump);
            [
              { x: 0.06, z: 0.04, r: 0.18, h: 0.24 },
              { x: -0.14, z: 0.12, r: 0.12, h: 0.17 },
              { x: 0.18, z: -0.10, r: 0.10, h: 0.14 }
            ].forEach(m => {
              const stem = new THREE.Mesh(new THREE.CylinderGeometry(m.r * 0.32 * sc, m.r * 0.42 * sc, m.h * sc, 7), mushStemMat);
              stem.position.set(m.x * sc, (0.26 + m.h * 0.45) * sc, m.z * sc);
              stem.castShadow = true; g.add(stem);
              const capMatInst = mushCapMat.clone();
              forestGlowMushroomMats.push(capMatInst);
              const cap = new THREE.Mesh(new THREE.SphereGeometry(m.r * sc, 12, 8, 0, Math.PI * 2, 0, Math.PI * 0.55), capMatInst);
              cap.scale.set(1.0, 0.72, 1.0);
              cap.position.set(m.x * sc, (0.26 + m.h * 0.85) * sc, m.z * sc);
              cap.castShadow = true; g.add(cap);
            });
            g.position.set(mx, getTerrainHeight(mx, mz) - 0.02, mz);
            worldEnvGroup.add(g);
            return g;
          }

          function createForestFern(fx, fz, sc) {
            const g = new THREE.Group();
            for (let k = 0; k < 5; k++) {
              const a = (k / 5) * Math.PI * 2;
              const frond = new THREE.Mesh(new THREE.SphereGeometry(0.20 * sc, 8, 6), fernMat);
              frond.scale.set(1.5, 0.42, 0.72);
              frond.position.set(Math.cos(a) * 0.22 * sc, 0.12 * sc, Math.sin(a) * 0.22 * sc);
              frond.rotation.y = -a;
              frond.castShadow = true; g.add(frond);
            }
            g.position.set(fx, getTerrainHeight(fx, fz) - 0.01, fz);
            worldEnvGroup.add(g);
          }

          treeSpecs.forEach((t, idx) => {
            treeGroups.push(createForestPine(t.x, t.z, t.s * 1.05, idx % 3 === 1));
            const ao = makeContactAO(0.95 * t.s, 0.95 * t.s, 0.70);
            ao.position.set(t.x, getTerrainHeight(t.x, t.z) + 0.018, t.z);
            worldEnvGroup.add(ao);
          });
          bushSpecs.forEach((b, idx) => {
            if (idx % 2 === 0) createMushroomStump(b[0], b[1], b[2] * 0.95);
            else createForestFern(b[0], b[1], b[2] * 1.05);
            const ao = makeContactAO(0.55 * b[2], 0.55 * b[2], 0.52);
            ao.position.set(b[0], getTerrainHeight(b[0], b[1]) + 0.016, b[1]);
            worldEnvGroup.add(ao);
          });
          for (let n = 0; n < 20; n++) spawnForestGroundNut(false);
        } else if (isArctic) {
          // Animated southern arctic ocean shimmer surface
          if (!oceanShimmerTex) {
            const sc = document.createElement('canvas');
            sc.width = 512; sc.height = 256;
            const sctx = sc.getContext('2d');
            sctx.clearRect(0, 0, 512, 256);
            sctx.strokeStyle = 'rgba(255, 255, 255, 0.42)';
            sctx.lineCap = 'round';
            for (let i = 0; i < 36; i++) {
              const sx = (i * 67) % 480;
              const sy = 16 + ((i * 43) % 224);
              const len = 28 + (i % 4) * 16;
              sctx.lineWidth = 2.0 + (i % 2) * 1.2;
              sctx.beginPath();
              sctx.moveTo(sx, sy);
              sctx.quadraticCurveTo(sx + len * 0.5, sy + 4, sx + len, sy);
              sctx.stroke();
            }
            oceanShimmerTex = new THREE.CanvasTexture(sc);
            oceanShimmerTex.wrapS = THREE.RepeatWrapping;
            oceanShimmerTex.wrapT = THREE.RepeatWrapping;
            oceanShimmerTex.repeat.set(3.2, 1.4);
          }
          const shimmerGeo = new THREE.PlaneGeometry(SLAB_W - 1.4, 9.6);
          shimmerGeo.rotateX(-Math.PI / 2);
          oceanShimmerMesh = new THREE.Mesh(
            shimmerGeo,
            new THREE.MeshBasicMaterial({ map: oceanShimmerTex, transparent: true, opacity: 0.65, depthWrite: false })
          );
          oceanShimmerMesh.position.set(TERRAIN_CENTER_X, -0.015, 7.35);
          oceanShimmerMesh.renderOrder = 2;
          worldEnvGroup.add(oceanShimmerMesh);

          // 4 Organic Floating Ice Floes bobbing in the southern ocean!
          const floeTopMat = new THREE.MeshStandardMaterial({ color: 0xf0f8ff, bumpMap: feltBumpTex, bumpScale: 0.018, roughness: 0.88 });
          const floeSideMat = new THREE.MeshStandardMaterial({ color: 0x93d4f0, bumpMap: feltBumpTex, bumpScale: 0.016, roughness: 0.72 });
          const floeFoamMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.46, side: THREE.DoubleSide, depthWrite: false });
          ARCTIC_FLOES.forEach(fl => {
            const fg = new THREE.Group();
            const slab = new THREE.Mesh(new THREE.CylinderGeometry(0.96, 1.08, 0.28, 12), [floeSideMat, floeTopMat, floeSideMat]);
            slab.scale.set(fl.rx, 1.0, fl.rz);
            slab.position.y = 0.06;
            slab.castShadow = true; slab.receiveShadow = true;
            fg.add(slab);
            const snowMound = new THREE.Mesh(new THREE.SphereGeometry(0.72, 12, 8, 0, Math.PI * 2, 0, Math.PI * 0.48), floeTopMat);
            snowMound.scale.set(fl.rx * 0.85, 0.16, fl.rz * 0.85);
            snowMound.position.y = 0.18;
            snowMound.receiveShadow = true;
            fg.add(snowMound);
            const foam = new THREE.Mesh(new THREE.RingGeometry(0.98, 1.15, 22), floeFoamMat);
            foam.rotation.x = -Math.PI / 2;
            foam.scale.set(fl.rx, fl.rz, 1.0);
            foam.position.y = -0.02;
            foam.renderOrder = 3;
            fg.add(foam);
            const flHit = new THREE.Mesh(
              new THREE.CylinderGeometry(0.98, 1.05, 0.36, 12),
              new THREE.MeshBasicMaterial({ visible: false })
            );
            flHit.scale.set(fl.rx, 1.0, fl.rz);
            flHit.position.y = 0.14;
            flHit.userData.iceFloe = fl;
            fg.add(flHit);
            arcticFloeHitMeshes.push(flHit);
            fg.position.set(fl.x, 0, fl.z);
            fg.rotation.y = fl.rot;
            worldEnvGroup.add(fg);
            fl.mesh = fg;
          });

          // Snow-laden Nordic spruce trees on northern ice sheet (clickable to shake snow & drop silver fish!)
          const snowTrunkMat = new THREE.MeshStandardMaterial({ color: 0x624938, bumpMap: feltBumpTex, bumpScale: 0.02, roughness: 0.95 });
          const spruceMat = new THREE.MeshStandardMaterial({ color: 0x3b6e68, bumpMap: feltBumpTex, bumpScale: 0.022, roughness: 0.92 });
          const snowCapMat = new THREE.MeshStandardMaterial({ color: 0xf4faff, bumpMap: feltBumpTex, bumpScale: 0.016, roughness: 0.90 });

          function createArcticPine(tx, tz, sc) {
            const g = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.11 * sc, 0.17 * sc, 0.80 * sc, 8), snowTrunkMat);
            trunk.position.y = 0.40 * sc; trunk.castShadow = true; g.add(trunk);
            [
              { y: 1.00, r: 0.78, h: 1.00 },
              { y: 1.56, r: 0.58, h: 0.88 },
              { y: 2.04, r: 0.38, h: 0.72 }
            ].forEach(tier => {
              const cone = new THREE.Mesh(new THREE.ConeGeometry(tier.r * sc, tier.h * sc, 10), spruceMat);
              cone.position.y = tier.y * sc; cone.castShadow = true; cone.receiveShadow = true;
              g.add(cone);
              const cap = new THREE.Mesh(new THREE.ConeGeometry(tier.r * 0.72 * sc, tier.h * 0.52 * sc, 10), snowCapMat);
              cap.position.y = (tier.y + tier.h * 0.25) * sc;
              g.add(cap);
            });
            const pHit = new THREE.Mesh(new THREE.CylinderGeometry(0.75 * sc, 0.92 * sc, 2.4 * sc, 8), new THREE.MeshBasicMaterial({ visible: false }));
            pHit.position.y = 1.25 * sc;
            pHit.userData.pineTree = g;
            g.add(pHit);
            forestPineHitMeshes.push(pHit);
            g.userData = { tx, tz, shakeTimer: 0 };

          function createIceCrystalCluster(cx, cz, sc) {
            const g = new THREE.Group();

              color: 0x54687d, bumpMap: feltBumpTex, bumpScale: 0.024, roughness: 0.92

            const rockBase = new THREE.Mesh(new THREE.DodecahedronGeometry(0.36 * sc, 1), baseRockMat);

            arcticCrystalMats.push(crystalEntry);
            [
              { x:  0.00, z:  0.00, h: 0.96, r: 0.21, rx:  0.04, rz: -0.04 },
              { x:  0.25, z:  0.10, h: 0.66, r: 0.15, rx:  0.16, rz: -0.28 },
              { x: -0.24, z:  0.08, h: 0.72, r: 0.16, rx: -0.10, rz:  0.26 },

            ].forEach((sh, idx) => {
              const spire = new THREE.Mesh(new THREE.CylinderGeometry(0.022, sh.r * sc, sh.h * sc, 6), cMat);
              spire.position.set(sh.x * sc, (0.10 + sh.h * 0.45) * sc, sh.z * sc);
              spire.rotation.set(sh.rx, idx * 0.65, sh.rz);
              spire.castShadow = true;
              g.add(spire);
              if (idx === 0) {
                const core = new THREE.Mesh(new THREE.CylinderGeometry(0.01, sh.r * 0.46 * sc, sh.h * 0.78 * sc, 6), innerCoreMat);
                core.position.copy(spire.position);
                core.rotation.copy(spire.rotation);
                g.add(core);
              }
            });
            const cHit = new THREE.Mesh(
              new THREE.CylinderGeometry(0.58 * sc, 0.66 * sc, 1.15 * sc, 8),

            cHit.position.y = 0.52 * sc;

            const ao = makeContactAO(0.56 * sc, 0.52 * sc, 0.58);
            ao.position.y = 0.03;

            g.position.set(cx, getTerrainHeight(cx, cz) - 0.02, cz);

          const arcticTrees = [
            { x: -13.2, z: -6.8, s: 1.08 },

          arcticTrees.forEach(t => {

          });
          [[-11.8, 0.5, 1.05], [-3.8, -4.8, 0.92], [5.8, -0.4, 0.95], [13.5, -2.6, 0.88]].forEach(([cx, cz, sc]) => {

          });
        }

        const pebbleMats = [
          new THREE.MeshStandardMaterial({ color: isDesert ? 0xc28a5c : 0xc8c0ae, roughness: 0.92 }),
          new THREE.MeshStandardMaterial({ color: isDesert ? 0xa87046 : 0xb5ad9c, roughness: 0.92 }),
          new THREE.MeshStandardMaterial({ color: isDesert ? 0xd9a87a : 0xd8d1c1, roughness: 0.90 })
        ];
        let pSeed = 9001;
        function pRand() {
          pSeed = (pSeed * 16807) % 2147483647;
          return (pSeed - 1) / 2147483646;
        }
        const pebbleCount = isArctic ? 0 : 34;
        for (let i = 0; i < pebbleCount; i++) {
          const pz = (pRand() - 0.5) * (SLAB_D - 1.2);
          const side = i % 2 === 0 ? 1 : -1;
          const px = getRiverCenterX(pz) + side * (getRiverHalfWidth(pz) + 0.08 + pRand() * 0.28);
          if (isOnBridge(px, pz, 0.35)) continue;
          const r = 0.07 + pRand() * 0.09;
          const pebble = new THREE.Mesh(new THREE.DodecahedronGeometry(r, 1), pebbleMats[i % pebbleMats.length]);

          const tuft = new THREE.Group();
          for (let k = 0; k < 3; k++) {
            const blade = new THREE.Mesh(tuftGeo, tuftMat);
            blade.position.set((k - 1) * 0.045, 0.08, (k % 2) * 0.03);

          worldEnvGroup.add(tuft);

        const forestLeafPalette = [0x82b34e, 0xd98b3c, 0xe5ba5c, 0xc85a32];
        const flowerTrees = treeSpecs.filter(t => t.flower);
        for (let i = 0; i < 16; i++) {
          const origin = flowerTrees[i % flowerTrees.length];
          const pMat = petalMat.clone();
          const baseColorHex = isArctic
            ? (i % 2 === 0 ? 0xe0f2fe : 0xbae6fd)
            : (isForest
              ? forestLeafPalette[i % forestLeafPalette.length]

          pMat.color.setHex(baseColorHex);
          const m = new THREE.Mesh(petalGeo, pMat);
          const p = {
            mesh: m,
            originX: origin.x,
            originZ: origin.z,
            phase: pRand() * Math.PI * 2,
            speed: 0.32 + pRand() * 0.22,
            y: 0.4 + pRand() * 1.9,
            driftR: 0.4 + pRand() * 0.8,
            baseColorHex
          };
          m.position.set(isDesert ? (TERRAIN_MIN_X + pRand() * SLAB_W) : origin.x, p.y, isDesert ? ((pRand() - 0.5) * SLAB_D) : origin.z);
          worldEnvGroup.add(m);
          petals.push(p);
        }
      }
      buildWorldEnvironment();

      // ------------------------------------------------------------------

      const cloudMat = new THREE.MeshStandardMaterial({

      const clouds = [];
      function createCloud(x, y, z, scale, speedX, speedZ) {
        const g = new THREE.Group();
        const puffs = [
          [0, 0, 0, 1.15],
          [0.95, -0.1, 0.25, 0.88],
          [-0.95, -0.12, -0.15, 0.92],
          [0.35, 0.35, -0.25, 0.80],
          [-0.4, 0.28, 0.3, 0.78],
          [1.6, -0.22, -0.05, 0.65],
          [-1.55, -0.24, 0.1, 0.62]
        ];
        puffs.forEach(([px, py, pz, r]) => {
          const m = new THREE.Mesh(new THREE.SphereGeometry(r * scale, 16, 14), cloudMat);
          m.position.set(px * scale, py * scale, pz * scale);
          m.castShadow = true;
          m.renderOrder = 1500;
          g.add(m);
        });
        g.position.set(x, y, z);
        dioramaGroup.add(g);
        clouds.push({ group: g, speedX, speedZ });
      }

      // Base iconic cloud + randomly add 0–2 extra fluffy clouds (total 1–3 clouds)
      function populateClouds() {
        clouds.forEach(c => dioramaGroup.remove(c.group));
        clouds.length = 0;

        // Primary signature cloud near upper-right
        createCloud(3.8, 5.4, -6.7, 1.02, 0.18, 0.02);

        const extraCount = Math.floor(Math.random() * 3); // 0, 1, or 2 extra clouds
        const extraSlots = [
          { x: -8.6 + (Math.random() - 0.5) * 2.8, y: 5.7, z: -5.1 + (Math.random() - 0.5) * 1.6, s: 0.82 + Math.random() * 0.24, sx: 0.14 + Math.random() * 0.06, sz: 0.015 },
          { x: 8.2 + (Math.random() - 0.5) * 2.6,  y: 5.2, z: 5.6 + (Math.random() - 0.5) * 1.4,  s: 0.86 + Math.random() * 0.24, sx: 0.16 + Math.random() * 0.06, sz: 0.02 }
        ];
        // Shuffle extra slots when picking 1 so its position varies naturally
        if (Math.random() < 0.5) extraSlots.reverse();
        for (let i = 0; i < extraCount; i++) {
          const sl = extraSlots[i];
          createCloud(sl.x, sl.y, sl.z, sl.s, sl.sx, sl.sz);

      }
      populateClouds();

      // ------------------------------------------------------------------

      const woolMat = new THREE.MeshStandardMaterial({

      // Crisp cartoon '?' texture for Idle look-up animation
      function createQuestionMarkTexture() {
        const c = document.createElement('canvas');

        c.height = 224;

        ctx.clearRect(0, 0, 224, 224);

        // Generous padding so thick white sticker outline & drop shadow never clip

      const questionMarkTex = createQuestionMarkTexture();

      // Cute cartoon angry mark ('💢' style) texture with white sticker outline
      function createAngryMarkTexture() {
        const c = document.createElement('canvas');
        c.width = 160;
        c.height = 160;
        const ctx = c.getContext('2d');
        ctx.clearRect(0, 0, 160, 160);

        function drawAngerPaths(strokeStyle, lineWidth, withShadow) {
          ctx.save();
          ctx.translate(80, 80);
          ctx.strokeStyle = strokeStyle;
          ctx.lineWidth = lineWidth;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          if (withShadow) {
            ctx.shadowColor = 'rgba(15, 23, 42, 0.24)';
            ctx.shadowBlur = 10;
            ctx.shadowOffsetY = 5;
          }
          // 4 symmetric anime anger-vein L-curves
          const corners = [
            [-1, -1],
            [1, -1],
            [1, 1],
            [-1, 1]
          ];
          corners.forEach(([sx, sy]) => {
            ctx.beginPath();
            ctx.moveTo(sx * 44, sy * 16);
            ctx.quadraticCurveTo(sx * 16, sy * 16, sx * 16, sy * 44);
            ctx.stroke();
          });
          ctx.restore();
        }

        // Thick white sticker border + shadow
        drawAngerPaths('#ffffff', 28, true);
        // Cute coral-red inner cartoon strokes
        drawAngerPaths('#ef4444', 14, false);

        const tex = new THREE.CanvasTexture(c);
        tex.encoding = THREE.sRGBEncoding;
        return tex;
      }
      const angryMarkTex = createAngryMarkTexture();

      // Cute glossy pink cartoon heart texture ('💗' style) with white sticker outline
      function createHeartTexture() {
        const c = document.createElement('canvas');
        c.width = 224;
        c.height = 224;
        const ctx = c.getContext('2d');
        ctx.clearRect(0, 0, 224, 224);

        function traceHeart(scale) {
          ctx.beginPath();
          ctx.moveTo(0, 34 * scale);
          ctx.bezierCurveTo(-58 * scale, -6 * scale, -66 * scale, -52 * scale, -28 * scale, -56 * scale);
          ctx.bezierCurveTo(-8 * scale, -58 * scale, 0, -40 * scale, 0, -30 * scale);
          ctx.bezierCurveTo(0, -40 * scale, 8 * scale, -58 * scale, 28 * scale, -56 * scale);
          ctx.bezierCurveTo(66 * scale, -52 * scale, 58 * scale, -6 * scale, 0, 34 * scale);
          ctx.closePath();
        }

        ctx.save();
        ctx.translate(112, 122);

        ctx.strokeStyle = 'rgba(244, 114, 182, 0.42)';
        ctx.lineWidth = 6;
        traceHeart(1.42);

        ctx.shadowColor = 'rgba(15, 23, 42, 0.22)';
        ctx.shadowBlur = 12;
        ctx.shadowOffsetY = 5;
        ctx.lineWidth = 22;
        ctx.lineJoin = 'round';
        ctx.strokeStyle = '#ffffff';
        traceHeart(1.0);
        ctx.stroke();

        const c = document.createElement('canvas');
        c.width = 224;
        c.height = 224;
        const ctx = c.getContext('2d');
        ctx.clearRect(0, 0, 224, 224);

        function traceOuterFlame() {
          ctx.beginPath();
          ctx.moveTo(0, 62);
          ctx.bezierCurveTo(-52, 62, -62, 16, -42, -16);
          ctx.bezierCurveTo(-34, -28, -22, -26, -24, -12);
          ctx.bezierCurveTo(-18, -42, -2, -64, 12, -74);
          ctx.bezierCurveTo(6, -48, 22, -36, 36, -18);
          ctx.bezierCurveTo(58, 12, 54, 62, 0, 62);
          ctx.closePath();
        }

        function traceInnerFlame() {
          ctx.beginPath();
          ctx.moveTo(0, 56);
          ctx.bezierCurveTo(-26, 56, -32, 28, -18, 8);
          ctx.bezierCurveTo(-12, 0, -6, 4, -8, 12);
          ctx.bezierCurveTo(-4, -8, 6, -22, 12, -26);
          ctx.bezierCurveTo(10, -10, 20, -2, 24, 14);
          ctx.bezierCurveTo(32, 34, 24, 56, 0, 56);
          ctx.closePath();

        ctx.save();

        ctx.shadowColor = 'rgba(15, 23, 42, 0.24)';
        ctx.shadowBlur = 12;
        ctx.shadowOffsetY = 5;
        ctx.lineWidth = 22;
        ctx.lineJoin = 'round';
        ctx.strokeStyle = '#ffffff';
        traceOuterFlame();
        ctx.stroke();

        // Vibrant orange-red outer flame
        ctx.shadowColor = 'transparent';
        const outerGrad = ctx.createLinearGradient(0, -72, 0, 62);
        outerGrad.addColorStop(0, '#fb923c');
        outerGrad.addColorStop(0.55, '#f97316');
        outerGrad.addColorStop(1, '#ef4444');
        ctx.fillStyle = outerGrad;
        traceOuterFlame();

        const innerGrad = ctx.createLinearGradient(0, -26, 0, 56);
        innerGrad.addColorStop(0, '#fef08a');
        innerGrad.addColorStop(1, '#facc15');

        traceInnerFlame();
        ctx.fill();

        ctx.restore();
        const tex = new THREE.CanvasTexture(c);
        tex.encoding = THREE.sRGBEncoding;
        return tex;

      function updateArcticFishItems(dt, elapsed) {
        for (let i = flyingArcticFish.length - 1; i >= 0; i--) {
          const ff = flyingArcticFish[i];
          ff.t += dt / ff.dur;
          const p = Math.min(1, ff.t);
          ff.mesh.position.set(
            ff.sx + (ff.tx - ff.sx) * p,
            ff.sy + (ff.ty - ff.sy) * p + Math.sin(p * Math.PI) * ff.peak,
            ff.sz + (ff.tz - ff.sz) * p
          );
          ff.mesh.rotation.x += dt * 10.0;
          ff.mesh.rotation.z += dt * 7.5;
          if (p >= 1) {
            ff.mesh.rotation.set(0, Math.random() * Math.PI * 2, Math.PI * 0.48);
            arcticShoreFish.push({ mesh: ff.mesh, x: ff.tx, z: ff.tz, life: 18.0, phase: Math.random() * 6.28, claimedBy: null });
            flyingArcticFish.splice(i, 1);
          }
        }
        for (let i = arcticShoreFish.length - 1; i >= 0; i--) {
          const sf = arcticShoreFish[i];
          sf.life -= dt;
          sf.mesh.position.y = getTerrainHeight(sf.x, sf.z) + 0.08 + Math.abs(Math.sin(elapsed * 9.5 + sf.phase)) * 0.045;
          sf.mesh.rotation.y += Math.sin(elapsed * 12 + sf.phase) * dt * 1.4;
          if (sf.life <= 0) {
            dioramaGroup.remove(sf.mesh);
            arcticShoreFish.splice(i, 1);
          }
        }
      }
