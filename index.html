        bodyRig.add(purrSprite);

        // Red Panda dedicated mood sticker sprite (☁️ rest / ⚡ threaten / 💫 dizzy)
        const pandaMoodMat = new THREE.SpriteMaterial({
          map: cloudRestTex,
          transparent: true,
          opacity: 0,
          depthTest: false,
          depthWrite: false
        });
        const pandaMoodSprite = new THREE.Sprite(pandaMoodMat);
        pandaMoodSprite.position.set(0.0, 1.48, 0.18);
        pandaMoodSprite.scale.set(0.01, 0.01, 1);
        pandaMoodSprite.renderOrder = 1000;
        pandaMoodSprite.visible = false;
        bodyRig.add(pandaMoodSprite);

        const hitMesh = new THREE.Mesh(
          new THREE.BoxGeometry(isPolarBear ? 1.05 : 0.92, isPolarBear ? 0.98 : 0.92, isPolarBear ? 1.32 : 1.20),
          new THREE.MeshBasicMaterial({ visible: false })
        );
        hitMesh.position.set(0, 0.42, 0.04);
        bodyRig.add(hitMesh);

        const cat = {
          isCat: true,
          isFennec,
          isRedPanda,
          isPolarBear,
          swimAction: null,
          swimCooldown: 7 + Math.random() * 8,
          fishCycle: 0,
          fishSwatted: false,
          rollCycle: 0,
          rollFxTimer: 0.2,
          pandaBlush,
          pandaBamboo,
          pandaMoodSprite,
          pandaMoodPop: 0,
          threatenCycle: 0,
          tumbleCycle: 0,
          bambooFxTimer: 0.3,
          foxTongue,
          listenTimer: 0,
          digFxTimer: 0.2,
          leapPhase: 0,
          id: isPolarBear ? 'polar-bear' : (isRedPanda ? 'red-panda' : (isFennec ? 'fennec-fox' : 'golden-cat')),
          root,
          bodyRig,
          torsoPivot,
          headPivot,
          legs,
          earPivots,
          openEyes,
          closedLids,
          tailBase,
          tailTipPivot,
          catAO,
          zzzSprite,
          zzzPop: 0,
          angrySprite: catAngrySprite,
          angryPop: 0,
          hitMesh,
          state: 'Sleep',
          stateTimer: 32 + Math.random() * 12,
          wakeStretchTimer: 0,
          phase: 0.4,
          targetRotY: rotY,
          walkTurnTimer: 2.5,
          avoidCooldown: 0,
          scratchFxTimer: 0.2,
          angerTimer: 0,
          angerTarget: null,
          disturbCooldown: 0,
          fishCraveSprite,
          fishCravePop: 0,
          shieldSprite,
          shieldPop: 0,
          purrSprite,
          purrPop: 0,
          purrTimer: 0,
          petEnergy: 0,
          startleTimer: 0,
          butterflyHunt: null,
          pounceCooldown: 4.0,
          onRoofTimer: 0,
          watchFish: null,
          watchTimer: 0,
          watchCooldown: 0,
          reefAction: null,
          reefCooldown: 0,
          boltingTimer: 0,
          boltElapsed: 0,
          dropSquash: 0,
          deleting: false,
          grabbed: false,
          dimScaleW: isPolarBear ? 3.20 : 1.82,
          dimScaleH: isPolarBear ? 2.15 : 1.15
        };
        hitMesh.userData.sheep = cat;

        dioramaGroup.add(root);
        return cat;
      }

      function initGoldenCat() {
        if (goldenCat) {
          dioramaGroup.remove(goldenCat.root);
        }
        goldenCat = createGoldenCat(1.4, -0.6, 0.0);
      }
      initGoldenCat();

      function updateGoldenCat(dt, elapsed) {
        if (!goldenCat) return;
        const c = goldenCat;
        const t = elapsed + c.phase;

        if (c.avoidCooldown > 0) c.avoidCooldown = Math.max(0, c.avoidCooldown - dt);
        if (c.disturbCooldown > 0) c.disturbCooldown = Math.max(0, c.disturbCooldown - dt);

        const turnRate = (c.grabbed || c.angerTimer > 0 || c.boltingTimer > 0) ? 14.0 : (c.avoidCooldown > 0 ? 9.5 : 5.5);
        c.root.rotation.y += shortestAngleDiff(c.root.rotation.y, c.targetRotY) * Math.min(1, dt * turnRate);
        const gRule = getWorldRules().guardian;
        if (c.onRoofTimer > 0 && !gRule.canClimbRoof) c.onRoofTimer = 0;
        const baseGY = c.onRoofTimer > 0 ? (getTerrainHeight(HOUSE_X, HOUSE_Z) + 2.18) : getGroundY(c.root.position.x, c.root.position.z);
        const targetGY = c.grabbed ? baseGY + 1.55 : baseGY;
        c.root.position.y += (targetGY - c.root.position.y) * Math.min(1, dt * (c.grabbed ? 18 : 14));

        if (c.dropSquash > 0) c.dropSquash = Math.max(0, c.dropSquash - dt * 4.0);

        if (c.watchCooldown > 0) c.watchCooldown = Math.max(0, c.watchCooldown - dt);
        if (c.reefCooldown > 0) c.reefCooldown = Math.max(0, c.reefCooldown - dt);
        if (c.swimCooldown > 0) c.swimCooldown = Math.max(0, c.swimCooldown - dt);

        // Polar Bear autonomous swim out to an empty floating ice floe to nap!
        if (c.isPolarBear && !c.grabbed && !herdingEvent && c.angerTimer <= 0 && c.boltingTimer <= 0 && !c.swimAction && c.swimCooldown <= 0 && c.state === 'Walk') {
          const coastDist = getArcticCoastZ(c.root.position.x) - c.root.position.z;
          if (coastDist < 2.2) {
            c.swimCooldown = 18.0;
            const freeFloe = ARCTIC_FLOES.find(fl => fl.occupants.length === 0);
            if (freeFloe && Math.random() < 0.55 && claimFloe(freeFloe, c)) {
              c.swimAction = {
                phase: 'to_floe', floe: freeFloe, loungeTimer: 7.5 + Math.random() * 4.0,
                shoreX: c.root.position.x, shoreZ: getArcticCoastZ(c.root.position.x) - 0.95,
                rippleT: 0.15, enteredWater: false
              };
            }
          }
        }

        function startCatReefJump(mode, alreadyOnReef) {
          const curBank = c.root.position.x >= getRiverCenterX(c.root.position.z) ? 1 : -1;
          const targetBankSide = mode === 'cross' ? -curBank : (Math.random() < 0.5 ? curBank : -curBank);
          c.watchFish = null;
          c.wakeStretchTimer = 0;
          c.reefAction = {
            mode, // 'sit' (sit on reef watching fish) | 'cross' (use reef as stepping stone to opposite bank)
            phase: alreadyOnReef ? 'perched' : 'jump_to_reef',
            t: 0,
            duration: 0.62,
            startX: c.root.position.x,
            startY: c.root.position.y,
            startZ: c.root.position.z,
            endX: REEF_X,
            endY: REEF_TOP_Y,
            endZ: REEF_Z,
            targetBankSide,
            perchTimer: mode === 'sit' ? (5.5 + Math.random() * 3.5) : 0.42
          };
        }

        // Autonomous trigger: when cat is walking or near the riverbank close to the river reef, jump onto it to watch fish or cross to the opposite bank!
        if (
          gRule.canReefFish &&
          !c.grabbed && c.angerTimer <= 0 && c.boltingTimer <= 0 && !c.reefAction &&
          c.reefCooldown <= 0 && (c.state === 'Walk' || c.watchFish)
        ) {
          const distReef = Math.hypot(c.root.position.x - REEF_X, c.root.position.z - REEF_Z);
          if (distReef < 3.45 && !isOnReef(c.root.position.x, c.root.position.z, 0.1)) {
            c.reefCooldown = 14.0;
            if (Math.random() < 0.68) {
              const mode = Math.random() < 0.52 ? 'sit' : 'cross';
              startCatReefJump(mode, false);
            }
          }
        }

        // Check if cat is near the riverbank and spots a swimming fish -> enter excited fish-watching/stalking mode!
        if (gRule.canReefFish && !c.grabbed && c.angerTimer <= 0 && c.boltingTimer <= 0 && !c.reefAction && !isOnBridge(c.root.position.x, c.root.position.z, 0.2)) {
          const distToRiverEdge = Math.abs(c.root.position.x - getRiverCenterX(c.root.position.z)) - getRiverHalfWidth(c.root.position.z);
          if (!c.watchFish && c.watchCooldown <= 0 && distToRiverEdge < 2.8 && fishList.length > 0) {
            let bestFish = null;
            let bestD = 4.8;
            for (let i = 0; i < fishList.length; i++) {
              const f = fishList[i];
              if (f.mat.opacity < 0.2) continue;
              const d = Math.hypot(
                f.group.position.x - c.root.position.x,
                f.group.position.z - c.root.position.z
              );
              if (d < bestD) {
                bestD = d;
                bestFish = f;
              }
            }
            if (bestFish) {
              c.watchFish = bestFish;
              c.watchTimer = 8.0;
              c.wakeStretchTimer = 0;
            }
          }
        }

        if (c.pounceCooldown > 0) c.pounceCooldown = Math.max(0, c.pounceCooldown - dt);
        if (c.petEnergy > 0) c.petEnergy = Math.max(0, c.petEnergy - dt * 0.65);

        // Spot a fluttering butterfly nearby -> enter classic butt-wiggle pounce!
        if (gRule.canHuntButterflies && !c.grabbed && c.angerTimer <= 0 && c.boltingTimer <= 0 && !c.watchFish && !c.reefAction && !herdingEvent && !c.butterflyHunt && c.onRoofTimer <= 0 && c.pounceCooldown <= 0 && c.state !== 'Sleep') {
          for (let i = 0; i < butterflies.length; i++) {
            const bf = butterflies[i];
            const d = Math.hypot(bf.group.position.x - c.root.position.x, bf.group.position.z - c.root.position.z);
            if (d < 3.4) {
              c.pounceCooldown = 14.0;
              if (Math.random() < 0.55) {
                c.butterflyHunt = { target: bf, phase: 'wiggle', t: 0 };
              }
              break;
            }
          }
        }

        if (!c.grabbed && c.angerTimer <= 0 && c.wakeStretchTimer <= 0 && c.boltingTimer <= 0 && !c.watchFish && !c.reefAction && !c.swimAction && !herdingEvent && !c.butterflyHunt && c.onRoofTimer <= 0 && c.purrTimer <= 0) {
          c.stateTimer -= dt;
          if (c.stateTimer <= 0) {
            if (c.state === 'Sleep') {
              c.wakeStretchTimer = 2.4;
              c.state = c.isPolarBear ? 'Sniff' : (c.isFennec ? 'Listen' : (c.isRedPanda ? 'Bamboo' : 'Scratch'));
              c.stateTimer = 5.0 + Math.random() * 2.5;
            } else {
              const ids = gRule.states.map(st => st.id).filter(id => id !== c.state);
              c.state = ids[(Math.random() * ids.length) | 0];
              c.stateTimer = c.state === 'Sleep'
                ? (30 + Math.random() * 15)
                : ((c.state === 'Dig' || c.state === 'Leap') ? (3.6 + Math.random() * 1.2) : (5.5 + Math.random() * 4.5));
            }
            if (selectedSheep === c) syncToolbarActiveButton();
          }
        }

        if (c.state === 'Sleep' && c.angerTimer <= 0 && c.disturbCooldown <= 0) {
          for (let i = 0; i < sheepList.length; i++) {
            const sh = sheepList[i];
            if (sh.deleting || sh.grabbed) continue;
            const d = Math.hypot(
              sh.root.position.x - c.root.position.x,
              sh.root.position.z - c.root.position.z
            );
            if (d < 1.32) {
              c.angerTimer = 3.2;
              c.angerTarget = sh;
              c.disturbCooldown = 12.0;
              // Offending sheep gets embarrassed & scared!
              sh.scaredTimer = 3.2;
              sh.scaredTarget = c;
              sh.angerTimer = 0;
              sh.vaultTime = 0;
              break;
            }
          }
        }

        let bodyY = 0.0;
        let bodyPitch = 0.0;
        let bodyRoll = 0.0;
        let torsoY = c.isPolarBear ? 0.40 : 0.36;
        let torsoPitch = 0.0;
        let torsoSX = 1.0, torsoSY = 1.0, torsoSZ = 1.0;
        let headX = 0.0, headY = 0.0, headZ = 0.0;
        let earFlatten = 0.0;
        let tailBaseX = 0.35, tailBaseY = 0.0;
        let tailTipX = 0.45, tailTipY = 0.0;
        let legRotX = [0, 0, 0, 0];
        let legRotZ = [0, 0, 0, 0];
        let legY = c.isPolarBear ? [0.38, 0.38, 0.40, 0.40] : [0.30, 0.30, 0.30, 0.30];
        let bearSwimmingInWater = false;
        let eyesClosed = false;
        let showZzz = false;
        let showAngry = false;
        let showFishCrave = false;
        let showShield = false;
        let showPurr = false;
        let pandaMoodTex = null;
        if (c.pandaBamboo) c.pandaBamboo.visible = false;
        if (c.pandaBlush) c.pandaBlush.forEach(bl => { bl.visible = false; });

        if (c.grabbed && c.isRedPanda) {
          // Red Panda frantic protest when lifted: 4 paws flailing outward + striped tail spinning like a propeller!
          c.targetRotY = Math.atan2(
            camera.position.x - c.root.position.x,
            camera.position.z - c.root.position.z
          );
          bodyY = 0.24 + Math.sin(t * 16.0) * 0.05;
          bodyPitch = -0.92 + Math.cos(t * 14.0) * 0.14;
          bodyRoll = Math.sin(t * 18.0) * 0.22;
          torsoY = 0.36;
          headX = 0.65 + Math.sin(t * 20.0) * 0.12;
          headY = Math.sin(t * 24.0) * 0.36;
          earFlatten = 0.32;
          legY = [0.28, 0.28, 0.24, 0.24];
          legRotX = [-0.8 + Math.sin(t * 28.0) * 0.72, -0.8 - Math.sin(t * 28.0) * 0.72, 0.4 + Math.cos(t * 28.0) * 0.68, 0.4 - Math.cos(t * 28.0) * 0.68];
          legRotZ = [-0.65, 0.65, -0.58, 0.58];
          tailBaseX = 0.25;
          tailBaseY = Math.sin(t * 26.0) * 1.18;
          tailTipY = Math.cos(t * 26.0) * 0.95;
        } else if (c.grabbed) {
          // Authentic scruff-held posture: hangs upright facing straight toward camera (head + belly + 4 tucked paws clearly visible!)
          c.targetRotY = Math.atan2(
            camera.position.x - c.root.position.x,
            camera.position.z - c.root.position.z
          );
          // Pitch whole body upright so the creamy belly & chest face straight at the viewer
          bodyY = 0.24;
          bodyPitch = -1.16;
          bodyRoll = Math.sin(t * 4.4) * 0.09;
          torsoY = 0.36;
          torsoPitch = 0.0;
          torsoSZ = 1.08;
          torsoSX = 0.95;
          // Counter-tilt head forward so face & green eyes stare straight out at the viewer
          headX = 0.88;
          headY = Math.sin(t * 2.8) * 0.10;
          earFlatten = 0.22;
          // All 4 paws tucked snugly in front of chest & lower belly (clearly visible from front!)
          legY = [0.25, 0.25, 0.25, 0.25];
          legRotX = [-0.52 + Math.sin(t * 5.2) * 0.08, -0.52 - Math.sin(t * 5.2) * 0.08, -0.88, -0.88];
          legRotZ = [0.34, -0.34, 0.22, -0.22];
          // Tail curls forward right between the tucked hind paws
          tailBaseX = -1.25;
          tailBaseY = 0.38;
          tailTipX = -0.70;
          tailTipY = 0.30;
        } else if (herdingEvent && herdingEvent.cat === c) {
          if (herdingEvent.stage === 'herd' || !herdingEvent.catGuarding) {
            const gp = t * 17.5;
            const fSw = Math.sin(gp) * 0.82;
            const bSw = Math.sin(gp + 2.3) * 0.82;
            legRotX = [fSw, -fSw, bSw, -bSw];
            bodyY = Math.abs(Math.sin(gp)) * 0.11;
            torsoPitch = 0.14;
            torsoSZ = 1.14;
            headX = -0.10;
            tailBaseX = 0.85;
            tailBaseY = Math.sin(gp) * 0.30;
          } else {
            showShield = true;
            torsoY = 0.34;
            torsoPitch = -0.52;
            headX = 0.44;
            headY = Math.sin(t * 2.2) * 0.58;
            legY = [0.30, 0.30, 0.20, 0.20];
            legRotX = [0.06, 0.06, -1.05, -1.05];
            tailBaseX = 0.65;
            tailBaseY = Math.sin(t * 5.0) * 0.28;
          }
        } else if (c.boltingTimer > 0) {
          // Dropped onto a sheep -> instant catapult spring-jump + frantic sprint dash away!
          c.boltingTimer = Math.max(0, c.boltingTimer - dt);
          c.boltElapsed += dt;
          earFlatten = 0.55;

          if (c.boltElapsed < 0.42) {
            const p = c.boltElapsed / 0.42;
            const arc = Math.sin(p * Math.PI);
            stepForwardSafely(c, 5.2, dt, 0.85, true);
            bodyY = arc * 1.22;
            torsoPitch = -0.28 + p * 0.45;
            torsoSZ = 1.20;
            torsoSY = 0.90;
            headX = -0.22;
            legRotX = [-0.95, -0.95, 0.95, 0.95];
            tailBaseX = 1.25;
          } else {
            stepForwardSafely(c, 4.1, dt, 0.85, true);
            const gp = t * 18.5;
            const frontSwing = Math.sin(gp) * 0.85;
            const backSwing = Math.sin(gp + 2.4) * 0.85;
            legRotX = [frontSwing, frontSwing * 0.9, backSwing, backSwing * 0.9];
            bodyY = Math.abs(Math.sin(gp)) * 0.14;
            torsoPitch = Math.cos(gp) * 0.18;
            torsoSZ = 1.15;
            headX = -0.12;
            tailBaseX = 0.45;
            tailBaseY = Math.sin(gp) * 0.28;
            c.scratchFxTimer -= dt;
            if (c.scratchFxTimer <= 0) {
              spawnGrassNibbles(c);
              c.scratchFxTimer = 0.18;
            }
          }

          if (c.boltingTimer <= 0) {
            c.state = 'Sit';
            c.stateTimer = 5.0;
            if (selectedSheep === c) syncToolbarActiveButton();
          }
        } else if (c.startleTimer > 0) {
          // Adorable quick startle recoil when a river fish leaps right in front of the cat!
          c.startleTimer = Math.max(0, c.startleTimer - dt);
          const sp = Math.sin((c.startleTimer / 0.72) * Math.PI);
          bodyY = sp * 0.42;
          torsoPitch = -0.32 * sp;
          torsoSY = 1 + 0.14 * sp;
          earFlatten = 0.55 * sp;
          tailBaseX = 1.25;
        } else if (c.purrTimer > 0 && !c.swimAction) {
          // Blissful purring while being petted by the user's cursor on land!
          c.purrTimer = Math.max(0, c.purrTimer - dt);
          showPurr = true;
          eyesClosed = true;
          const canBellyFlop = !c.isPolarBear && !c.isFennec && !c.isRedPanda;
          if (c.petEnergy > 1.7 && canBellyFlop) {
            // Extra petting -> cat happily flops onto back for belly rubs!
            c.state = 'Belly';
            c.stateTimer = 7.0;
            const wiggle = Math.sin(t * 2.5);
            bodyY = 0.44;
            bodyRoll = Math.PI + wiggle * 0.20;
            torsoY = 0.20;
            headX = -0.14;
            legY = [0.12, 0.12, 0.12, 0.12];
            legRotX = [-0.55, -0.55, 0.42, 0.42];
            legRotZ = [-0.36, 0.36, -0.40, 0.40];
          } else {
            torsoY = 0.34;
            torsoPitch = -0.48;
            headX = 0.38 + Math.sin(t * 5.0) * 0.08;
            headZ = Math.sin(t * 4.0) * 0.16;
            legY = [0.30, 0.30, 0.20, 0.20];
            legRotX = [0.06, 0.06, -1.05, -1.05];
            tailBaseX = 0.95;
            tailBaseY = Math.sin(t * 4.5) * 0.30;
          }
        } else if (c.onRoofTimer > 0) {
          // Lounging lazily on top of the sunny red cottage roof!
          c.onRoofTimer = Math.max(0, c.onRoofTimer - dt);
          c.targetRotY = 0.1;
          eyesClosed = true;
          showZzz = true;
          torsoY = 0.22;
          torsoSX = 1.18;
          torsoSY = 0.80;
          headX = 0.24;
          legY = [0.18, 0.18, 0.18, 0.18];
          legRotX = [1.1, 1.1, -1.1, -1.1];
          tailBaseX = -0.15;
          tailBaseY = -0.95 + Math.sin(t * 2.2) * 0.18;
          if (c.onRoofTimer <= 0) {
            // Hop gracefully back down to the grass outside the pen
            c.root.position.set(PEN_X, getGroundY(PEN_X, PEN_Z + PEN_D * 0.5 + 1.2), PEN_Z + PEN_D * 0.5 + 1.2);
            c.dropSquash = 1.0;
            c.state = 'Walk';
            c.stateTimer = 6.0;
          }
        } else if (c.butterflyHunt) {
          // Classic cat butt-wiggle -> pounce at butterfly -> play it cool by washing face!
          const bh = c.butterflyHunt;
          bh.t += dt;
          const bf = bh.target;
          if (bh.phase === 'wiggle') {
            c.targetRotY = Math.atan2(bf.group.position.x - c.root.position.x, bf.group.position.z - c.root.position.z);
            torsoY = 0.24;
            torsoPitch = 0.24;
            bodyRoll = Math.sin(t * 24) * 0.16; // iconic pre-pounce butt wiggle!
            headX = -0.12;
            legRotX = [-0.45, -0.45, 0.35, 0.35];
            tailBaseX = 0.35;
            tailTipY = Math.sin(t * 18) * 0.55;
            if (bh.t >= 1.15) {
              bh.phase = 'pounce';
              bh.t = 0;
              bf.scareBoost = 1.0;
            }
          } else {
            const p = Math.min(1, bh.t / 0.55);
            const arc = Math.sin(p * Math.PI);
            stepForwardSafely(c, 3.2, dt, 0.85, true);
            bodyY = arc * 0.96;
            torsoPitch = -0.25 + p * 0.45;
            torsoSZ = 1.18;
            legRotX = [-1.05 * arc, -1.05 * arc, 0.85 * arc, 0.85 * arc];
            if (p >= 1) {
              c.butterflyHunt = null;
              c.dropSquash = 0.85;
              // Play it cool after missing: sit down & casually wash face!
              c.state = 'Wash';
              c.stateTimer = 4.5;
              if (selectedSheep === c) syncToolbarActiveButton();
            }
          }
        } else if (c.angerTimer > 0) {
          c.angerTimer = Math.max(0, c.angerTimer - dt);
          showAngry = true;
          if (c.angerTarget && !c.angerTarget.deleting) {
            c.targetRotY = Math.atan2(
              c.angerTarget.root.position.x - c.root.position.x,
              c.angerTarget.root.position.z - c.root.position.z
            );
          }
          torsoY = 0.42;
          torsoPitch = -0.14;
          torsoSY = 1.14;
          torsoSZ = 0.90;
          headX = -0.18;
          headY = Math.sin(t * 20) * 0.08;
          earFlatten = 0.65;
          tailBaseX = 1.15;
          tailBaseY = Math.sin(t * 18) * 0.65;
          tailTipY = Math.cos(t * 18) * 0.55;
          bodyY = Math.abs(Math.sin(t * 14)) * 0.03;
          if (c.angerTimer <= 0) {
            c.state = 'Sit';
            c.stateTimer = 4.5;
            if (selectedSheep === c) syncToolbarActiveButton();
          }
        } else if (c.reefAction) {
          const ra = c.reefAction;
          if (ra.phase === 'jump_to_reef' || ra.phase === 'jump_to_bank') {
            ra.t += dt / ra.duration;
            const p = Math.min(1, ra.t);
            const arc = Math.sin(p * Math.PI);

            c.targetRotY = Math.atan2(ra.endX - ra.startX, ra.endZ - ra.startZ);
            c.root.position.x = ra.startX + (ra.endX - ra.startX) * p;
            c.root.position.z = ra.startZ + (ra.endZ - ra.startZ) * p;
            c.root.position.y = ra.startY + (ra.endY - ra.startY) * p;

            // Graceful feline leap arc over the water
            bodyY = arc * 1.05;
            torsoPitch = -0.26 + p * 0.52;
            torsoSZ = 1.18;
            torsoSY = 0.92;
            headX = -0.15 + p * 0.30;
            legRotX = [-0.88 * arc, -0.88 * arc, 0.85 * arc, 0.85 * arc];
            tailBaseX = 0.75;
            tailTipX = -0.25;

            if (p >= 1) {
              c.dropSquash = 0.85;
              if (ra.phase === 'jump_to_reef') {
                ra.phase = 'perched';
                // Ensure a fish is swimming nearby when sitting on the reef to watch fish!
                if (ra.mode === 'sit' && fishList.length < MAX_RIVER_FISH && !fishList.some(f => Math.abs(f.z - REEF_Z) < 4.0)) {
                  const sp = spawnRiverFish(false);
                  sp.z = REEF_Z - sp.dir * 2.2;
                  sp.depth = 0.9;
                  sp.targetDepth = 1.0;
                }
              } else {
                // Landed cleanly on the target riverbank!
                c.reefAction = null;
                c.reefCooldown = 12.0;
                c.state = ra.mode === 'cross' ? 'Walk' : 'Sit';
                c.stateTimer = 5.5 + Math.random() * 3.0;
                if (selectedSheep === c) syncToolbarActiveButton();
              }
            }
          } else {
            // Perched on top of the brown river reef rock!
            c.root.position.x = REEF_X;
            c.root.position.z = REEF_Z;
            c.root.position.y = REEF_TOP_Y;
            ra.perchTimer -= dt;

            if (ra.mode === 'sit') {
              // Seated upright on the reef watching fish swim around the rock!
              let nearFish = null;
              let nearD = 5.2;
              for (let i = 0; i < fishList.length; i++) {
                const f = fishList[i];
                if (f.mat.opacity < 0.2) continue;
                const d = Math.hypot(f.group.position.x - REEF_X, f.group.position.z - REEF_Z);
                if (d < nearD) {
                  nearD = d;
                  nearFish = f;
                }
              }
              if (nearFish) {
                showFishCrave = true;
                const angToFish = Math.atan2(nearFish.group.position.x - REEF_X, nearFish.group.position.z - REEF_Z);
                const relAngle = shortestAngleDiff(c.root.rotation.y, angToFish);
                // Keep body naturally planted; smoothly turn head & tilt curiously to follow the fish!
                headY = Math.max(-0.98, Math.min(0.98, relAngle));
                headZ = -headY * 0.18;
                headX = 0.60 + Math.sin(t * 3.8) * 0.04;
                // Only gently re-seat body partway if the fish swims far behind the cat's shoulder
                if (Math.abs(relAngle) > 1.25) {
                  c.targetRotY = c.root.rotation.y + Math.sign(relAngle) * 0.55;
                }
              } else {
                headX = 0.52;
                headY = Math.sin(t * 1.4) * 0.42;
              }
              torsoY = 0.32;
              torsoPitch = -0.56;
              torsoSY = 0.96;
              legY = [0.30, 0.30, 0.20, 0.20];
              legRotX = [0.06, 0.06, -1.05, -1.05];
              tailBaseX = -0.22;
              tailBaseY = 0.85;
              tailTipY = 0.55 + Math.sin(t * (nearFish ? 8.5 : 3.2)) * 0.32;
            } else {
              // Brief nimble stepping-stone crouch on the rock, aiming at the opposite bank!
              const landZ = REEF_Z + (Math.random() - 0.5) * 0.4;
              const landX = getRiverCenterX(landZ) + ra.targetBankSide * (getRiverHalfWidth(landZ) + RIVER_MARGIN + 0.82);
              c.targetRotY = Math.atan2(landX - REEF_X, landZ - REEF_Z);
              torsoY = 0.28;
              torsoPitch = 0.16;
              headX = -0.10;
              legRotX = [-0.22, -0.22, 0.25, 0.25];
              tailBaseX = 0.65;
            }

            if (ra.perchTimer <= 0) {
              // Leap gracefully off the reef to the target bank!
              const landZ = Math.max(-SLAB_MARGIN_Z + 1, Math.min(SLAB_MARGIN_Z - 1, REEF_Z + (Math.random() - 0.5) * 1.2));
              const landX = getRiverCenterX(landZ) + ra.targetBankSide * (getRiverHalfWidth(landZ) + RIVER_MARGIN + 0.82);
              ra.phase = 'jump_to_bank';
              ra.t = 0;
              ra.duration = 0.62;
              ra.startX = REEF_X;
              ra.startY = REEF_TOP_Y;
              ra.startZ = REEF_Z;
              ra.endX = landX;
              ra.endY = getTerrainHeight(landX, landZ);
              ra.endZ = landZ;
            }
          }
        } else if (c.watchFish) {
          // Excitedly staring at the swimming fish, stalking along the riverbank & craving a snack!
          const f = c.watchFish;
          const stillAlive = fishList.includes(f) && f.mat.opacity > 0.12;
          c.watchTimer -= dt;
          if (!stillAlive || c.watchTimer <= 0) {
            c.watchFish = null;
            c.watchCooldown = 3.5;
            c.state = 'Sit';
            c.stateTimer = 4.5;
          } else {
            showFishCrave = true;
            const fx = f.group.position.x;
            const fz = f.group.position.z;
            const angleToFish = Math.atan2(fx - c.root.position.x, fz - c.root.position.z);

            // Follow the fish along whichever riverbank the cat is on (staying safely on grass!)
            const bankSide = c.root.position.x >= getRiverCenterX(c.root.position.z) ? 1 : -1;
            const desiredZ = Math.max(-SLAB_MARGIN_Z + 0.5, Math.min(SLAB_MARGIN_Z - 0.5, fz));
            const desiredX = getRiverCenterX(desiredZ) + bankSide * (getRiverHalfWidth(desiredZ) + RIVER_MARGIN + 0.36);
            const moveDx = desiredX - c.root.position.x;
            const moveDz = desiredZ - c.root.position.z;
            const moveDist = Math.hypot(moveDx, moveDz);

            let lookYawOffset = 0;
            if (moveDist > 0.38) {
              // Body walks forward along the riverbank while head turns sideways to watch the fish!
              c.targetRotY = Math.atan2(moveDx, moveDz);
              lookYawOffset = Math.max(-0.95, Math.min(0.95, shortestAngleDiff(c.root.rotation.y, angleToFish)));

              const stalkSpeed = Math.min(1.45, moveDist * 1.4);
              const nx = c.root.position.x + (moveDx / moveDist) * stalkSpeed * dt;
              const nz = c.root.position.z + (moveDz / moveDist) * stalkSpeed * dt;
              if (!isPositionBlocked(nx, nz, 0)) {
                c.root.position.x = nx;
                c.root.position.z = nz;
              }
              const sp = t * 9.5;
              const sw = Math.sin(sp) * 0.48;
              legRotX = [sw, -sw, -sw, sw];
              bodyY = Math.abs(Math.sin(sp)) * 0.03;
            } else {
              // Stopped beside the fish -> whole body faces the river & paws eagerly toward the water!
              c.targetRotY = angleToFish;
              const dab = Math.sin(t * 7.2);
              legRotX = [0.05, -0.78 + dab * 0.38, 0.12, 0.12];
            }

            // Low hunting crouch + head angled toward the swimming fish + fast excited tail-tip twitch
            torsoY = 0.29;
            torsoPitch = 0.18;
            torsoSZ = 1.08;
            headX = 0.36 + Math.sin(t * 5.2) * 0.05;
            headY = lookYawOffset + Math.sin(t * 4.0) * 0.06;
            tailBaseX = 0.55;
            tailBaseY = Math.sin(t * 6.5) * 0.25;
            tailTipY = Math.sin(t * 14.5) * 0.55;
          }
        } else if (c.wakeStretchTimer > 0) {
          // Big satisfying post-nap cat stretch before scratching claws!
          c.wakeStretchTimer = Math.max(0, c.wakeStretchTimer - dt);
          const sp = Math.sin((1 - c.wakeStretchTimer / 2.4) * Math.PI);
          torsoY = 0.34;
          torsoPitch = 0.46 * sp;
          torsoSZ = 1.0 + 0.28 * sp;
          torsoSY = 1.0 - 0.10 * sp;
          headX = -0.22 * sp;
          headY = 0.0;
          legY = [0.22, 0.22, 0.34, 0.34];
          legRotX = [-1.18 * sp, -1.18 * sp, 0.22 * sp, 0.22 * sp];
          tailBaseX = 0.5 + 0.85 * sp;
          tailTipX = -0.25 * sp;
        } else if (c.swimAction && c.isPolarBear) {
          const sw = c.swimAction;
          const fl = sw.floe;
          if (sw.phase === 'free_swim') {
            sw.swimTimer -= dt;
            sw.turnTimer = (sw.turnTimer || 0) - dt;
            if (sw.turnTimer <= 0) {
              sw.heading = (sw.heading !== undefined ? sw.heading : c.root.rotation.y) + (Math.random() - 0.5) * 1.3;
              sw.turnTimer = 2.0 + Math.random() * 2.2;
            }
            let hx = Math.sin(sw.heading);
            let hz = Math.cos(sw.heading);
            const nx = c.root.position.x + hx * 1.35 * dt;
            const nz = c.root.position.z + hz * 1.35 * dt;
            const coastLimit = getArcticCoastZ(nx) + 0.75;
            const hitOtherFloe = getIceFloeAt(nx, nz, 0.55);
            if (nx < SLAB_MIN_X + 0.8 || nx > SLAB_MAX_X - 0.8 || nz > SLAB_MARGIN_Z + ARCTIC_EXTRA_SOUTH - 0.8 || nz < coastLimit || hitOtherFloe) {
              sw.heading += Math.PI * 0.72 + (Math.random() - 0.5) * 0.6;
              sw.turnTimer = 1.4;
            } else {
              c.root.position.x = nx;
              c.root.position.z = nz;
            }
            c.targetRotY = sw.heading;
            bearSwimmingInWater = true;
            bodyY = -0.30 + Math.sin(t * 4.4) * 0.026;
            bodyRoll = Math.sin(t * 3.6) * 0.065;
            torsoY = 0.40;
            torsoPitch = -0.06;
            headX = -0.24 + Math.sin(t * 3.0) * 0.04;
            const stroke = Math.sin(t * 6.6) * 0.42;
            legY = [0.39, 0.39, 0.39, 0.39];
            legRotX = [-0.76 + stroke, -0.76 - stroke, 1.12 + Math.sin(t * 4.2) * 0.10, 1.12 - Math.sin(t * 4.2) * 0.10];
            legRotZ = [-0.20, 0.20, -0.10, 0.10];
            sw.rippleT -= dt;
            if (sw.rippleT <= 0) {
              const chestX = c.root.position.x + Math.sin(c.root.rotation.y) * 0.55;
              const chestZ = c.root.position.z + Math.cos(c.root.rotation.y) * 0.55;
              spawnWaterRipple(chestX, chestZ, 2.6);
              sw.rippleT = 0.38;
            }
            if (sw.swimTimer <= 0) {
              const freeFloe = ARCTIC_FLOES.find(f => f.occupants.length === 0);
              if (freeFloe && Math.random() < 0.45 && claimFloe(freeFloe, c)) {
                sw.floe = freeFloe;
                sw.phase = 'to_floe';
                sw.enteredWater = true;
              } else {
                sw.shoreX = Math.max(SLAB_MIN_X + 1.0, Math.min(SLAB_MAX_X - 1.0, c.root.position.x));
                sw.shoreZ = getArcticCoastZ(sw.shoreX) - 1.05;
                sw.phase = 'to_shore';
              }
            }
          } else if (sw.phase === 'to_floe') {
            const edge = getFloeEdgePoint(fl, c.root.position.x, c.root.position.z, 0.62);
            const dx = edge.x - c.root.position.x;
            const dz = edge.z - c.root.position.z;
            const dist = Math.hypot(dx, dz);
            c.targetRotY = Math.atan2(fl.x - c.root.position.x, fl.z - c.root.position.z);
            if (dist > 0.42) {
              c.root.position.x += (dx / dist) * 1.45 * dt;
              c.root.position.z += (dz / dist) * 1.45 * dt;
              const inSea = c.root.position.z > getArcticCoastZ(c.root.position.x) - 0.05 && !getIceFloeAt(c.root.position.x, c.root.position.z, 0.04);
              if (inSea) {
                bearSwimmingInWater = true;
                if (!sw.enteredWater) { sw.enteredWater = true; spawnWaterSplash(c.root.position.x, 0.05, c.root.position.z, 8); }
                bodyY = -0.30 + Math.sin(t * 4.4) * 0.026;
                bodyRoll = Math.sin(t * 3.6) * 0.065;
                torsoY = 0.40;
                torsoPitch = -0.06;
                headX = -0.24 + Math.sin(t * 3.0) * 0.04;
                const stroke = Math.sin(t * 6.6) * 0.42;
                legY = [0.39, 0.39, 0.39, 0.39];
                legRotX = [-0.76 + stroke, -0.76 - stroke, 1.12 + Math.sin(t * 4.2) * 0.10, 1.12 - Math.sin(t * 4.2) * 0.10];
                legRotZ = [-0.20, 0.20, -0.10, 0.10];
                sw.rippleT -= dt;
                if (sw.rippleT <= 0) {
                  const chestX = c.root.position.x + Math.sin(c.root.rotation.y) * 0.55;
                  const chestZ = c.root.position.z + Math.cos(c.root.rotation.y) * 0.55;
                  spawnWaterRipple(chestX, chestZ, 2.5);
                  sw.rippleT = 0.38;
                }
              } else {
                const wp = t * 7.5;
                legRotX = [Math.sin(wp) * 0.45, -Math.sin(wp) * 0.45, -Math.sin(wp) * 0.45, Math.sin(wp) * 0.45];
              }
            } else {
              sw.phase = 'climb_floe';
              sw.climbT = 0;
              sw.startX = c.root.position.x;
              sw.startZ = c.root.position.z;
              spawnWaterSplash(c.root.position.x, 0.06, c.root.position.z, 6);
            }
          } else if (sw.phase === 'climb_floe') {
            sw.climbT += dt / 0.68;
            const p = Math.min(1, sw.climbT);
            const sp = p * p * (3 - 2 * p);
            c.root.position.x = sw.startX + (fl.x - sw.startX) * sp;
            c.root.position.z = sw.startZ + (fl.z - sw.startZ) * sp;
            c.targetRotY = Math.atan2(fl.x - sw.startX, fl.z - sw.startZ);
            bodyY = Math.sin(p * Math.PI) * 0.42;
            torsoPitch = -0.22 * Math.sin(p * Math.PI);
            legRotX = [-0.55 * Math.sin(p * Math.PI), -0.55 * Math.sin(p * Math.PI), 0.45 * Math.sin(p * Math.PI), 0.45 * Math.sin(p * Math.PI)];
            if (p >= 1) {
              sw.phase = 'lounge';
              c.dropSquash = 0.75;
              triggerFloeBounce(fl, -1.75);
              spawnWaterRipple(fl.x, fl.z, 3.0);
            }
          } else if (sw.phase === 'lounge') {
            c.root.position.x += (fl.x - c.root.position.x) * Math.min(1, dt * 6);
            c.root.position.z += (fl.z - c.root.position.z) * Math.min(1, dt * 6);
            c.targetRotY = fl.rot + 0.25;
            showZzz = true;
            eyesClosed = true;
            const breath = Math.sin(t * 1.9);
            torsoY = 0.20;
            torsoSX = 1.20 + breath * 0.03;
            torsoSY = 0.72 + breath * 0.035;
            torsoSZ = 1.08;
            headX = 0.20;
            legY = [0.16, 0.16, 0.16, 0.16];
            legRotX = [-1.36, -1.36, 1.36, 1.36];
            legRotZ = [-0.58, 0.58, -0.58, 0.58];
            sw.loungeTimer -= dt;
            if (sw.loungeTimer <= 0) {
              const exitEdge = getFloeEdgePoint(fl, sw.shoreX, sw.shoreZ, 0.65);
              sw.phase = 'leave_floe';
              sw.climbT = 0;
              sw.startX = c.root.position.x;
              sw.startZ = c.root.position.z;
              sw.exitX = exitEdge.x;
              sw.exitZ = exitEdge.z;
              releaseFloeOccupancy(c);
            }
          } else if (sw.phase === 'leave_floe') {
            sw.climbT += dt / 0.55;
            const p = Math.min(1, sw.climbT);
            const sp = p * p * (3 - 2 * p);
            c.root.position.x = sw.startX + (sw.exitX - sw.startX) * sp;
            c.root.position.z = sw.startZ + (sw.exitZ - sw.startZ) * sp;
            c.targetRotY = Math.atan2(sw.exitX - sw.startX, sw.exitZ - sw.startZ);
            bodyY = Math.sin(p * Math.PI) * 0.36;
            if (p >= 1) {
              sw.phase = 'to_shore';
              spawnWaterSplash(c.root.position.x, 0.05, c.root.position.z, 7);
              spawnWaterRipple(c.root.position.x, c.root.position.z, 2.2);
            }
          } else {
            const dx = sw.shoreX - c.root.position.x;
            const dz = sw.shoreZ - c.root.position.z;
            const dist = Math.hypot(dx, dz);
            c.targetRotY = Math.atan2(dx, dz);
            if (dist > 0.38) {
              c.root.position.x += (dx / dist) * 1.50 * dt;
              c.root.position.z += (dz / dist) * 1.50 * dt;
              const inSea = c.root.position.z > getArcticCoastZ(c.root.position.x) - 0.05 && !getIceFloeAt(c.root.position.x, c.root.position.z, 0.04);
              if (inSea) {
                bearSwimmingInWater = true;
                bodyY = -0.30 + Math.sin(t * 4.4) * 0.026;
                bodyRoll = Math.sin(t * 3.6) * 0.065;
                torsoY = 0.40;
                torsoPitch = -0.06;
                headX = -0.24 + Math.sin(t * 3.0) * 0.04;
                const stroke = Math.sin(t * 6.6) * 0.42;
                legY = [0.39, 0.39, 0.39, 0.39];
                legRotX = [-0.76 + stroke, -0.76 - stroke, 1.12 + Math.sin(t * 4.2) * 0.10, 1.12 - Math.sin(t * 4.2) * 0.10];
                legRotZ = [-0.20, 0.20, -0.10, 0.10];
                sw.rippleT -= dt;
                if (sw.rippleT <= 0) {
                  const chestX = c.root.position.x + Math.sin(c.root.rotation.y) * 0.55;
                  const chestZ = c.root.position.z + Math.cos(c.root.rotation.y) * 0.55;
                  spawnWaterRipple(chestX, chestZ, 2.5);
                  sw.rippleT = 0.38;
                }
              } else {
                const wp = t * 7.5;
                legRotX = [Math.sin(wp) * 0.45, -Math.sin(wp) * 0.45, -Math.sin(wp) * 0.45, Math.sin(wp) * 0.45];
              }
            } else {
              c.swimAction = null;
              c.swimCooldown = 16.0;
              c.state = 'Walk';
              c.stateTimer = 7.0;
              if (selectedSheep === c) syncToolbarActiveButton();
            }
          }
        } else if (c.state === 'Fish' && c.isPolarBear) {
          // Polar Bear walks to icy shoreline, watches ocean with 🐟, then swats a silver fish ashore!
          const coastZ = getArcticCoastZ(c.root.position.x);
          const standZ = coastZ - 0.92;
          const dz = standZ - c.root.position.z;
          if (Math.abs(dz) > 0.45) {
            c.targetRotY = dz > 0 ? 0 : Math.PI;
            c.root.position.z += Math.sign(dz) * 1.35 * dt;
            const wp = t * 7.8;
            legRotX = [Math.sin(wp) * 0.45, -Math.sin(wp) * 0.45, -Math.sin(wp) * 0.45, Math.sin(wp) * 0.45];
          } else {
            c.targetRotY = 0; // face south toward the ocean
            showFishCrave = true;
            c.fishCycle = (c.fishCycle + dt) % 3.4;
            if (c.fishCycle < 1.8) {
              c.fishSwatted = false;
              torsoY = 0.28;
              torsoPitch = 0.24;
              headX = 0.36 + Math.sin(t * 4.5) * 0.06;
              legRotX = [-0.35, -0.35, 0.25, 0.25];
            } else if (c.fishCycle < 2.35) {
              // Mighty paw swat into the water -> flings silver fish onto the ice behind/beside bear!
              const sp = (c.fishCycle - 1.8) / 0.55;
              torsoPitch = 0.12 - Math.sin(sp * Math.PI) * 0.35;
              legRotX = [-1.45 * Math.sin(sp * Math.PI), 0.15, 0.2, 0.2];
              if (sp > 0.45 && !c.fishSwatted) {
                c.fishSwatted = true;
                const wx = c.root.position.x + 0.18;
                const wz = coastZ + 0.55;
                spawnWaterSplash(wx, 0.05, wz, 8);
                spawnWaterRipple(wx, wz, 2.5);
                const landX = Math.max(SLAB_MIN_X + 1.0, Math.min(SLAB_MAX_X - 1.0, c.root.position.x + (Math.random() - 0.5) * 3.4));
                const landZ = Math.max(-SLAB_MARGIN_Z + 1.0, coastZ - 1.6 - Math.random() * 1.8);
                launchFishAshore(wx, 0.18, wz, landX, landZ);
                showToast('北极熊一巴掌把大银鱼拍上冰岸啦！🐟');
              }
            } else {
              torsoY = 0.34;
              torsoPitch = -0.35;
              headX = 0.22;
              legRotX = [0.08, 0.08, -0.85, -0.85];
            }
          }
        } else if (c.state === 'Roll' && c.isPolarBear) {
          // Playful snow-rolling on back with height compensation & water-edge safety!
          if (c.root.position.z > getArcticCoastZ(c.root.position.x) - 1.65) {
            c.root.position.z -= 1.2 * dt;
            c.targetRotY = Math.PI;
          } else {
            const wiggle = Math.sin(t * 2.8);
            bodyY = 0.64;
            bodyRoll = Math.PI + wiggle * 0.24;
            torsoY = 0.26;
            headX = 0.30 + Math.sin(t * 3.2) * 0.06;
            headY = wiggle * 0.24;
            legY = [0.24, 0.24, 0.24, 0.24];
            legRotX = [-0.42 + Math.sin(t * 5) * 0.22, -0.42 - Math.sin(t * 5) * 0.22, 0.36, 0.36];
            legRotZ = [-0.30, 0.30, -0.32, 0.32];
            c.rollFxTimer -= dt;
            if (c.rollFxTimer <= 0) {
              c.rollFxTimer = 0.35;
              spawnWaterSplash(c.root.position.x, baseGY + 0.12, c.root.position.z, 3);
            }
          }
        } else if (c.state === 'Sniff' && c.isPolarBear) {
          // Stand tall on hind legs sniffing the polar breeze!
          torsoY = 0.56;
          torsoPitch = -1.08;
          headX = 0.72 + Math.sin(t * 6.0) * 0.08;
          headY = Math.sin(t * 2.6) * 0.42;
          legY = [0.52, 0.52, 0.26, 0.26];
          legRotX = [-0.75 + Math.sin(t * 4.5) * 0.14, -0.75 - Math.sin(t * 4.5) * 0.14, 0.12, 0.12];
          legRotZ = [0.24, -0.24, 0, 0];
          c.breathTimer = (c.breathTimer || 0) - dt;
          if (c.breathTimer <= 0) {

        } else if (c.state === 'Tumble' && c.isRedPanda) {

        } else if (c.state === 'Walk') {
