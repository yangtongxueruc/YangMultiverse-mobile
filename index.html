        }

        c.angryPop = showAngry ? Math.min(1, c.angryPop + dt * 6.5) : Math.max(0, c.angryPop - dt * 6.5);
        if (c.angryPop > 0.01) {
          c.angrySprite.visible = true;
          const sz = 0.72 * c.angryPop * (1 + Math.sin(t * 14) * 0.11);
          c.angrySprite.scale.set(sz, sz, 1);
          c.angrySprite.position.set(0.22, 1.38 + Math.sin(t * 12) * 0.04, 0.25);
          c.angrySprite.material.opacity = Math.min(1, c.angryPop * 1.25);
          c.angrySprite.material.rotation = Math.sin(t * 20) * 0.14;
        } else {
          c.angrySprite.visible = false;
        }

        // Animate cute 'craving fish' thought bubble above cat's head
        c.fishCravePop = showFishCrave ? Math.min(1, c.fishCravePop + dt * 5.5) : Math.max(0, c.fishCravePop - dt * 6.0);
        if (c.fishCravePop > 0.01) {
          c.fishCraveSprite.visible = true;
          const pulse = 1 + Math.sin(t * 5.5) * 0.07;
          const sz = 1.08 * c.fishCravePop * pulse;
          c.fishCraveSprite.scale.set(sz, sz, 1);
          c.fishCraveSprite.position.set(0.18, 1.50 + Math.sin(t * 4.2) * 0.06, 0.26);
          c.fishCraveSprite.material.opacity = Math.min(1, c.fishCravePop * 1.2);
          c.fishCraveSprite.material.rotation = Math.sin(t * 3.8) * 0.07;
        } else {
          c.fishCraveSprite.visible = false;
        }

        // Animate cute guard shield badge ('🛡️') above cat while guarding the sheep pen
        c.shieldPop = showShield ? Math.min(1, c.shieldPop + dt * 5.8) : Math.max(0, c.shieldPop - dt * 6.5);
        if (c.shieldPop > 0.01) {
          c.shieldSprite.visible = true;
          const pulse = 1 + Math.sin(t * 4.5) * 0.06;
          const sz = 0.84 * c.shieldPop * pulse;
          c.shieldSprite.scale.set(sz, sz, 1);
          c.shieldSprite.position.set(0.0, 1.48 + Math.sin(t * 3.4) * 0.06, 0.16);
          c.shieldSprite.material.opacity = Math.min(1, c.shieldPop * 1.2);
          c.shieldSprite.material.rotation = Math.sin(t * 2.8) * 0.07;
        } else {
          c.shieldSprite.visible = false;
        }

        if (c.pandaMoodSprite) {
          if (pandaMoodTex) {
            if (c.pandaMoodSprite.material.map !== pandaMoodTex) {
              c.pandaMoodSprite.material.map = pandaMoodTex;
              c.pandaMoodSprite.material.needsUpdate = true;
            }
            c.pandaMoodPop = Math.min(1, c.pandaMoodPop + dt * 6.0);
          } else {
            c.pandaMoodPop = Math.max(0, c.pandaMoodPop - dt * 6.5);
          }
          if (c.pandaMoodPop > 0.01) {
            c.pandaMoodSprite.visible = true;
            const isDizzy = c.pandaMoodSprite.material.map === dizzyMarkTex;
            const sz = 0.84 * c.pandaMoodPop * (1 + Math.sin(t * 6.5) * 0.08);
            c.pandaMoodSprite.scale.set(sz, sz, 1);
            c.pandaMoodSprite.position.set(0.0, 1.46 + Math.sin(t * 3.8) * 0.07, 0.18);
            c.pandaMoodSprite.material.opacity = Math.min(1, c.pandaMoodPop * 1.2);
            c.pandaMoodSprite.material.rotation = isDizzy ? (t * 4.5) : Math.sin(t * 4.0) * 0.12;
          } else {
            c.pandaMoodSprite.visible = false;
          }
        }

        c.purrPop = showPurr ? Math.min(1, c.purrPop + dt * 5.5) : Math.max(0, c.purrPop - dt * 6.0);
        if (c.purrPop > 0.01) {
          c.purrSprite.visible = true;
          const sz = 0.78 * c.purrPop * (1 + Math.sin(t * 6.5) * 0.10);
          c.purrSprite.scale.set(sz, sz, 1);
          c.purrSprite.position.set(0.24, 1.46 + Math.sin(t * 4.6) * 0.09, 0.20);
          c.purrSprite.material.opacity = Math.min(1, c.purrPop * 1.2);
          c.purrSprite.material.rotation = Math.sin(t * 5.0) * 0.16;
        } else {
          c.purrSprite.visible = false;
        }
      }

      // ------------------------------------------------------------------
      // 7. Sheep Animation State Machine (Idle / Graze / Walk / Jump)
      // ------------------------------------------------------------------
      function shortestAngleDiff(current, target) {
        let diff = (target - current + Math.PI) % (Math.PI * 2) - Math.PI;
        if (diff < -Math.PI) diff += Math.PI * 2;
        return diff;
      }

      const SLAB_MIN_X = TERRAIN_MIN_X + 1.25;
      const SLAB_MAX_X = TERRAIN_MAX_X - 1.25;
      const SLAB_MARGIN_Z = SLAB_D / 2 - 1.25;
      const RIVER_MARGIN = 0.58;

      function isPositionBlocked(x, z, extraRiverPad) {
        if (x < SLAB_MIN_X || x > SLAB_MAX_X || Math.abs(z) > SLAB_MARGIN_Z) {
          return true;
        }
        if (isInsideHouseFootprint(x, z, 0.28) || isInsidePen(x, z, 0.32)) {
          return true;
        }
        if (isSouthOcean()) {
          if (getIceFloeAt(x, z, -0.18)) return false;
          const pad = RIVER_MARGIN + (extraRiverPad || 0);
          return z > (getArcticCoastZ(x) - pad);
        }
        if (isOnBridge(x, z, 0)) {
          return false;
        }
        const pad = RIVER_MARGIN + (extraRiverPad || 0);
        return isInRiver(x, z, pad);
      }

      function findClearHeading(x, z, preferredAng) {
        // Test 12 radial rays at 0.9u and 1.8u ahead to guarantee picking a genuinely open path out of corners!
        let bestAng = preferredAng;
        let bestScore = -1e9;
        for (let k = 0; k < 12; k++) {
          const ang = (k / 12) * Math.PI * 2;
          const dx = Math.sin(ang);
          const dz = Math.cos(ang);
          const clear1 = !isPositionBlocked(x + dx * 0.85, z + dz * 0.85, 0.04);
          const clear2 = !isPositionBlocked(x + dx * 1.75, z + dz * 1.75, 0.04);
          const clear3 = !isPositionBlocked(x + dx * 2.60, z + dz * 2.60, 0.04);
          if (!clear1) continue;
          const align = Math.cos(shortestAngleDiff(ang, preferredAng));
          const score = (clear2 ? 2.2 : 0) + (clear3 ? 1.2 : 0) + align * 1.15 + Math.random() * 0.25;
          if (score > bestScore) {
            bestScore = score;
            bestAng = ang;
          }
        }
        return bestAng;
      }

      function computeSafeEscapeAngle(x, z, currentRotY) {
        // If on the bridge, steer cleanly along the bridge axis (±X) so sheep walk straight across
        if (isOnBridge(x, z, 0.25)) {
          const headingX = Math.sin(currentRotY || 0);
          const dirX = headingX >= 0 ? 1 : -1;
          const centerPullZ = (BRIDGE_Z - z) * 0.7;
          return Math.atan2(dirX, centerPullZ);
        }

        let vx = 0;
        let vz = 0;
        if (isSouthOcean()) {
          const cz = getArcticCoastZ(x);
          if (z > cz - (RIVER_MARGIN + 0.95)) {
            vz -= 2.8;
          }
        } else {
          const riverCx = getRiverCenterX(z);
          const riverSafeDist = getRiverHalfWidth(z) + RIVER_MARGIN + 0.75;
          const dxRiver = x - riverCx;
          if (Math.abs(dxRiver) < riverSafeDist) {
            if (Math.abs(z - BRIDGE_Z) < 3.6 && Math.random() < 0.45) {
              const entryX = BRIDGE_X + (dxRiver >= 0 ? 1 : -1) * (BRIDGE_SPAN * 0.5 + 0.35);
              return Math.atan2(entryX - x, BRIDGE_Z - z);
            }
            vx += (dxRiver >= 0 ? 1 : -1) * 2.4;
          }
        }
        if (x > SLAB_MAX_X - 1.35) vx -= 2.4;
        if (x < SLAB_MIN_X + 1.35) vx += 2.4;
        if (z > SLAB_MARGIN_Z - 1.35) vz -= 2.4;
        if (z < -SLAB_MARGIN_Z + 1.35) vz += 2.4;
        if (isInsidePen(x, z, 1.5)) {
          vx += (x - PEN_X) * 2.2 - 0.8;
          vz += (z - PEN_Z) * 2.2 + 1.6;
        }

        if (vx === 0 && vz === 0) {
          if (isSouthOcean()) {
            vx = TERRAIN_CENTER_X - x;
            vz = (-2.5 - z) * 0.6;
          } else {
            const bankTargetX = x < getRiverCenterX(z) ? -12.8 : 2.5;
            vx = bankTargetX - x;
            vz = -z * 0.6;
          }
        }
        const preferred = Math.atan2(vx, vz);
        return findClearHeading(x, z, preferred);
      }

      function stepForwardSafely(s, speed, dt, lookAheadDist, leapOverSheep) {
        const x = s.root.position.x;
        const z = s.root.position.z;

        // If somehow already inside a blocked zone (e.g., curved riverbank or arctic coast), gently nudge out immediately
        if (isPositionBlocked(x, z, 0)) {
          if (isSouthOcean()) {
            const coastSafeZ = getArcticCoastZ(x) - RIVER_MARGIN - 0.12;
            if (z > coastSafeZ) {
              s.root.position.z = coastSafeZ;
            }
          } else {
            const riverCx = getRiverCenterX(z);
            const riverEdge = getRiverHalfWidth(z) + RIVER_MARGIN + 0.08;
            if (Math.abs(x - riverCx) < riverEdge) {
              const side = x >= riverCx ? 1 : -1;
              const pushedX = riverCx + side * riverEdge;
              if (pushedX >= SLAB_MIN_X && pushedX <= SLAB_MAX_X) {
                s.root.position.x = pushedX;
              }
            }
          }
          if (isInsidePen(s.root.position.x, s.root.position.z, 0.38)) {
            const px = s.root.position.x - PEN_X;
            const pz = s.root.position.z - PEN_Z;
            const pd = Math.hypot(px, pz) || 1;
            s.root.position.x += (px / pd) * 0.25;
            s.root.position.z += (pz / pd) * 0.25;
          }
          s.root.position.x = Math.max(SLAB_MIN_X + 0.05, Math.min(SLAB_MAX_X - 0.05, s.root.position.x));
          s.root.position.z = Math.max(-SLAB_MARGIN_Z + 0.05, Math.min(SLAB_MARGIN_Z - 0.05, s.root.position.z));
          if (s.avoidCooldown <= 0) {
            s.targetRotY = computeSafeEscapeAngle(s.root.position.x, s.root.position.z, s.root.rotation.y);
            s.avoidCooldown = 0.55;
          }
          return false;
        }

        const dirX = Math.sin(s.root.rotation.y);
        const dirZ = Math.cos(s.root.rotation.y);
        const stepX = x + dirX * speed * dt;
        const stepZ = z + dirZ * speed * dt;
        const probeX = x + dirX * lookAheadDist;
        const probeZ = z + dirZ * lookAheadDist;

        if (isPositionBlocked(probeX, probeZ, 0.05) || isPositionBlocked(stepX, stepZ, 0)) {
          if (s.avoidCooldown <= 0) {
            s.targetRotY = computeSafeEscapeAngle(x, z, s.root.rotation.y);
            s.avoidCooldown = 0.55;
          }
          // Only move forward if the immediate step itself is still clear
          if (!isPositionBlocked(stepX, stepZ, 0)) {
            s.root.position.x = stepX;
            s.root.position.z = stepZ;
            return true;
          }
          return false;
        }

        // When not already airborne/leaping, either vault cleanly over a blocking sheep or steer around
        if (!leapOverSheep) {
          const myR = getEntityRadius(s);
          for (let j = 0; j < sheepList.length; j++) {
            const other = sheepList[j];
            if (other === s || other.deleting || other.grabbed || other.diveAction) continue;
            const odx = other.root.position.x - x;
            const odz = other.root.position.z - z;
            const odist = Math.hypot(odx, odz);
            const pairMin = myR + getEntityRadius(other);
            const avoidRadius = pairMin + ((other.state === 'Idle' || other.angerTimer > 0) ? 0.36 : 0.24);
            if (odist > 0.001 && odist < avoidRadius) {
              const forwardDot = (odx * dirX + odz * dirZ) / odist;
              if (forwardDot > 0.35) {
                // Roll once per encounter (Meadow Sheep ONLY via canVaultOverPeer!)
                let didVault = false;
                if (!s.isCat && getWorldRules().flock.canVaultOverPeer && s.vaultCooldown <= 0) {
                  const landX = x + dirX * 2.15;
                  const landZ = z + dirZ * 2.15;
                  const canLandSafely = !isPositionBlocked(landX, landZ, 0.06);
                  const vaultChance = s.state === 'Jump' ? 0.55 : 0.28;
                  s.vaultCooldown = 2.8 + Math.random() * 2.4;
                  if (canLandSafely && Math.random() < vaultChance) {
                    s.vaultTime = 0.001;
                    didVault = true;
                  }
                }

                if (didVault) {
                  break;
                } else if (s.avoidCooldown <= 0) {
                  const cross = dirX * odz - dirZ * odx;
                  const turnDir = cross >= 0 ? -1 : 1;
                  s.targetRotY = s.root.rotation.y + turnDir * (0.82 + Math.random() * 0.45);
                  s.avoidCooldown = 0.38;
                  if (odist < pairMin * 0.96) return false;
                  break;
                } else if (odist < pairMin * 0.92) {
                  return false;
                }
              }
            }
          }
        }

        // Flock politely gives the guardian space most of the time, only occasionally disturbing its nap
        if (!s.isCat && goldenCat && !leapOverSheep) {
          const cdx = goldenCat.root.position.x - x;
          const cdz = goldenCat.root.position.z - z;
          const cdist = Math.hypot(cdx, cdz);
          const guardMin = getEntityRadius(s) + getEntityRadius(goldenCat);
          const guardAvoidR = guardMin + 0.65;
          if (cdist > 0.001 && cdist < guardAvoidR) {
            const cDot = (cdx * dirX + cdz * dirZ) / cdist;
            if (cDot > 0.22 && s.avoidCooldown <= 0) {
              if (!herdingEvent && herdingCooldown <= 0 && goldenCat.state !== 'Sleep' && goldenCat.angerTimer <= 0 && !goldenCat.reefAction && !goldenCat.swimAction && Math.random() < 0.18) {
                if (startHerdingEvent(s)) return false;
              }
              const shouldDisturb = goldenCat.state === 'Sleep' && goldenCat.disturbCooldown <= 0 && Math.random() < 0.16;
              if (!shouldDisturb) {
                const cross = dirX * cdz - dirZ * cdx;
                const turnDir = cross >= 0 ? -1 : 1;
                s.targetRotY = s.root.rotation.y + turnDir * (0.95 + Math.random() * 0.45);
                s.avoidCooldown = 0.65;
                if (cdist < guardMin + 0.08) return false;
              } else {
                s.avoidCooldown = 1.2;
              }
            } else if (cDot > 0.22 && cdist < guardMin) {
              return false;
            }
          }
        }

        s.root.position.x = stepX;
        s.root.position.z = stepZ;
        return true;
      }

      // Species-aware collision radius & 2-pass separation solver to prevent animal-to-animal clipping
      function getEntityRadius(e) {
        if (!e) return 0.58;
        if (e.isCat) {
          if (e.isPolarBear) return 1.08;
          return 0.64;
        }
        if (e.isPenguin) {
          return (e.state === 'Slide' || (e.swimAction && e.swimAction.phase === 'lounge')) ? 0.56 : 0.48;
        }
        if (e.isSquirrel) return 0.52;
        if (e.isAlpaca) return e.state === 'DustBath' ? 0.78 : 0.66;
        return 0.64;
      }

      function isEntityAirborneForCollision(e) {
        if (!e) return false;
        if (e.isCat) {
          if (e.onRoofTimer > 0) return true;
          if (e.boltingTimer > 0 && e.boltElapsed < 0.42) return true;
          if (e.reefAction && e.reefAction.phase !== 'perched') return true;
          if (e.state === 'Leap' && e.bodyRig.position.y > 0.42) return true;
          return false;
        }
        if (e.vaultTime > 0 || e.diveAction) return true;
        if (e.state === 'Jump' && e.bodyRig.position.y > 0.42) return true;
        if (e.swimAction && (e.swimAction.phase === 'climb_floe' || e.swimAction.phase === 'leave_floe')) return true;
        return false;
      }

      function resolveSheepCollisions(dt) {
        const count = sheepList.length;
        if (count < 1) return;
        const baseStiff = Math.min(0.88, dt * 24);

        for (let iter = 0; iter < 2; iter++) {
          for (let i = 0; i < count; i++) {
            const a = sheepList[i];
            if (a.deleting || a.grabbed || a.herded) continue;
            if (isEntityAirborneForCollision(a)) continue;
            for (let j = i + 1; j < count; j++) {
              const b = sheepList[j];
              if (b.deleting || b.grabbed) continue;
              if (a.pairInteraction && a.pairInteraction === b.pairInteraction) continue;
              if (isEntityAirborneForCollision(b)) continue;
              if (Math.abs(a.root.position.y - b.root.position.y) > 0.72) continue;

              const dx = b.root.position.x - a.root.position.x;
              const dz = b.root.position.z - a.root.position.z;
              const dist = Math.hypot(dx, dz);
              const onSameBridge = isOnBridge(a.root.position.x, a.root.position.z, 0.2) && isOnBridge(b.root.position.x, b.root.position.z, 0.2);
              const minDist = (getEntityRadius(a) + getEntityRadius(b)) * (onSameBridge ? 0.86 : 1.0);

              if (dist < minDist) {
                let nx, nz;
                if (dist < 0.001) {
                  const ang = (a.id * 1.7 + b.id * 2.3) % (Math.PI * 2);
                  nx = Math.cos(ang);
                  nz = Math.sin(ang);
                } else {
                  nx = dx / dist;
                  nz = dz / dist;
                }
                const overlap = minDist - dist;
                const pushFactor = dist < minDist * 0.78 ? 0.88 : baseStiff;
                const totalPush = overlap * pushFactor;

                const aSwimming = Boolean(a.swimAction && (a.swimAction.phase === 'free_swim' || a.swimAction.phase === 'to_floe' || a.swimAction.phase === 'to_shore'));
                const bSwimming = Boolean(b.swimAction && (b.swimAction.phase === 'free_swim' || b.swimAction.phase === 'to_floe' || b.swimAction.phase === 'to_shore'));
                const aAnchored = a.state === 'Idle' || a.angerTimer > 0 || (a.swimAction && a.swimAction.phase === 'lounge');
                const bAnchored = b.state === 'Idle' || b.angerTimer > 0 || (b.swimAction && b.swimAction.phase === 'lounge');

                let wA = 0.5;
                let wB = 0.5;
                if (aAnchored && !bAnchored) { wA = 0.15; wB = 0.85; }
                else if (!aAnchored && bAnchored) { wA = 0.85; wB = 0.15; }

                const axNew = a.root.position.x - nx * totalPush * wA;
                const azNew = a.root.position.z - nz * totalPush * wA;
                const bxNew = b.root.position.x + nx * totalPush * wB;
                const bzNew = b.root.position.z + nz * totalPush * wB;

                const aCanMove = wA > 0 && (aSwimming ? (axNew >= SLAB_MIN_X && axNew <= SLAB_MAX_X && Math.abs(azNew) <= SLAB_MARGIN_Z) : !isPositionBlocked(axNew, azNew, 0));
                const bCanMove = wB > 0 && (bSwimming ? (bxNew >= SLAB_MIN_X && bxNew <= SLAB_MAX_X && Math.abs(bzNew) <= SLAB_MARGIN_Z) : !isPositionBlocked(bxNew, bzNew, 0));

                if (aCanMove) { a.root.position.x = axNew; a.root.position.z = azNew; }
                if (bCanMove) { b.root.position.x = bxNew; b.root.position.z = bzNew; }

                if (aCanMove && !bCanMove) {
                  const axExtra = a.root.position.x - nx * totalPush * wB;
                  const azExtra = a.root.position.z - nz * totalPush * wB;
                  if (aSwimming || !isPositionBlocked(axExtra, azExtra, 0)) {
                    a.root.position.x = axExtra; a.root.position.z = azExtra;
                  }
                } else if (bCanMove && !aCanMove) {
                  const bxExtra = b.root.position.x + nx * totalPush * wA;
                  const bzExtra = b.root.position.z + nz * totalPush * wA;
                  if (bSwimming || !isPositionBlocked(bxExtra, bzExtra, 0)) {
                    b.root.position.x = bxExtra; b.root.position.z = bzExtra;
                  }
                }
              }
            }
          }

          // Prevent any flock animal from clipping through the Guardian (Cat / Fennec / Red Panda / Polar Bear)
          if (goldenCat && !goldenCat.grabbed && !isEntityAirborneForCollision(goldenCat)) {
            const catR = getEntityRadius(goldenCat);
            const catStationary = goldenCat.state !== 'Walk' || goldenCat.angerTimer > 0 || (goldenCat.swimAction && goldenCat.swimAction.phase === 'lounge');
            const catSwimming = Boolean(goldenCat.swimAction && (goldenCat.swimAction.phase === 'free_swim' || goldenCat.swimAction.phase === 'to_floe' || goldenCat.swimAction.phase === 'to_shore'));
            for (let i = 0; i < count; i++) {
              const sh = sheepList[i];
              if (sh.deleting || sh.grabbed || sh.herded) continue;
              if (isEntityAirborneForCollision(sh)) continue;
              if (Math.abs(sh.root.position.y - goldenCat.root.position.y) > 0.72) continue;

              const catMinDist = catR + getEntityRadius(sh);
              const dx = sh.root.position.x - goldenCat.root.position.x;
              const dz = sh.root.position.z - goldenCat.root.position.z;
              const dist = Math.hypot(dx, dz);
              if (dist < catMinDist) {
                let nx, nz;
                if (dist < 0.001) { nx = 1; nz = 0; }
                else { nx = dx / dist; nz = dz / dist; }
                const overlap = catMinDist - dist;
                const push = overlap * (dist < catMinDist * 0.78 ? 0.90 : Math.min(0.88, dt * 26));
                const wSh = catStationary ? 0.92 : 0.72;
                const wCat = 1.0 - wSh;

                const shSwimming = Boolean(sh.swimAction && (sh.swimAction.phase === 'free_swim' || sh.swimAction.phase === 'to_floe' || sh.swimAction.phase === 'to_shore'));
                const shX = sh.root.position.x + nx * push * wSh;
                const shZ = sh.root.position.z + nz * push * wSh;
                const shOk = shSwimming ? (shX >= SLAB_MIN_X && shX <= SLAB_MAX_X && Math.abs(shZ) <= SLAB_MARGIN_Z) : !isPositionBlocked(shX, shZ, 0);
                if (shOk) {
                  sh.root.position.x = shX;
                  sh.root.position.z = shZ;
                } else {
                  const cX = goldenCat.root.position.x - nx * push * 0.65;
                  const cZ = goldenCat.root.position.z - nz * push * 0.65;
                  if (catSwimming || !isPositionBlocked(cX, cZ, 0)) {
                    goldenCat.root.position.x = cX;
                    goldenCat.root.position.z = cZ;
                  }
                }
                if (wCat > 0 && shOk) {
                  const cX = goldenCat.root.position.x - nx * push * wCat;
                  const cZ = goldenCat.root.position.z - nz * push * wCat;
                  if (catSwimming || !isPositionBlocked(cX, cZ, 0)) {
                    goldenCat.root.position.x = cX;
                    goldenCat.root.position.z = cZ;
                  }
                }
              }
            }
          }
        }
      }

      // Lightweight grass-nibble particles for vivid grazing feedback
      const grassBits = [];
      const grassBitGeo = new THREE.BoxGeometry(0.075, 0.12, 0.04);
      const grassBitMats = [
        new THREE.MeshStandardMaterial({ color: 0x6ea843, roughness: 0.9, transparent: true, opacity: 1 }),
        new THREE.MeshStandardMaterial({ color: 0x8cc654, roughness: 0.9, transparent: true, opacity: 1 }),
        new THREE.MeshStandardMaterial({ color: 0x558b35, roughness: 0.9, transparent: true, opacity: 1 })
      ];

      function spawnGrassNibbles(sheep) {
        if (isSouthOcean()) {
          spawnWaterSplash(sheep.root.position.x, getGroundY(sheep.root.position.x, sheep.root.position.z) + 0.18, sheep.root.position.z, 3);
          return;
        }
        const dirX = Math.sin(sheep.root.rotation.y);
        const dirZ = Math.cos(sheep.root.rotation.y);
        const mouthX = sheep.root.position.x + dirX * 0.62;
        const mouthZ = sheep.root.position.z + dirZ * 0.62;
        const baseY = getGroundY(mouthX, mouthZ);
        for (let k = 0; k < 2; k++) {
          const mat = grassBitMats[(Math.random() * grassBitMats.length) | 0].clone();
          const mesh = new THREE.Mesh(grassBitGeo, mat);
          mesh.position.set(
            mouthX + (Math.random() - 0.5) * 0.18,
            baseY + 0.12 + Math.random() * 0.08,
            mouthZ + (Math.random() - 0.5) * 0.18
          );
          mesh.rotation.set(Math.random() * 2, Math.random() * 2, Math.random() * 2);
          dioramaGroup.add(mesh);
          grassBits.push({
            mesh,
            vx: (Math.random() - 0.5) * 0.85,
            vy: 1.05 + Math.random() * 0.65,
            vz: (Math.random() - 0.5) * 0.85,
            life: 0,
            maxLife: 0.45 + Math.random() * 0.22
          });
        }
      }

      function updateGrassNibbles(dt) {
        for (let i = grassBits.length - 1; i >= 0; i--) {
          const b = grassBits[i];
          b.life += dt;
          if (b.life >= b.maxLife) {
            dioramaGroup.remove(b.mesh);
            b.mesh.material.dispose();
            grassBits.splice(i, 1);
            continue;
          }
          b.vy -= 3.6 * dt;
          b.mesh.position.x += b.vx * dt;
          b.mesh.position.y = Math.max(0.03, b.mesh.position.y + b.vy * dt);
          b.mesh.position.z += b.vz * dt;
          b.mesh.rotation.x += 5.0 * dt;
          b.mesh.rotation.z += 4.2 * dt;
          const p = b.life / b.maxLife;
          b.mesh.material.opacity = Math.max(0, 1 - p * p);
          b.mesh.scale.setScalar(1 - p * 0.45);
        }
      }

      function isNearWaterOrBridge(x, z, extra) {
        return isInRiver(x, z, 1.45 + (extra || 0)) || isOnBridge(x, z, 0.55);
      }

      function getAwayFromRiverAngle(x, z) {
        if (isSouthOcean()) {
          return Math.atan2((Math.random() - 0.5) * 1.1, -1.0);
        }
        const riverCx = getRiverCenterX(z);
        const awayDirX = x >= riverCx ? 1 : -1;
        return Math.atan2(awayDirX, (Math.random() - 0.5) * 0.9);
      }

      function pickNextFlockState(s, preferRelaxed) {
        const prev = s.state;
        let next = prev;
        const fRule = getWorldRules().flock;
        if (s.isPenguin) {
          const r = Math.random();
          if (preferRelaxed) next = r < 0.52 ? 'Walk' : (r < 0.80 ? 'Idle' : 'Huddle');
          else if (r < 0.36) next = 'Walk';
          else if (r < 0.64) next = 'Slide';
          else if (r < 0.80) next = 'Idle';
          else if (r < 0.91) next = 'Huddle';
          else next = 'Jump';
          if (next === prev && !preferRelaxed) next = prev === 'Walk' ? 'Slide' : 'Walk';
        } else if (s.isSquirrel) {
          const r = Math.random();
          if (preferRelaxed) next = r < 0.45 ? 'Nibble' : (r < 0.78 ? 'Walk' : 'Idle');
          else if (r < 0.34) next = 'Nibble';
          else if (r < 0.62) next = 'Walk';
          else if (r < 0.78) next = 'Idle';
          else if (r < 0.90) next = 'Bury';
          else next = 'Jump';
          if (next === prev && !preferRelaxed) next = prev === 'Walk' ? 'Nibble' : 'Walk';
        } else if (s.isAlpaca) {
          if (fRule.avoidWaterForRest && isNearWaterOrBridge(s.root.position.x, s.root.position.z)) {
            next = 'Walk';
            s.targetRotY = getAwayFromRiverAngle(s.root.position.x, s.root.position.z);
          } else {
            const r = Math.random();
            if (preferRelaxed) next = r < 0.58 ? 'Walk' : 'Idle';
            else if (r < 0.38) next = 'Walk';
            else if (r < 0.72) next = 'Idle';
            else if (r < 0.88) next = 'DustBath';
            else if (r < 0.95) next = 'Jump';
            else next = 'Spit';
            if (next === prev && !preferRelaxed) next = prev === 'Walk' ? 'Idle' : 'Walk';
          }
        } else {
          const r = Math.random();
          if (preferRelaxed) next = r < 0.52 ? 'Graze' : (r < 0.85 ? 'Walk' : 'Idle');
          else if (r < 0.42) next = 'Graze';
          else if (r < 0.78) next = 'Walk';
          else if (r < 0.94) next = 'Idle';
          else next = 'Jump';
          if (next === prev && !preferRelaxed) next = prev === 'Graze' ? 'Walk' : 'Graze';
        }
        s.state = next;
        if (next === 'DustBath') { s.dustCycle = 0; s.dustLoopsLeft = 1; s.stateTimer = 8.0; }
        else if (next === 'Spit') { s.spitCycle = 0; s.spitFired = false; s.spitLoopsLeft = 1; s.stateTimer = 4.0; }
        else if (next === 'Jump') { s.jumpPhase = 'hop'; s.jumpTime = 0; s.stateTimer = 5.0 + Math.random() * 2.5; }
        else { s.stateTimer = 10 + Math.random() * 12; }
        if (selectedSheep === s) syncToolbarActiveButton();
      }

      function updateSheep(dt, elapsed) {
        updateGrassNibbles(dt);
        updatePairInteractions(dt);
        updateHerdingEvent(dt, elapsed);
        for (let i = sheepList.length - 1; i >= 0; i--) {
          const s = sheepList[i];

          // Pop-in / shrink-out scale animation
          if (s.deleting) {
            s.spawnScale = Math.max(0, s.spawnScale - dt * 5.2);
            s.root.scale.setScalar(s.spawnScale);
            if (s.spawnScale <= 0.01) {
              releaseFloeOccupancy(s);
              if (s.forageTarget && s.forageTarget.claimedBy === s) s.forageTarget.claimedBy = null;
              if (s.pairInteraction) clearPairInteraction(s.pairInteraction);
              dioramaGroup.remove(s.root);
              if (selectedSheep === s) selectedSheep = null;
              if (hoveredSheep === s) hoveredSheep = null;
              sheepList.splice(i, 1);
            }
            continue;
          } else if (s.spawnScale < 1) {
            s.spawnScale = Math.min(1, s.spawnScale + dt * 4.5);
            const overshoot = 1 + Math.sin(s.spawnScale * Math.PI) * 0.12;
            s.root.scale.setScalar(s.spawnScale * overshoot);
            if (s.spawnScale >= 1) s.root.scale.setScalar(1);
          }

          if (s.avoidCooldown > 0) {
            s.avoidCooldown = Math.max(0, s.avoidCooldown - dt);
          }
          if (s.vaultCooldown > 0) {
            s.vaultCooldown = Math.max(0, s.vaultCooldown - dt);
          }
          if (s.steppedCooldown > 0) {
            s.steppedCooldown = Math.max(0, s.steppedCooldown - dt);
          }
          if (s.fleePenCooldown > 0) s.fleePenCooldown = Math.max(0, s.fleePenCooldown - dt);
          if (s.drinkCooldown > 0) s.drinkCooldown = Math.max(0, s.drinkCooldown - dt);
          if (s.wadeCooldown > 0) s.wadeCooldown = Math.max(0, s.wadeCooldown - dt);
          if (s.swimCooldown > 0) s.swimCooldown = Math.max(0, s.swimCooldown - dt);
          if (s.diveCooldown > 0) s.diveCooldown = Math.max(0, s.diveCooldown - dt);

          // Penguin autonomous swim to floating ice floe OR dive-fishing near icy shoreline!
          if (s.isPenguin && !s.grabbed && !s.herded && !s.pairInteraction && s.angerTimer <= 0 && s.scaredTimer <= 0 && s.fleePenTimer <= 0 && s.celebrateTimer <= 0 && s.rebirthTimer <= 0 && !s.swimAction && !s.diveAction) {
            const coastDist = getArcticCoastZ(s.root.position.x) - s.root.position.z;
            if (coastDist < 1.85 && (s.state === 'Walk' || s.state === 'Slide')) {
              if (s.swimCooldown <= 0 && Math.random() < 0.35) {
                s.swimCooldown = 16 + Math.random() * 12;
                const candFloe = ARCTIC_FLOES.find(fl => fl.occupants.length < fl.cap && !fl.occupants.some(o => o.isCat));
                if (candFloe && claimFloe(candFloe, s)) {
                  const slot = pickPenguinFloeSlot(candFloe);
                  s.swimAction = {
                    phase: 'to_floe', floe: candFloe,
                    slotSign: slot.slotSign, offX: slot.offX, offZ: slot.offZ,
                    loungeTimer: 6.5 + Math.random() * 4.5,
                    shoreX: s.root.position.x, shoreZ: getArcticCoastZ(s.root.position.x) - 0.95,
                    rippleT: 0.15, enteredWater: false
                  };
                }
              } else if (s.diveCooldown <= 0 && Math.random() < 0.32) {
                s.diveCooldown = 18 + Math.random() * 14;
                s.diveAction = {
                  phase: 'dive_in', t: 0,
                  shoreX: s.root.position.x, shoreZ: getArcticCoastZ(s.root.position.x) - 0.85,
                  waterX: s.root.position.x + (Math.random() - 0.5) * 0.8,
                  waterZ: getArcticCoastZ(s.root.position.x) + 1.05,
                  rippleT: 0.2
                };
              }
            }
          }
          if (s.shakeCooldown > 0) s.shakeCooldown = Math.max(0, s.shakeCooldown - dt);
          if (s.followCooldown > 0) s.followCooldown = Math.max(0, s.followCooldown - dt);

          // Countdown sweater duration -> trigger magical golden wool rebirth!
          if (s.hasSweater && !s.grabbed && !s.herded && s.rebirthTimer <= 0) {
            s.sweaterTimer -= dt;
            if (s.sweaterTimer <= 0) {
              s.rebirthTimer = 1.85;
              spawnGoldenRebirthFX(s);
            }
          }

          // Forest squirrel empty-basket recovery timer -> golden refill celebration!
          if (s.isSquirrel && s.basketEmpty && !s.grabbed && !s.herded && s.rebirthTimer <= 0) {
            s.refillTimer -= dt;
            if (s.refillTimer <= 0) {
              s.rebirthTimer = 1.85;
              spawnGoldenRebirthFX(s);
            }
          }

          // Forest squirrel foraging: spot fallen ground nuts & scurry to collect them (or full-map 🤯 stampede!)
          if (s.frenzyTimer > 0) s.frenzyTimer = Math.max(0, s.frenzyTimer - dt);
          if (s.forageCooldown > 0) s.forageCooldown = Math.max(0, s.forageCooldown - dt);
          if (
            s.isSquirrel && !s.grabbed && !s.herded && !s.pairInteraction &&
            s.angerTimer <= 0 && s.scaredTimer <= 0 && s.fleePenTimer <= 0 &&
            s.celebrateTimer <= 0 && s.rebirthTimer <= 0 && !s.forageTarget &&
            (s.frenzyTimer > 0 || s.forageCooldown <= 0) && forestNuts.length > 0 &&
            (s.frenzyTimer > 0 || s.basketEmpty || s.state === 'Walk' || s.state === 'Idle' || s.state === 'Nibble')
          ) {
            const searchR = s.frenzyTimer > 0 ? 32.0 : (s.basketEmpty ? 14.0 : 7.2);
            let bestNut = null;
            let bestD = searchR;
            const sBank = s.root.position.x >= getRiverCenterX(s.root.position.z);
            for (let k = 0; k < forestNuts.length; k++) {
              const fn = forestNuts[k];
              if (fn.falling) continue;
              const fnBank = fn.x >= getRiverCenterX(fn.z);
              if (fnBank !== sBank) continue;
              const d = Math.hypot(fn.x - s.root.position.x, fn.z - s.root.position.z);
              const alreadyClaimed = fn.claimedBy && fn.claimedBy !== s && fn.claimedBy.forageTarget === fn;
              if (s.frenzyTimer <= 0 && alreadyClaimed && Math.random() > 0.45) continue;
              if (d < bestD) { bestD = d; bestNut = fn; }
            }
            if (bestNut && (s.frenzyTimer > 0 || s.basketEmpty || Math.random() < 0.72)) {
              if (!bestNut.claimedBy) bestNut.claimedBy = s;
              s.forageTarget = bestNut;
              s.foragePickTimer = 0;
            } else {
              s.forageCooldown = s.basketEmpty ? 0.9 : (2.2 + Math.random() * 2.8);
            }
          }

          // Trigger gentle flock-following, riverbank drinking, or occasional wool shake-off
          if (!s.grabbed && !s.herded && s.angerTimer <= 0 && s.scaredTimer <= 0 && s.fleePenTimer <= 0 && !s.pairInteraction && s.vaultTime <= 0) {
            // Oasis shallow wading (Desert Alpacas ONLY) or Riverbank drinking (Meadow Sheep)
            const distWater = Math.abs(s.root.position.x - getRiverCenterX(s.root.position.z)) - getRiverHalfWidth(s.root.position.z);
            if (getWorldRules().flock.canWadeOasis && !s.wadeAction && s.wadeCooldown <= 0 && s.state === 'Walk' && distWater < 1.25 && !isOnBridge(s.root.position.x, s.root.position.z, 0.35)) {
              s.wadeCooldown = 14 + Math.random() * 10;
              if (Math.random() < 0.65) {
                const rCx = getRiverCenterX(s.root.position.z);
                const bankSide = s.root.position.x >= rCx ? 1 : -1;
                s.wadeAction = {
                  phase: 'enter', t: 0, enterDur: 0.75, splashDur: 2.9 + Math.random() * 1.4, exitDur: 0.85,
                  bankX: s.root.position.x, bankZ: s.root.position.z,
                  shallowX: rCx + bankSide * (getRiverHalfWidth(s.root.position.z) - 0.12), shallowZ: s.root.position.z,
                  entryRippleDone: false, splashedBeat: -1
                };
              }
            } else if (!getWorldRules().flock.canWadeOasis && !isSouthOcean() && s.drinkTimer <= 0 && s.drinkCooldown <= 0 && distWater < 1.15 && !isOnBridge(s.root.position.x, s.root.position.z, 0.25)) {
              s.drinkCooldown = 12 + Math.random() * 12;
              if (Math.random() < 0.35) {
                s.drinkTimer = 2.6;
                s.drinkRippleT = 0.2;
              }
            }
            // Occasional adorable wool shake-off
            if (s.shakeTimer <= 0 && s.shakeCooldown <= 0 && (s.state === 'Idle' || s.state === 'Graze')) {
              s.shakeCooldown = 14 + Math.random() * 14;
              if (Math.random() < 0.22) {
                s.shakeTimer = 0.85;
                spawnGrassNibbles(s);
              }
            }
            // Flock leader-following instinct (follow a walking sheep nearby!)
            if (!s.followLeader && s.followCooldown <= 0 && (s.state === 'Idle' || s.state === 'Graze')) {
              for (let j = 0; j < sheepList.length; j++) {
                const cand = sheepList[j];
                if (cand === s || cand.deleting || cand.grabbed || cand.herded || cand.state !== 'Walk') continue;
                const d = Math.hypot(cand.root.position.x - s.root.position.x, cand.root.position.z - s.root.position.z);
                if (d > 1.3 && d < 3.6) {
                  s.followCooldown = 14 + Math.random() * 10;
                  if (Math.random() < 0.24) {
                    s.followLeader = cand;
                    s.followTimer = 4.5 + Math.random() * 3.0;
                  }
                  break;
                }
              }
            }
          }
          // Real-time anti-corner-stuck watchdog for any moving sheep
          const isActivelyMoving = !s.grabbed && !s.herded && !s.pairInteraction && s.angerTimer <= 0 && s.scaredTimer <= 0 && s.drinkTimer <= 0 && s.shakeTimer <= 0 && s.rebirthTimer <= 0 && (
            s.state === 'Walk' ||
            (s.state === 'Graze' && s.grazePhase === 'walk') ||
            (s.state === 'Jump' && s.jumpPhase === 'walk') ||
            s.fleePenTimer > 0 ||
            Boolean(s.followLeader)
          );
          if (isActivelyMoving) {
            s.stuckTimer += dt;
            if (s.stuckTimer >= 0.95) {
              const movedDist = Math.hypot(s.root.position.x - s.lastCheckX, s.root.position.z - s.lastCheckZ);
              if (movedDist < 0.22) {
                // Unstick immediately: drop follower lock, pick a guaranteed open heading, and gently nudge inward!
                s.followLeader = null;
                s.fleePenTimer = 0;
                const clearAng = computeSafeEscapeAngle(s.root.position.x, s.root.position.z, s.root.rotation.y);
                s.targetRotY = clearAng;
                s.root.rotation.y = clearAng;
                s.avoidCooldown = 0.65;
                const nx = s.root.position.x + Math.sin(clearAng) * 0.35;
                const nz = s.root.position.z + Math.cos(clearAng) * 0.35;
                if (!isPositionBlocked(nx, nz, 0)) {
                  s.root.position.x = nx;
                  s.root.position.z = nz;
                }
              }
              s.lastCheckX = s.root.position.x;
              s.lastCheckZ = s.root.position.z;
              s.stuckTimer = 0;
            }
          } else {
            s.stuckTimer = 0;
            s.lastCheckX = s.root.position.x;
            s.lastCheckZ = s.root.position.z;
          }

          // If a moving sheep wanders near the sheep pen, it gets spooked and quickly runs away!
          if (!s.grabbed && s.fleePenTimer <= 0 && s.fleePenCooldown <= 0 && s.scaredTimer <= 0 && !s.pairInteraction) {
            const isMoving = s.state === 'Walk' || s.state === 'Jump' || (s.state === 'Graze' && s.grazePhase === 'walk');
            if (isMoving && isInsidePen(s.root.position.x, s.root.position.z, 1.75)) {
              const awayX = s.root.position.x - PEN_X;
              const awayZ = s.root.position.z - PEN_Z;
              let runAng = Math.atan2(awayX - 0.6, awayZ + 0.9);
              if (isPositionBlocked(s.root.position.x + Math.sin(runAng) * 1.5, s.root.position.z + Math.cos(runAng) * 1.5, 0.05)) {
                runAng = computeSafeEscapeAngle(s.root.position.x, s.root.position.z, runAng);
              }
              s.targetRotY = runAng;
              s.fleePenTimer = 1.85;
              s.fleePenCooldown = 4.5;
              s.vaultTime = 0;
            }
          }

          // Smooth yaw rotation (slightly brisker when avoiding obstacles)
          const turnRate = s.avoidCooldown > 0 ? 10.5 : 6.5;
          s.root.rotation.y += shortestAngleDiff(s.root.rotation.y, s.targetRotY) * Math.min(1, dt * turnRate);

          // Smooth vertical elevation following (lifted high when grabbed, otherwise follows grass/bridge)
          const targetGroundY = s.grabbed
            ? getGroundY(s.root.position.x, s.root.position.z) + 1.55
            : getGroundY(s.root.position.x, s.root.position.z);
          s.root.position.y += (targetGroundY - s.root.position.y) * Math.min(1, dt * (s.grabbed ? 18 : 14));

          const t = elapsed + s.phase;
          let targetHeadX = 0.0;
          let targetHeadY = 0.0;
          let targetHeadZ = 0.0;
          let targetBodyY = 0.0;
          let targetBodyPitch = 0.0;
          let targetBodyRoll = 0.0;
          let targetScaleY = 1.0;
          let targetScaleXZ = 1.0;
          let legSwing = 0.0;
          let legSwingBack = null;
          let customLegX = null;
          let customLegZ = null;
          let customBodyX = 0.0;
          let showQuestion = false;
          let showAngry = false;
          let showSweat = false;
          let showClap = false;
          let showCry = false;
          let sqMoodTex = null;
          let sqCheekScale = 1.0;
          let sqSquint = false;
          if (s.squirrelAcorn) s.squirrelAcorn.visible = false;

          if (s.dropSquash > 0) {
            s.dropSquash = Math.max(0, s.dropSquash - dt * 3.8);
          }

          if (s.grabbed) {
            // Frantic cute struggling while lifted by the mouse
            targetBodyRoll = Math.sin(t * 22) * 0.24;
            targetBodyPitch = Math.cos(t * 16) * 0.14;
            targetBodyY = Math.sin(t * 18) * 0.05;
            targetHeadX = -0.22 + Math.sin(t * 20) * 0.14;
            targetHeadY = Math.sin(t * 26) * 0.42;
            targetHeadZ = Math.cos(t * 22) * 0.20;
            targetScaleY = 1.07;
            targetScaleXZ = 0.95;
            legSwing = Math.sin(t * 30) * 0.85;
            legSwingBack = Math.cos(t * 32) * 0.82;
          } else if (s.angerTimer > 0) {
            // Glaring up at the camera with cute angry puff & indignant head tilt
            s.angerTimer = Math.max(0, s.angerTimer - dt);
            showAngry = true;
            const lookX = (s.angerLookTarget && !s.angerLookTarget.deleting)
              ? s.angerLookTarget.root.position.x
              : camera.position.x;
            const lookZ = (s.angerLookTarget && !s.angerLookTarget.deleting)
              ? s.angerLookTarget.root.position.z
              : camera.position.z;
            s.targetRotY = Math.atan2(
              lookX - s.root.position.x,
              lookZ - s.root.position.z
            );
            const stomp = Math.sin(t * 16);
            const huff = Math.sin(t * 10) * 0.04;
            targetHeadX = -0.46 + huff;
            targetHeadY = Math.sin(t * 24) * 0.06;
            targetHeadZ = 0.10;
            targetBodyPitch = -0.08;
            targetBodyRoll = Math.sin(t * 26) * 0.045;
            targetScaleXZ = 1.07 + huff;
            targetScaleY = 0.96 - huff * 0.5;
            legSwing = stomp > 0.7 ? 0.26 : 0;
            targetBodyY = stomp > 0.7 ? 0.04 : 0;
          } else if (s.exitingCottage) {
            const wp = t * 10.5;
            legSwing = Math.sin(wp) * 0.50;
            targetBodyY = Math.abs(Math.sin(wp)) * 0.055;
            targetHeadX = 0.08;
          } else if (s.herded && herdingEvent && herdingEvent.sheep === s) {
            const st = herdingEvent.stage;
            if (st === 'herd') {
              showSweat = true;
              const rp = t * 17.5;
              legSwing = Math.sin(rp) * 0.72;
              targetBodyY = Math.abs(Math.sin(rp)) * 0.09;
              targetBodyRoll = Math.sin(rp) * 0.08;
              targetHeadX = -0.10;
              targetHeadY = Math.sin(t * 14) * 0.25;
            } else if (st === 'shiver' && s.isPenguin) {
              // Penguin resists entering the Hot Spring: frantic head shaking & flapping flippers!
              showSweat = true;
              sqMoodTex = alertMarkTex;
              targetBodyPitch = -0.14;
              targetBodyRoll = Math.sin(t * 24) * 0.16;
              targetHeadY = Math.sin(t * 26) * 0.55;
              targetBodyY = Math.abs(Math.sin(t * 16)) * 0.05;
              if (s.penguinFlippers) {
                s.penguinFlippers[0].rotation.z = -1.15 + Math.sin(t * 26) * 0.45;
                s.penguinFlippers[1].rotation.z =  1.15 - Math.sin(t * 26) * 0.45;
              }
            } else if (st === 'soak_bliss' && s.isPenguin) {
              // Blissful hot-spring soak: submerged to chest, happy squint eyes, folded white towel on head & floating heart!
              sqSquint = true;
              sqMoodTex = heartMarkTex;
              targetBodyY = -0.22 + Math.sin(t * 2.8) * 0.025;
              targetBodyRoll = Math.sin(t * 2.4) * 0.09;

              targetHeadY = Math.sin(t * 22.0) * 0.35;

            } else if (st === 'exit_pen') {

            } else if (st === 'enter_house') {

            }
          } else if (s.fleePenTimer > 0) {
            // Spooked by the sheep pen -> quickly scamper away with nervous sweat drop!

            const runPhase = t * 18.0;

            targetBodyY = Math.abs(Math.sin(runPhase)) * 0.10;
            targetBodyRoll = Math.sin(runPhase) * 0.08;
            targetHeadX = -0.14;
            targetHeadY = Math.sin(t * 22) * 0.14;
          } else if (s.scaredTimer > 0) {
            // Embarrassed & scared sheep after waking up the Golden Cat!
            s.scaredTimer = Math.max(0, s.scaredTimer - dt);
            showSweat = true;
            if (s.scaredTarget) {
              const dx = s.scaredTarget.root.position.x - s.root.position.x;
              const dz = s.scaredTarget.root.position.z - s.root.position.z;
              const dist = Math.hypot(dx, dz);
              // Face the angry cat nervously while tiptoeing slightly backward
              s.targetRotY = Math.atan2(dx, dz);
              if (dist > 0.01 && dist < 2.15) {

            targetBodyY = -0.055;
            targetBodyPitch = 0.14;
            targetBodyRoll = Math.sin(t * 36) * 0.085;
            targetScaleY = 0.88;
            targetScaleXZ = 1.07;
            targetHeadX = 0.34;
            targetHeadY = Math.sin(t * 22) * 0.24;
            targetHeadZ = 0.18;
            legSwing = Math.sin(t * 20) * 0.22;
          } else if (s.pairInteraction) {

                targetBodyPitch = 0.24;

            } else if (inter.type === 'love') {

              targetHeadZ = (isFirst ? 1 : -1) * (0.20 + nuzzle * 0.14);

              targetBodyRoll = (isFirst ? 1 : -1) * nuzzle * 0.08;
              targetBodyY = Math.abs(nuzzle) * 0.03;
              targetScaleY = 1.0 + Math.sin(inter.elapsed * 4.4) * 0.025;

              targetHeadY = slap * 0.22;

            } else {

                targetBodyPitch = 0.34 * lunge;
                targetHeadX = 0.68 * lunge;
                targetBodyY = 0.14 * lunge;
                targetBodyRoll = (isFirst ? 1 : -1) * Math.sin(inter.elapsed * 32) * 0.14;

                targetHeadX = -0.18 * recoil;
                targetHeadY = Math.sin(inter.elapsed * 28) * 0.22;

          } else if (s.vaultTime > 0) {

          } else if (s.celebrateTimer > 0) {

            targetBodyY = Math.abs(sway) * 0.035;
            targetBodyRoll = sway * 0.05;
          } else if (s.rebirthTimer > 0) {

              targetBodyY = -0.04;
              targetScaleY = 0.92;

          } else if (s.wadeAction) {

                  const hx = s.root.position.x + fwdX * 0.26 + fwdZ * sideOff;
                  const hz = s.root.position.z + fwdZ * 0.26 - fwdX * sideOff;

              targetHeadX = 0.36 + Math.sin(wa.t * 3.4) * 0.10;

              spawnWaterRipple(rCx + side * (getRiverHalfWidth(s.root.position.z) * 0.72), s.root.position.z, 1.5);

          } else if (s.shakeTimer > 0) {
            // Brisk full-body wool shake-off!

            targetHeadZ = -Math.sin(t * 48) * 0.30;
            targetScaleXZ = 1.06;
            targetScaleY = 0.96;
          } else if (weatherMode === 'rain' && s.state !== 'Jump') {

            if (bestD > 1.75) {
              s.targetRotY = Math.atan2(bestT.x - s.root.position.x, bestT.z - s.root.position.z);

              legSwing = Math.sin(wp) * 0.50;
              targetBodyY = Math.abs(Math.sin(wp)) * 0.05;

              targetBodyY = -0.03;
              targetHeadX = 0.24;
            }
          } else if (s.forageTarget) {
            const fn = s.forageTarget;
            if (!forestNuts.includes(fn)) {
              s.forageTarget = null;
            } else {
              const dx = fn.x - s.root.position.x;
              const dz = fn.z - s.root.position.z;
              const dist = Math.hypot(dx, dz);
              if (dist > 0.42 && s.foragePickTimer <= 0) {
                s.targetRotY = Math.atan2(dx, dz);
                const runSpd = s.frenzyTimer > 0 ? 2.45 : (s.basketEmpty ? 1.85 : 1.45);
                stepForwardSafely(s, runSpd, dt, 0.65, false);
                const wp = t * (s.frenzyTimer > 0 ? 16.5 : 11.5);
                legSwing = Math.sin(wp) * (s.frenzyTimer > 0 ? 0.72 : 0.56);
                targetBodyY = Math.abs(Math.sin(wp)) * (s.frenzyTimer > 0 ? 0.11 : 0.07);
                targetHeadX = 0.14;
                if (s.squirrelTailPivot) {
                  s.squirrelTailPivot.rotation.x = -0.12 + Math.sin(wp) * 0.14;
                }
              } else {
                // Check if a rival squirrel also reached or is racing right next to this nut -> tug-of-war scramble!
                let rival = null;
                for (let r = 0; r < sheepList.length; r++) {
                  const other = sheepList[r];
                  if (other === s || !other.isSquirrel || other.deleting || other.grabbed || other.herded || other.pairInteraction) continue;
                  const rd = Math.hypot(other.root.position.x - fn.x, other.root.position.z - fn.z);
                  if (rd < 1.35 && (other.forageTarget === fn || Math.random() < 0.35)) {
                    rival = other;
                    break;
                  }
                }
                if (rival) {
                  worldEnvGroup.remove(fn.mesh);
                  const idx = forestNuts.indexOf(fn);
                  if (idx !== -1) forestNuts.splice(idx, 1);
                  s.forageTarget = null;
                  s.foragePickTimer = 0;
                  if (rival.forageTarget === fn) { rival.forageTarget = null; rival.foragePickTimer = 0; }
                  startPairInteraction(s, rival, 'tug');
                } else {
                  // Reached the ground nut -> bend down & scoop it into the basket!
                  s.foragePickTimer += dt;
                  targetBodyPitch = 0.36;
                  targetHeadX = 0.62;
                  customLegX = [-0.75, -0.75, 0.12, 0.12];
                  if (s.foragePickTimer >= 0.36) {
                    worldEnvGroup.remove(fn.mesh);
                    const idx = forestNuts.indexOf(fn);
                    if (idx !== -1) forestNuts.splice(idx, 1);

                    s.foragePickTimer = 0;

                    if (s.basketEmpty) {
                      s.nutsCollected = (s.nutsCollected || 0) + 1;
                      if (s.basketNutsGroup) {
                        s.basketNutsGroup.visible = true;
                        s.basketNutsGroup.children.forEach((ch, ci) => { ch.visible = ci < s.nutsCollected; });

                      if (s.nutsCollected >= 6 && s.rebirthTimer <= 0) {
                        s.rebirthTimer = 1.85;
                        spawnGoldenRebirthFX(s);

                    }
                  }
                }
              }
            }
          } else if (s.followLeader) {
            s.followTimer -= dt;
            const ld = s.followLeader;
            if (s.followTimer <= 0 || !ld || ld.deleting || ld.grabbed || ld.herded) {
              s.followLeader = null;
            } else {
              const dx = ld.root.position.x - s.root.position.x;
              const dz = ld.root.position.z - s.root.position.z;
              const dist = Math.hypot(dx, dz);
              if (dist > 1.35 && dist < 6.0) {
                s.targetRotY = Math.atan2(dx, dz);
                stepForwardSafely(s, 1.18, dt, 0.75, false);

                s.followLeader = null;
              }
            }
          } else if (s.swimAction && s.isPenguin) {
            const sw = s.swimAction;
            const fl = sw.floe;
            if (sw.phase === 'free_swim') {
              sw.swimTimer -= dt;
              sw.turnTimer = (sw.turnTimer || 0) - dt;
              if (sw.turnTimer <= 0) {
                sw.heading = (sw.heading !== undefined ? sw.heading : s.root.rotation.y) + (Math.random() - 0.5) * 1.4;
                sw.turnTimer = 1.6 + Math.random() * 2.0;
              }
              const nx = s.root.position.x + Math.sin(sw.heading) * 1.80 * dt;
              const nz = s.root.position.z + Math.cos(sw.heading) * 1.80 * dt;
              const coastLimit = getArcticCoastZ(nx) + 0.55;
              const hitFloe = getIceFloeAt(nx, nz, 0.32);

              targetHeadY = snap === 0 ? -0.82 : (snap === 1 ? 0.82 : 0.0);
              customLegX = [-0.45, -0.45, 0.18, 0.18];
              if (s.squirrelTailPivot) s.squirrelTailPivot.rotation.z = Math.sin(t * 14) * 0.16;
            } else if (s.buryCycle < 3.35) {
              const dig = Math.sin(t * 18.0);
              targetBodyY = 0.02 + Math.abs(dig) * 0.025;
              targetBodyPitch = 0.36;
              targetHeadX = 0.50 + dig * 0.12;
              customLegX = [-0.68 + dig * 0.58, -0.68 - dig * 0.58, 0.12, 0.12];
              if (s.squirrelTailPivot) {
                s.squirrelTailPivot.rotation.x = -0.18 + Math.sin(t * 11.0) * 0.16;
                s.squirrelTailPivot.rotation.z = Math.sin(t * 9.0) * 0.18;
              }
              if (Math.random() < dt * 4.5) spawnGrassNibbles(s);
            } else {
              if (!s.moundSpawnedThisCycle) {
                s.moundSpawnedThisCycle = true;
                const yaw = s.root.rotation.y;
                spawnBuryMound(s.root.position.x + Math.sin(yaw) * 0.36, s.root.position.z + Math.cos(yaw) * 0.36);
              }
              const hopP = (s.buryCycle - 3.35) / 0.85;
              sqSquint = true;
              targetBodyY = Math.sin(hopP * Math.PI) * 0.26;
              targetBodyPitch = -0.16;
              customLegX = [-0.8, -0.8, 0.3, 0.3];
              if (hopP > 0.92) s.moundSpawnedThisCycle = false;
            }
          } else if (s.state === 'Spit' && s.isAlpaca) {
            s.spitCycle = (s.spitCycle + dt * 0.62) % 1.0;
            const sc = s.spitCycle;
            if (sc < 0.38) {
              const w = sc / 0.38;
              targetHeadX = -0.58 * Math.sin(w * Math.PI * 0.5);
              targetBodyPitch = -0.10 * w;
              s.spitFired = false;
            } else if (sc < 0.56) {
              targetHeadX = 0.24;
              targetBodyPitch = 0.08;
              if (!s.spitFired) { s.spitFired = true; spawnSpitBurst(s); }
            } else {
              targetHeadX = 0.04;
              targetHeadY = Math.sin(t * 6.0) * 0.16;
              if (sc > 0.92 && s.spitFired) {
                s.spitFired = false;
                s.spitLoopsLeft--;
                if (s.spitLoopsLeft <= 0) pickNextFlockState(s, true);
              }
            }
          } else if (s.state === 'DustBath' && s.isAlpaca) {
            if (isNearWaterOrBridge(s.root.position.x, s.root.position.z, -0.15)) {
              s.state = 'Walk';
              s.targetRotY = getAwayFromRiverAngle(s.root.position.x, s.root.position.z);
              s.stateTimer = 4.5 + Math.random() * 3.0;
              if (selectedSheep === s) syncToolbarActiveButton();
            } else {
              s.dustCycle = (s.dustCycle + dt / 6.2) % 1.0;
              const dc = s.dustCycle;
              const dDir = s.dustDir;
              const smooth = (u) => { const x = Math.max(0, Math.min(1, u)); return x * x * (3 - 2 * x); };
              const baseGY = getGroundY(s.root.position.x, s.root.position.z);
              let lieBlend = 0, rollTarget = 0;

              if (dc < 0.18) {
                const u = smooth(dc / 0.18);
                targetHeadX = 0.85 * Math.sin(u * Math.PI * 0.85);
                targetHeadY = Math.sin(dc * 28) * 0.18;
                targetBodyPitch = 0.12 * u;
                const paw = Math.sin(dc * 52);
                customLegX = [-0.45 + paw * 0.42, 0.08, 0, 0];
                s.dustFxTimer -= dt;
                if (s.dustFxTimer <= 0 && paw > 0.5) {
                  s.dustFxTimer = 0.28;
                  spawnSandDust(s.root.position.x + Math.sin(s.root.rotation.y) * 0.35, baseGY, s.root.position.z + Math.cos(s.root.rotation.y) * 0.35, 2);
                }
              } else if (dc < 0.30) {
                const u = smooth((dc - 0.18) / 0.12);
                lieBlend = u;
                rollTarget = dDir * (Math.PI * 0.44) * u;
                targetBodyPitch = 0.10 * (1 - u);
                targetHeadX = 0.45 * (1 - u) - 0.22 * u;
                targetHeadY = -dDir * 0.28 * u;
                customLegX = [-0.82 * u, -0.62 * u, 0.82 * u, 0.62 * u];
                customLegZ = [-0.22 * u, 0.22 * u, -0.22 * u, 0.22 * u];
                if (u > 0.78 && s.dustFxTimer <= 0) { s.dustFxTimer = 0.45; spawnSandDust(s.root.position.x, baseGY, s.root.position.z, 5); }
              } else if (dc < 0.74) {
                const u = (dc - 0.30) / 0.44;
                lieBlend = 1.0;
                let activeSide = dDir;
                if (u < 0.42) {
                  const ru = u / 0.42;
                  rollTarget = dDir * (Math.PI * 0.42 + Math.sin(ru * Math.PI * 3.0) * 0.16);
                } else if (u < 0.58) {
                  const tu = smooth((u - 0.42) / 0.16);
                  rollTarget = dDir * (Math.PI * 0.42) * (1 - 2 * tu);
                  activeSide = tu < 0.5 ? dDir : -dDir;
                } else {
                  const ru = (u - 0.58) / 0.42;
                  activeSide = -dDir;
                  rollTarget = -dDir * (Math.PI * 0.42 + Math.sin(ru * Math.PI * 3.0) * 0.16);
                }
                targetBodyPitch = Math.sin(u * Math.PI * 6.0) * 0.06;
                targetHeadX = -0.26 + Math.sin(u * Math.PI * 6.0) * 0.08;
                targetHeadY = -activeSide * (0.24 + Math.sin(u * Math.PI * 4.0) * 0.16);
                customLegX = [0, 1, 2, 3].map(idx => (idx < 2 ? -0.45 : 0.45) + Math.sin(u * Math.PI * 11.0 + idx * 1.55) * 0.42);
                customLegZ = [0, 1, 2, 3].map(idx => (idx % 2 === 0 ? -0.28 : 0.28) + Math.sin(u * Math.PI * 11.0 + idx * 1.55) * 0.12);
                s.dustFxTimer -= dt;
                if (s.dustFxTimer <= 0) { s.dustFxTimer = 0.22 + Math.random() * 0.14; spawnSandDust(s.root.position.x, baseGY, s.root.position.z, 4); }
              } else if (dc < 0.87) {
                const u = smooth((dc - 0.74) / 0.13);
                lieBlend = 1.0 - u;
                rollTarget = -dDir * (Math.PI * 0.42) * (1.0 - u);
                targetBodyPitch = -0.12 * Math.sin(u * Math.PI);
                targetHeadX = -0.18 * (1 - u) + 0.12 * Math.sin(u * Math.PI);
                targetHeadY = dDir * 0.18 * (1 - u);
                customLegX = [-0.75 * (1 - u), -0.55 * (1 - u), 0.75 * (1 - u), 0.55 * (1 - u)];
                customLegZ = [-0.22 * (1 - u), 0.22 * (1 - u), -0.22 * (1 - u), 0.22 * (1 - u)];
              } else {
                const u = (dc - 0.87) / 0.13;
                const shakeEnv = Math.sin(u * Math.PI);
                rollTarget = Math.sin(u * Math.PI * 12.0) * 0.24 * shakeEnv;
                targetHeadY = Math.sin(u * Math.PI * 12.0 - 0.5) * 0.38 * shakeEnv;
                targetHeadX = 0.08 * shakeEnv;
                s.dustFxTimer -= dt;
                if (s.dustFxTimer <= 0 && shakeEnv > 0.35) { s.dustFxTimer = 0.14; spawnSandDust(s.root.position.x, baseGY + 0.45, s.root.position.z, 5); }
                if (u > 0.94) {
                  s.dustDir = -s.dustDir;
                  s.dustLoopsLeft--;
                  if (s.dustLoopsLeft <= 0) { s.dustCycle = 0; pickNextFlockState(s, true); }
                }
              }
              targetBodyRoll = rollTarget;
              const curR = s.bodyRig.rotation.z;
              const desiredTorsoY = 0.62 * (1 - lieBlend) + 0.38 * lieBlend;
              targetBodyY = desiredTorsoY - 0.62 * Math.cos(curR);
              customBodyX = 0.24 * Math.sin(curR);
              targetHeadZ = -curR * 0.72;
            }
          } else if (s.state === 'Idle' || s.state === 'Graze' || s.state === 'Walk' || s.state === 'Jump') {
            s.stateTimer -= dt;
            if (s.stateTimer <= 0) {
              pickNextFlockState(s, s.state === 'Jump');
            }
            if (s.state === 'Idle') {
            if (s.isSquirrel) {
              // Alert Freeze (机警冻住): bolt-upright freeze, paws pressed to chest, crisp 90° head snaps & ❗ sticker!
              sqMoodTex = alertMarkTex;
              const snapIdx = Math.floor(t * 2.1) % 4;
              targetBodyY = 0.05;
              targetBodyPitch = -0.54;
              targetHeadX = 0.28;
              targetHeadY = snapIdx === 0 ? -0.85 : (snapIdx === 2 ? 0.85 : 0.0);
              customLegX = [-1.18, -1.18, 0.48, 0.48];
              if (s.squirrelTailPivot) {
                s.squirrelTailPivot.rotation.x = 0.28 + Math.sin(t * 18.0) * 0.08;
                s.squirrelTailPivot.rotation.z = Math.sin(t * 22.0) * 0.12;
              }
            } else if (s.isAlpaca) {
              if (isNearWaterOrBridge(s.root.position.x, s.root.position.z, -0.15)) {
                s.state = 'Walk';
                s.targetRotY = getAwayFromRiverAngle(s.root.position.x, s.root.position.z);
                s.stateTimer = 4.5 + Math.random() * 3.0;
                if (selectedSheep === s) syncToolbarActiveButton();
              } else {
                targetBodyY = -0.26;
                targetHeadX = Math.sin(t * 5.2) * 0.085;
                targetHeadY = Math.sin(t * 1.05) * 0.38;
                customLegX = [-1.25, -1.25, 1.22, 1.22];
              }
            } else {
            s.idleTimer -= dt;
            if (s.idleTimer <= 0) {
              const allModes = ['lookup', 'spin', 'gaze', 'still'];
              const others = allModes.filter(m => m !== s.idleMode);
              s.idleMode = others[(Math.random() * others.length) | 0];
              s.idleTimer = 2.4 + Math.random() * 2.4;
              if (s.idleMode === 'spin') {
                s.idleSpinDir = Math.random() < 0.5 ? 1 : -1;
              }
            }

            if (s.idleMode === 'lookup') {
              // Look up curiously with cartoon '?' above head
              showQuestion = true;
              targetHeadX = -0.58 + Math.sin(t * 2.6) * 0.05;
              targetHeadY = Math.sin(t * 1.5) * 0.16;
              targetHeadZ = Math.sin(t * 2.2) * 0.22;
              targetBodyPitch = -0.10;
              targetBodyY = Math.sin(t * 2.2) * 0.014;
            } else if (s.idleMode === 'spin') {
              // Slowly turn in a circle on the spot with tiny pitter-patter steps
              s.targetRotY += s.idleSpinDir * 1.05 * dt;
              const stepPhase = t * 5.6;
              legSwing = Math.sin(stepPhase) * 0.24;
              targetBodyY = Math.abs(Math.sin(stepPhase)) * 0.028;
              targetHeadX = -0.05;
              targetHeadY = s.idleSpinDir * 0.22;
            } else if (s.idleMode === 'gaze') {
              // Calmly gaze straight ahead
              targetHeadX = -0.08;
              targetHeadY = 0.0;
              targetBodyY = Math.sin(t * 1.6) * 0.01;
            } else {
              // Purely still, zoning out
              targetHeadX = 0.06;
              targetHeadY = 0.0;
              targetBodyY = Math.sin(t * 1.1) * 0.004;
            }
            }
          } else if (s.state === 'Graze') {
            // Never graze on the wooden bridge or beige dirt path: keep walking until on grass
            const onGrass = canGrazeAt(s.root.position.x, s.root.position.z, s.root.rotation.y);
            if (s.grazePhase === 'eat' && !onGrass) {
              s.grazePhase = 'walk';
              s.grazeTimer = 0.65;
            }

            // Eat grass deeply for 3s -> random walk for random seconds -> repeat
            s.grazeTimer -= dt;
            if (s.grazePhase === 'walk') {
              stepForwardSafely(s, 1.08, dt, 0.72);
              s.walkTurnTimer -= dt;
              if (s.walkTurnTimer <= 0 && s.avoidCooldown <= 0) {
                s.targetRotY += (Math.random() - 0.5) * 1.1;
                s.walkTurnTimer = 1.5 + Math.random() * 2.2;
              }
              const walkPhase = t * 8.2;
              legSwing = Math.sin(walkPhase) * 0.45;
              targetBodyY = Math.abs(Math.sin(walkPhase)) * 0.05;
              targetHeadX = 0.16 + Math.sin(walkPhase * 2) * 0.05;

              if (s.grazeTimer <= 0) {
                if (canGrazeAt(s.root.position.x, s.root.position.z, s.root.rotation.y)) {
                  s.grazePhase = 'eat';
                  s.grazeTimer = 3.0;
                  s.nibbleFxTimer = 0.15;
                } else {
                  // Still on bridge or path — keep walking a bit longer to reach grass
                  s.grazeTimer = 0.5;
                }
              }
            } else {
              // Rich leaning-forward grazing with rhythmic chewing, grass tug, and nibble bits
              const chew = Math.sin(t * 10.5);
              const tug = Math.pow(Math.max(0, Math.sin(t * 3.1)), 4);
              targetBodyPitch = 0.26 + chew * 0.03 - tug * 0.09;
              targetBodyY = -0.055 + chew * 0.014 + tug * 0.03;
              targetHeadX = 1.04 + chew * 0.15 - tug * 0.28;
              targetHeadY = Math.sin(t * 2.6) * 0.30;
              targetScaleY = 1.0 - 0.04 + chew * 0.02;
              targetScaleXZ = 1.0 + 0.03 - chew * 0.015;

              s.nibbleFxTimer -= dt;
              if (s.nibbleFxTimer <= 0) {
                spawnGrassNibbles(s);
                s.nibbleFxTimer = 0.42 + Math.random() * 0.28;
              }

              if (s.grazeTimer <= 0) {
                s.grazePhase = 'walk';
                s.grazeTimer = 1.8 + Math.random() * 2.8;
                if (s.avoidCooldown <= 0) {
                  s.targetRotY += (Math.random() - 0.5) * 1.3;
                }
              }
            }
          } else if (s.state === 'Walk' && s.isSquirrel) {
            // Dart-and-Brake Pulse Run (冲刺急刹): fast bounding sprint -> sudden upright stop & scan -> dart again!
            s.dartTimer -= dt;
            if (s.dartTimer <= 0) {
              s.dartPhase = s.dartPhase === 'run' ? 'brake' : 'run';
              s.dartTimer = s.dartPhase === 'run' ? (0.85 + Math.random() * 0.55) : (0.42 + Math.random() * 0.30);
              if (s.dartPhase === 'run' && s.avoidCooldown <= 0) {
                s.targetRotY += (Math.random() - 0.5) * 1.1;
              }
            }
            if (s.dartPhase === 'run') {
              stepForwardSafely(s, 2.05, dt, 0.76);
              const bp = t * 16.5;
              legSwing = Math.sin(bp) * 0.68;
              targetBodyY = Math.abs(Math.sin(bp)) * 0.11;
              targetBodyPitch = Math.sin(bp) * 0.22;
              targetHeadX = 0.04;
              if (s.squirrelTailPivot) {
                s.squirrelTailPivot.rotation.x = -0.35 + Math.sin(bp) * 0.18;
              }
            } else {
              // Sudden crisp brake & quick scan!
              targetBodyY = 0.04;
              targetBodyPitch = -0.38;
              targetHeadX = 0.20;
              targetHeadY = Math.sin(t * 14.0) * 0.62;
              customLegX = [-0.95, -0.95, 0.32, 0.32];
            }
          } else if (s.state === 'Walk') {
            // Smooth forward walking with reliable riverbank & border avoidance
            stepForwardSafely(s, 1.15, dt, 0.72);

            s.walkTurnTimer -= dt;
            if (s.walkTurnTimer <= 0 && s.avoidCooldown <= 0) {
              s.targetRotY += (Math.random() - 0.5) * 1.15;
              s.walkTurnTimer = 2.4 + Math.random() * 3.0;
            }

            const walkPhase = t * (s.isPenguin ? 9.5 : 8.5);
            legSwing = Math.sin(walkPhase) * (s.isPenguin ? 0.36 : 0.48);
            targetBodyY = Math.abs(Math.sin(walkPhase)) * 0.055;
            if (s.isPenguin) {
              targetBodyRoll = Math.sin(walkPhase) * 0.19;
              targetHeadX = 0.04;
              if (s.penguinFlippers) {
                s.penguinFlippers[0].rotation.z = -0.42 + Math.sin(walkPhase) * 0.14;
                s.penguinFlippers[1].rotation.z =  0.42 + Math.sin(walkPhase) * 0.14;
              }
            } else {
              targetHeadX = 0.10 + Math.sin(walkPhase * 2) * 0.04;
            }
          } else if (s.state === 'Jump') {
            // Forward jump -> land -> random walk for random seconds -> jump again
            if (s.jumpPhase === 'walk') {
              stepForwardSafely(s, 1.15, dt, 0.75);
              s.walkTurnTimer -= dt;
              if (s.walkTurnTimer <= 0 && s.avoidCooldown <= 0) {
                s.targetRotY += (Math.random() - 0.5) * 1.1;
                s.walkTurnTimer = 1.6 + Math.random() * 2.2;
              }

              const walkPhase = t * 8.5;
              legSwing = Math.sin(walkPhase) * 0.48;
              targetBodyY = Math.abs(Math.sin(walkPhase)) * 0.055;
              targetHeadX = 0.10 + Math.sin(walkPhase * 2) * 0.04;

              s.jumpWalkTimer -= dt;
              if (s.jumpWalkTimer <= 0) {
                // Before next hop, ensure facing away from river/edge
                const dirX = Math.sin(s.root.rotation.y);
                const dirZ = Math.cos(s.root.rotation.y);
                if (isPositionBlocked(s.root.position.x + dirX * 1.35, s.root.position.z + dirZ * 1.35, 0.1)) {
                  s.targetRotY = computeSafeEscapeAngle(s.root.position.x, s.root.position.z);
                  s.avoidCooldown = 0.5;
                }
                s.jumpPhase = 'hop';
                s.jumpTime = 0;
              }
            } else {
              // Forward parabolic hop cycle
              s.jumpTime += dt * 1.25;
              const cycle = Math.min(1.0, s.jumpTime);
              if (cycle < 0.18) {
                // Anticipation crouch (also steer safely if right next to river)
                const dirX = Math.sin(s.root.rotation.y);
                const dirZ = Math.cos(s.root.rotation.y);
                if (isPositionBlocked(s.root.position.x + dirX * 1.25, s.root.position.z + dirZ * 1.25, 0.1) && s.avoidCooldown <= 0) {
                  s.targetRotY = computeSafeEscapeAngle(s.root.position.x, s.root.position.z);
                  s.avoidCooldown = 0.5;
                }
                const p = cycle / 0.18;
                targetBodyY = -0.06 * Math.sin(p * Math.PI);
                targetScaleY = 1 - 0.14 * Math.sin(p * Math.PI);
                targetScaleXZ = 1 + 0.09 * Math.sin(p * Math.PI);
                targetHeadX = 0.18;
              } else if (cycle < 0.74) {
                // Forward airborne leap
                const p = (cycle - 0.18) / 0.56;
                const arc = Math.sin(p * Math.PI);
                stepForwardSafely(s, s.isPenguin ? 1.18 : 2.55, dt, 0.85, !s.isPenguin);
                targetBodyY = arc * (s.isPenguin ? 0.42 : 1.45);
                targetScaleY = 1 + arc * 0.10;
                targetScaleXZ = 1 - arc * 0.05;
                targetHeadX = -0.18 * arc;
                legSwing = (s.isPenguin ? 0.32 : 0.55) * arc;
                if (s.isPenguin && s.penguinFlippers) {
                  s.penguinFlippers[0].rotation.z = -0.95 * arc;
                  s.penguinFlippers[1].rotation.z =  0.95 * arc;
                }
              } else {
                // Soft elastic landing recovery
                const p = (cycle - 0.74) / 0.26;
                const squash = Math.sin(p * Math.PI) * Math.exp(-p * 1.6);
                targetBodyY = -0.04 * squash;
                targetScaleY = 1 - 0.14 * squash;
                targetScaleXZ = 1 + 0.10 * squash;
                targetHeadX = 0.12 * squash;
              }

              if (s.jumpTime >= 1.0) {
                s.jumpPhase = 'walk';
                s.jumpWalkTimer = 1.6 + Math.random() * 2.6;
                if (s.avoidCooldown <= 0) {
                  s.targetRotY += (Math.random() - 0.5) * 0.9;
                }
              }
            }
            }
          }

          // Smoothly blend pose transitions
          const lerpK = Math.min(1, dt * 11);
          s.headPivot.rotation.x += (targetHeadX - s.headPivot.rotation.x) * lerpK;
          s.headPivot.rotation.y += (targetHeadY - s.headPivot.rotation.y) * lerpK;
          s.headPivot.rotation.z += (targetHeadZ - s.headPivot.rotation.z) * lerpK;

          // Animate floating cartoon '?' sprite above head
          if (showQuestion) {
            s.qPop = Math.min(1, s.qPop + dt * 5.2);
          } else {
            s.qPop = Math.max(0, s.qPop - dt * 6.5);
          }
          if (s.qPop > 0.01) {
            s.qSprite.visible = true;
            const bounce = s.qPop < 1 ? (1 + Math.sin(s.qPop * Math.PI) * 0.25) : 1;
            const sz = 0.82 * s.qPop * bounce;
            s.qSprite.scale.set(sz, sz, 1);
            s.qSprite.position.y = (s.isAlpaca ? 2.02 : 1.62) + Math.sin(t * 4.2) * 0.07 + (1 - s.qPop) * -0.18;
            s.qSprite.material.opacity = Math.min(1, s.qPop * 1.25);
            s.qSprite.material.rotation = Math.sin(t * 3.4) * 0.14;
          } else {
            s.qSprite.visible = false;
          }
          if (s.dropSquash > 0) {
            const sq = Math.sin(s.dropSquash * Math.PI) * 0.18;
            targetScaleY -= sq;
            targetScaleXZ += sq * 0.75;
            targetBodyY -= sq * 0.22;
          }

          s.bodyRig.position.x += (customBodyX - s.bodyRig.position.x) * Math.min(1, dt * 10);
          s.bodyRig.position.y += (targetBodyY - s.bodyRig.position.y) * Math.min(1, dt * 16);
          s.bodyRig.rotation.x += (targetBodyPitch - s.bodyRig.rotation.x) * Math.min(1, dt * 12);
          s.bodyRig.rotation.z += (targetBodyRoll - s.bodyRig.rotation.z) * Math.min(1, dt * 14);
          const baseS = s.isPenguin ? 0.84 : (s.isSquirrel ? 1.06 : 1.16);
          s.bodyRig.scale.y += (targetScaleY * baseS - s.bodyRig.scale.y) * Math.min(1, dt * 14);
          s.bodyRig.scale.x += (targetScaleXZ * baseS - s.bodyRig.scale.x) * Math.min(1, dt * 14);
          s.bodyRig.scale.z += (targetScaleXZ * baseS - s.bodyRig.scale.z) * Math.min(1, dt * 14);

          // Animate cute angry icon sprite above head
          if (showAngry) {
            s.angryPop = Math.min(1, s.angryPop + dt * 6.5);
          } else {
            s.angryPop = Math.max(0, s.angryPop - dt * 6.5);
          }
          if (s.angryPop > 0.01) {
            s.angrySprite.visible = true;
            const pulse = 1 + Math.sin(t * 14) * 0.11;
            const sz = 0.66 * s.angryPop * pulse;
            s.angrySprite.scale.set(sz, sz, 1);
            s.angrySprite.position.y = (s.isAlpaca ? 1.92 : 1.48) + Math.sin(t * 12) * 0.04;
            s.angrySprite.material.opacity = Math.min(1, s.angryPop * 1.25);
            s.angrySprite.material.rotation = Math.sin(t * 20) * 0.14;
          } else {
            s.angrySprite.visible = false;
          }

          // Animate cute awkward sweat-drop sprite ('💦')
          if (showSweat) {
            s.sweatPop = Math.min(1, s.sweatPop + dt * 6.0);
          } else {
            s.sweatPop = Math.max(0, s.sweatPop - dt * 6.5);
          }
          if (s.sweatPop > 0.01) {
            s.sweatSprite.visible = true;
            const sz = 0.72 * s.sweatPop * (1 + Math.sin(t * 8) * 0.06);
            s.sweatSprite.scale.set(sz, sz, 1);
            // Gentle nervous drip bobbing
            const drip = ((t * 1.4) % 1.0);
            s.sweatSprite.position.y = (s.isAlpaca ? 1.96 : 1.58) - drip * 0.14;
            s.sweatSprite.material.opacity = Math.min(1, s.sweatPop * (1.15 - drip * 0.25));
            s.sweatSprite.material.rotation = Math.sin(t * 16) * 0.08;
          } else {
            s.sweatSprite.visible = false;
          }

          // Animate cute clapping hands celebration sticker ('👏')
          if (showClap) {
            s.clapPop = Math.min(1, s.clapPop + dt * 5.8);
          } else {
            s.clapPop = Math.max(0, s.clapPop - dt * 6.5);
          }
          if (s.clapPop > 0.01) {
            s.clapSprite.visible = true;
            const clapPulse = 1 + Math.abs(Math.sin(t * 7.5)) * 0.14;
            const sz = 0.86 * s.clapPop * clapPulse;
            s.clapSprite.scale.set(sz, sz, 1);
            s.clapSprite.position.y = (s.isAlpaca ? 2.02 : 1.62) + Math.sin(t * 5.2) * 0.07;
            s.clapSprite.material.opacity = Math.min(1, s.clapPop * 1.25);
            s.clapSprite.material.rotation = Math.sin(t * 7.5) * 0.12;
          } else {
            s.clapSprite.visible = false;
          }

          // Animate cute crying sticker ('😭') when squirrel's basket is shaken empty
          if (showCry) {
            s.cryPop = Math.min(1, s.cryPop + dt * 6.0);
          } else {
            s.cryPop = Math.max(0, s.cryPop - dt * 6.5);
          }
          if (s.cryPop > 0.01) {
            s.crySprite.visible = true;
            const cryPulse = 1 + Math.sin(t * 10.0) * 0.08;
            const sz = 0.88 * s.cryPop * cryPulse;
            s.crySprite.scale.set(sz, sz, 1);
            s.crySprite.position.y = 1.48 + Math.sin(t * 6.0) * 0.06;
            s.crySprite.material.opacity = Math.min(1, s.cryPop * 1.25);
            s.crySprite.material.rotation = Math.sin(t * 9.0) * 0.10;
          } else {
            s.crySprite.visible = false;
          }

          // Animate squirrel/penguin squint eyes & mood stickers (❗/👀/💗/🥶/🎉)
          if (s.isSquirrel || s.isPenguin) {
            if (s.frenzyTimer > 0 && !showCry) {
              sqMoodTex = mindBlownMarkTex;
            }
            if (s.squirrelCheeks) {
              const ckK = Math.min(1, dt * 12);
              s.squirrelCheeks.forEach(ch => {
                ch.scale.x += (sqCheekScale - ch.scale.x) * ckK;
                ch.scale.y += (sqCheekScale * 0.88 - ch.scale.y) * ckK;
                ch.scale.z += (sqCheekScale * 0.96 - ch.scale.z) * ckK;
              });
            }
            if (s.sqOpenEyes && s.sqHappyLids) {
              s.sqOpenEyes.forEach(e => { e.visible = !sqSquint; });
              s.sqHappyLids.forEach(l => { l.visible = sqSquint; });
            }
            if (s.sqMoodSprite) {
              if (sqMoodTex) {
