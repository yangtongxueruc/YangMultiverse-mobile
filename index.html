                if (s.sqMoodSprite.material.map !== sqMoodTex) {
                  s.sqMoodSprite.material.map = sqMoodTex;
                  s.sqMoodSprite.material.needsUpdate = true;
                }
                s.sqMoodPop = Math.min(1, s.sqMoodPop + dt * 7.0);
              } else {
                s.sqMoodPop = Math.max(0, s.sqMoodPop - dt * 7.0);
              }
              if (s.sqMoodPop > 0.01) {
                s.sqMoodSprite.visible = true;
                const sz = 0.76 * s.sqMoodPop * (1 + Math.sin(t * 10.0) * 0.08);
                s.sqMoodSprite.scale.set(sz, sz, 1);
                s.sqMoodSprite.position.y = 1.48 + Math.sin(t * 6.0) * 0.05;
                s.sqMoodSprite.material.opacity = Math.min(1, s.sqMoodPop * 1.25);
                s.sqMoodSprite.material.rotation = Math.sin(t * 8.0) * 0.10;
              } else {
                s.sqMoodSprite.visible = false;
              }
            }
          }

          // Dynamic contact AO shadow shrinks & softens as sheep jumps or is lifted
          const airHeight = Math.max(0, (s.root.position.y - getGroundY(s.root.position.x, s.root.position.z)) + s.bodyRig.position.y);
          const aoFactor = Math.max(0.18, 1 - airHeight * 0.42);
          s.sheepAO.position.y = 0.015 - Math.max(0, s.root.position.y - getGroundY(s.root.position.x, s.root.position.z));
          s.sheepAO.scale.set((s.isPenguin ? 0.78 : 1.12) * aoFactor, (s.isPenguin ? 0.88 : 1.36) * aoFactor, 1);
          s.sheepAO.material.opacity = 0.68 * aoFactor;

          // Apply leg swing (independent frantic flailing when grabbed)
          const backVal = legSwingBack !== null ? legSwingBack : legSwing;
          const legRate = s.grabbed ? Math.min(1, dt * 24) : lerpK;
          const lxTargets = customLegX || [legSwing, -legSwing, -backVal, backVal];
          const lzTargets = customLegZ || [0, 0, 0, 0];
          for (let li = 0; li < 4; li++) {
            s.legs[li].rotation.x += (lxTargets[li] - s.legs[li].rotation.x) * legRate;
            s.legs[li].rotation.z += (lzTargets[li] - s.legs[li].rotation.z) * legRate;
          }
        }

        // Detect if a jumping/vaulting sheep steps on or lands onto another sheep
        for (let i = 0; i < sheepList.length; i++) {
          const jumper = sheepList[i];
          if (jumper.deleting || jumper.grabbed) continue;
          const airY = jumper.bodyRig.position.y;
          if (airY > 0.45) {
            jumper.wasAirborne = true;
          } else if (jumper.wasAirborne && airY < 0.32) {
            jumper.wasAirborne = false;
            for (let j = 0; j < sheepList.length; j++) {
              const victim = sheepList[j];
              if (victim === jumper || victim.deleting || victim.grabbed) continue;
              if (victim.steppedCooldown > 0 || victim.bodyRig.position.y > 0.35) continue;
              const d = Math.hypot(
                jumper.root.position.x - victim.root.position.x,
                jumper.root.position.z - victim.root.position.z
              );
              if (d < 1.15) {
                victim.dropSquash = 1.0;
                victim.angerTimer = 2.6;
                victim.angerLookTarget = jumper;
                victim.steppedCooldown = 2.2;
              }
            }
          }
        }

        resolveSheepCollisions(dt);
      }

      // ------------------------------------------------------------------
      // 8. 3D -> 2D Dynamic Bounding Box Projection & Floating Toolbar
      // ------------------------------------------------------------------
      const tempBox = new THREE.Box3();
      const tempCorners = Array.from({ length: 8 }, () => new THREE.Vector3());
      const tempCenter = new THREE.Vector3();

      function getScreenBounds(sheep) {
        sheep.root.updateMatrixWorld(true);
        // Compute tight world bounding box from visible meshes (excluding invisible hit proxy)
        tempBox.makeEmpty();
        sheep.bodyRig.traverse(obj => {
          if (obj.isMesh && obj !== sheep.hitMesh) {
            tempBox.expandByObject(obj);
          }
        });

        const min = tempBox.min;
        const max = tempBox.max;
        tempCorners[0].set(min.x, min.y, min.z);
        tempCorners[1].set(min.x, min.y, max.z);
        tempCorners[2].set(min.x, max.y, min.z);
        tempCorners[3].set(min.x, max.y, max.z);
        tempCorners[4].set(max.x, min.y, min.z);
        tempCorners[5].set(max.x, min.y, max.z);
        tempCorners[6].set(max.x, max.y, min.z);
        tempCorners[7].set(max.x, max.y, max.z);

        const w = stage.clientWidth;
        const h = stage.clientHeight;
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

        for (let i = 0; i < 8; i++) {
          tempCorners[i].project(camera);
          const sx = (tempCorners[i].x * 0.5 + 0.5) * w;
          const sy = (-tempCorners[i].y * 0.5 + 0.5) * h;
          if (sx < minX) minX = sx;
          if (sx > maxX) maxX = sx;
          if (sy < minY) minY = sy;
          if (sy > maxY) maxY = sy;
        }

        tempBox.getCenter(tempCenter);
        const dist = camera.position.distanceTo(tempCenter);

        // Live jump height expands displayed height dynamically just like the video
        const worldHeightBonus = Math.max(0, sheep.bodyRig.position.y) * 0.58;
        const displayW = sheep.dimScaleW + (sheep.state === 'Walk' ? 0.04 : 0);
        const displayH = sheep.dimScaleH + worldHeightBonus;

        const pad = 7;
        return {
          left: minX - pad,
          top: minY - pad,
          width: Math.max(24, maxX - minX + pad * 2),
          height: Math.max(24, maxY - minY + pad * 2),
          centerX: (minX + maxX) / 2,
          bottom: maxY + pad,
          dist: Math.round(dist / Math.max(0.5, camera.zoom)),
          displayW: displayW.toFixed(2),
          displayH: displayH.toFixed(2)
        };
      }

      // Add 5th & 6th state button slots inside toolbar (shown only when Golden Cat is selected)
      const firstDivider = toolbarEl.querySelector('.tb-divider');
      for (let k = 0; k < 2; k++) {
        const extraBtn = document.createElement('button');
        extraBtn.className = 'tb-btn';
        extraBtn.type = 'button';
        extraBtn.style.display = 'none';
        toolbarEl.insertBefore(extraBtn, firstDivider);
        stateButtons.push(extraBtn);
      }

      function syncToolbarActiveButton() {
        if (!selectedSheep) return;
        const isCat = Boolean(selectedSheep.isCat);
        const wr = getWorldRules();
        const cfg = isCat ? wr.guardian.states : wr.flock.states;
        stateButtons.forEach((btn, idx) => {
          if (idx < cfg.length) {
            btn.style.display = '';
            btn.dataset.state = cfg[idx].id;
            btn.textContent = cfg[idx].label;
            btn.classList.toggle('active', cfg[idx].id === selectedSheep.state);
          } else {
            btn.style.display = 'none';
          }
        });
        btnDuplicate.style.display = isCat ? 'none' : '';
        btnDelete.style.display = isCat ? 'none' : '';

        const speciesNameMap = {
          sheep: '小羊', alpaca: '羊驼', squirrel: '胖松鼠', penguin: '小企鹅',
          cat: '金渐层猫', fennec: '耳廓狐', red_panda: '小熊猫', polar_bear: '北极熊'
        };
        const spKey = isCat ? wr.guardian.species : wr.flock.species;
        const spName = speciesNameMap[spKey] || '动物';
        toolbarEl.setAttribute('aria-label', `${spName}操作`);
        btnRotate.title = `旋转${spName} 90°`;
        btnRotate.setAttribute('aria-label', `旋转${spName} 90°`);
        btnReset.title = `重置${spName}姿态`;
        btnReset.setAttribute('aria-label', `重置${spName}姿态`);
        btnDuplicate.title = `复制一只${spName}`;
        btnDuplicate.setAttribute('aria-label', `复制一只${spName}`);
        btnDelete.title = `移除这只${spName}`;
        btnDelete.setAttribute('aria-label', `移除这只${spName}`);
      }

      function updateSelectionUI() {
        // Hover outline (only when hovering an unselected sheep)
        if (hoveredSheep && hoveredSheep !== selectedSheep && !hoveredSheep.deleting) {
          const hb = getScreenBounds(hoveredSheep);
          hoverBoxEl.style.display = 'block';
          hoverBoxEl.style.left = hb.left + 'px';
          hoverBoxEl.style.top = hb.top + 'px';
          hoverBoxEl.style.width = hb.width + 'px';
          hoverBoxEl.style.height = hb.height + 'px';
        } else {
          hoverBoxEl.style.display = 'none';
        }

        if (!selectedSheep || selectedSheep.deleting || selectedSheep.grabbed) {
          selectionBoxEl.style.display = 'none';
          dimensionPillEl.style.display = 'none';
          toolbarEl.style.display = 'none';
          return;
        }

        const b = getScreenBounds(selectedSheep);
        selectionBoxEl.style.display = 'block';
        selectionBoxEl.style.left = b.left + 'px';
        selectionBoxEl.style.top = b.top + 'px';
        selectionBoxEl.style.width = b.width + 'px';
        selectionBoxEl.style.height = b.height + 'px';

        // Dimension & distance pill + toolbar positioning (mobile docks cleanly at bottom; desktop floats under selection)
        dimensionPillEl.style.display = 'block';
        dimensionPillEl.textContent = `${b.displayW} × ${b.displayH} m · ${b.dist} m away`;
        toolbarEl.style.display = 'flex';

        if (isMobileLayout()) {
          toolbarEl.classList.add('mobile-dock');
          const tbH = toolbarEl.offsetHeight || 96;
          dimensionPillEl.style.left = '50%';
          dimensionPillEl.style.top = Math.max(56, stage.clientHeight - tbH - 42) + 'px';
        } else {
          toolbarEl.classList.remove('mobile-dock');
          const pillLeft = Math.max(85, Math.min(stage.clientWidth - 85, b.centerX));
          const pillTop = Math.max(12, Math.min(stage.clientHeight - 76, b.bottom + 8));
          dimensionPillEl.style.left = pillLeft + 'px';
          dimensionPillEl.style.top = pillTop + 'px';

          const tbHalfW = Math.max(150, toolbarEl.offsetWidth / 2);
          const tbLeft = Math.max(tbHalfW + 10, Math.min(stage.clientWidth - tbHalfW - 10, b.centerX));
          const tbTop = Math.max(40, Math.min(stage.clientHeight - 46, pillTop + 28));
          toolbarEl.style.left = tbLeft + 'px';
          toolbarEl.style.top = tbTop + 'px';
        }
      }

      function pickRandomState(x, z) {
        const fRule = getWorldRules().flock;
        const pool = (fRule.avoidWaterForRest && typeof x === 'number' && isNearWaterOrBridge(x, z))
          ? fRule.spawnPool.filter(st => st !== 'Idle' && st !== 'DustBath')
          : fRule.spawnPool;
        return pool[(Math.random() * pool.length) | 0];
      }

      let autoDeselectTimer = null;
      function clearAutoDeselect() {
        if (autoDeselectTimer !== null) {
          clearTimeout(autoDeselectTimer);
          autoDeselectTimer = null;
        }
      }

      function selectSheep(sheep, autoDismissMs) {
        clearAutoDeselect();
        selectedSheep = sheep;
        if (sheep) {
          syncToolbarActiveButton();
          // Re-trigger subtle toolbar pop animation when switching targets
          toolbarEl.style.animation = 'none';
          void toolbarEl.offsetWidth;
          toolbarEl.style.animation = '';
          if (autoDismissMs && autoDismissMs > 0) {
            const targetSheep = sheep;
            autoDeselectTimer = setTimeout(() => {
              if (selectedSheep === targetSheep) {
                selectSheep(null);
              }
            }, autoDismissMs);
          }
        }
        updateSelectionUI();
      }

      // ------------------------------------------------------------------
      // 9. Raycasting, Circle-to-Spawn Drawing & Pointer Interactions
      // ------------------------------------------------------------------
      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
      const groundHit = new THREE.Vector3();
      let downPos = { x: 0, y: 0 };

      const drawState = {
        active: false,
        points: [],
        fadeTimer: null
      };

      const grabState = {
        candidate: null,
        active: false,
        originX: 0,
        originZ: 0,
        validDrop: true,
        blockedByPen: false,
        dropX: 0,
        dropZ: 0
      };

      function raycastGroundRaw(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        const hit = raycaster.ray.intersectPlane(groundPlane, groundHit);
        return hit ? hit.clone() : null;
      }

      const activeTouchPointers = new Map();
      const pinchState = { active: false, startDist: 0, startZoom: 1.0, lastMidX: 0, lastMidY: 0 };

      function pickSheepAt(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);

        const hitMeshes = sheepList.filter(s => !s.deleting).map(s => s.hitMesh);
        if (goldenCat) hitMeshes.push(goldenCat.hitMesh);
        const hits = raycaster.intersectObjects(hitMeshes, false);
        return hits.length > 0 ? hits[0].object.userData.sheep : null;
      }

      function pickSheep(clientX, clientY, isTouch) {
        const direct = pickSheepAt(clientX, clientY);
        if (direct || !isTouch) return direct;
        // Slightly wider touch hit forgiveness (14px cross) only for touch taps
        const offsets = [[0, -14], [0, 14], [-14, 0], [14, 0]];
        for (let i = 0; i < offsets.length; i++) {
          const hit = pickSheepAt(clientX + offsets[i][0], clientY + offsets[i][1]);
          if (hit) return hit;
        }
        return null;
      }

      function pickMeadowPoint(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        const hit = raycaster.ray.intersectPlane(groundPlane, groundHit);
        if (!hit) return null;
        const zMaxPick = isSouthOcean() ? (SLAB_D / 2 + ARCTIC_EXTRA_SOUTH - 0.85) : (SLAB_D / 2 - 0.85);
        if (hit.x >= TERRAIN_MIN_X + 0.85 && hit.x <= TERRAIN_MAX_X - 0.85 && hit.z >= -SLAB_D / 2 + 0.85 && hit.z <= zMaxPick) {
          return hit.clone();
        }
        return null;
      }

      function renderDrawStroke(points) {
        if (points.length < 2) {
          drawPathEl.setAttribute('d', '');
          return;
        }
        let dStr = `M ${points[0].x.toFixed(1)} ${points[0].y.toFixed(1)}`;
        for (let i = 1; i < points.length; i++) {
          dStr += ` L ${points[i].x.toFixed(1)} ${points[i].y.toFixed(1)}`;
        }
        drawPathEl.setAttribute('d', dStr);
      }

      function triggerSpawnRing(x, y, radius) {
        spawnRingEl.setAttribute('cx', x.toFixed(1));
        spawnRingEl.setAttribute('cy', y.toFixed(1));
        spawnRingEl.setAttribute('r', Math.max(14, Math.min(34, radius)).toFixed(1));
        spawnRingEl.classList.remove('pop');
        void spawnRingEl.offsetWidth;
        spawnRingEl.classList.add('pop');
      }

      function trySpawnFromCircle(points) {
        if (points.length < 8) return false;
        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        let pathLen = 0;
        let sumX = 0, sumY = 0;
        for (let i = 0; i < points.length; i++) {
          const p = points[i];
          if (p.x < minX) minX = p.x;
          if (p.x > maxX) maxX = p.x;
          if (p.y < minY) minY = p.y;
          if (p.y > maxY) maxY = p.y;
          sumX += p.x;
          sumY += p.y;
          if (i > 0) {
            pathLen += Math.hypot(p.x - points[i - 1].x, p.y - points[i - 1].y);
          }
        }
        const bw = maxX - minX;
        const bh = maxY - minY;
        const diag = Math.hypot(bw, bh);
        if (pathLen < 45 || bw < 14 || bh < 14) return false;

        const cx = sumX / points.length;
        const cy = sumY / points.length;
        const endGap = Math.hypot(
          points[points.length - 1].x - points[0].x,
          points[points.length - 1].y - points[0].y
        );

        // Compute total swept angle around centroid so quick hand-drawn circles reliably trigger
        let totalSweep = 0;
        for (let i = 1; i < points.length; i++) {
          const a1 = Math.atan2(points[i - 1].y - cy, points[i - 1].x - cx);
          const a2 = Math.atan2(points[i].y - cy, points[i].x - cx);
          totalSweep += shortestAngleDiff(a1, a2);
        }

        const isCircleLike = Math.abs(totalSweep) >= Math.PI * 1.15 || endGap <= diag * 0.65;
        if (!isCircleLike) return false;

        const rect = canvas.getBoundingClientRect();
        const worldPt = pickMeadowPoint(rect.left + cx, rect.top + cy);
        const wCfg = getWorldConfig();
        if (!worldPt) {
          showToast(wCfg.circleOutsideToast);
          return true;
        }
        if (isInsidePen(worldPt.x, worldPt.z, 0.25)) {
          showToast(wCfg.circlePenToast);
          return true;
        }
        const inArcticSeaSpawn = isSouthOcean() && isInRiver(worldPt.x, worldPt.z, 0) && !getIceFloeAt(worldPt.x, worldPt.z, -0.15);
        if (!inArcticSeaSpawn && isInRiver(worldPt.x, worldPt.z, RIVER_MARGIN) && !isOnBridge(worldPt.x, worldPt.z, 0) && !getIceFloeAt(worldPt.x, worldPt.z, -0.15)) {
          showToast(wCfg.circleWaterToast);
          return true;
        }
        if (sheepList.length >= 24) {
          showToast(getWorldConfig().maxFlockToast);
          return true;
        }

        const clampedX = Math.max(SLAB_MIN_X, Math.min(SLAB_MAX_X, worldPt.x));
        const maxZClamp = isSouthOcean() ? (SLAB_MARGIN_Z + ARCTIC_EXTRA_SOUTH) : SLAB_MARGIN_Z;
        const clampedZ = Math.max(-SLAB_MARGIN_Z, Math.min(maxZClamp, worldPt.z));
        const newSheep = createSheep(clampedX, clampedZ, Math.random() * Math.PI * 2, inArcticSeaSpawn ? 'Walk' : pickRandomState(clampedX, clampedZ));
        if (inArcticSeaSpawn && newSheep.isPenguin) {
          spawnWaterSplash(clampedX, 0.06, clampedZ, 7);
          spawnWaterRipple(clampedX, clampedZ, 2.0);
          newSheep.swimAction = {
            phase: 'free_swim', floe: null,
            swimTimer: 7.5 + Math.random() * 4.5,
            heading: Math.random() * Math.PI * 2,
            turnTimer: 1.5,
            shoreX: clampedX, shoreZ: getArcticCoastZ(clampedX) - 0.95,
            rippleT: 0.2, enteredWater: true
          };
        }
        triggerSpawnRing(cx, cy, (bw + bh) * 0.25);
        selectSheep(newSheep, 5000);
        return true;
      }

      canvas.addEventListener('pointermove', (e) => {
        if (e.pointerType === 'touch') {
          if (activeTouchPointers.has(e.pointerId)) {
            activeTouchPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
          }
          if (pinchState.active && activeTouchPointers.size >= 2) {
            const pts = Array.from(activeTouchPointers.values());
            const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
            const midX = (pts[0].x + pts[1].x) * 0.5;
            const midY = (pts[0].y + pts[1].y) * 0.5;
            if (pinchState.startDist > 10) {
              syncZoomUI(pinchState.startZoom * (dist / pinchState.startDist));
            }
            const mdx = midX - pinchState.lastMidX;
            const mdy = midY - pinchState.lastMidY;
            pinchState.lastMidX = midX;
            pinchState.lastMidY = midY;
            camState.azimuth -= mdx * 0.0045;
            camState.elevation = Math.max(0.38, Math.min(1.30, camState.elevation + mdy * 0.004));
            updateCameraTransform();
            return;
          }
        }
        if (grabState.candidate) {
          const moved = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
          if (!grabState.active && moved >= 7) {
            grabState.active = true;
            grabState.candidate.grabbed = true;
            grabState.candidate.angerTimer = 0;
            grabState.candidate.scaredTimer = 0;
            grabState.candidate.fleePenTimer = 0;
            grabState.candidate.celebrateTimer = 0;
            grabState.candidate.wadeAction = null;
            if (grabState.candidate.swimAction) { releaseFloeOccupancy(grabState.candidate); grabState.candidate.swimAction = null; }
            if (grabState.candidate.diveAction) { grabState.candidate.diveAction = null; }
            if (grabState.candidate.isCat) {
              grabState.candidate.boltingTimer = 0;
              grabState.candidate.wakeStretchTimer = 0;
              grabState.candidate.watchFish = null;
              grabState.candidate.reefAction = null;
              grabState.candidate.onRoofTimer = 0;
              grabState.candidate.butterflyHunt = null;
              grabState.candidate.purrTimer = 0;
              grabState.candidate.petEnergy = 0;
              grabState.candidate.startleTimer = 0;
            }
            if (grabState.candidate.pairInteraction) {
              clearPairInteraction(grabState.candidate.pairInteraction);
            }
            hoveredSheep = null;
            updateSelectionUI();
          }
          if (grabState.active) {
            // On touchscreens, offset ground target slightly upward so fingertip doesn't obscure drop ring
            const dragY = e.pointerType === 'touch' ? (e.clientY - 34) : e.clientY;
            const pt = raycastGroundRaw(e.clientX, dragY);
            if (pt) {
              const maxZDrop = isSouthOcean() ? (SLAB_MARGIN_Z + ARCTIC_EXTRA_SOUTH) : SLAB_MARGIN_Z;
              const inSlab = pt.x >= SLAB_MIN_X && pt.x <= SLAB_MAX_X && pt.z >= -SLAB_MARGIN_Z && pt.z <= maxZDrop;
              const gRuleDrag = getWorldRules().guardian;
              const onReefForCat = grabState.candidate.isCat && gRuleDrag.canReefFish && isOnReef(pt.x, pt.z, 0.28);
              const onArcticFloe = isSouthOcean() && Boolean(getIceFloeAt(pt.x, pt.z, 0.05));
              const canSwimInArcticOcean = isSouthOcean() && (grabState.candidate.isPenguin || grabState.candidate.isPolarBear);
              const blockedRiver = isInRiver(pt.x, pt.z, RIVER_MARGIN) && !isOnBridge(pt.x, pt.z, 0) && !onReefForCat && !onArcticFloe && !canSwimInArcticOcean;
              const onRoofForCat = grabState.candidate.isCat && gRuleDrag.canClimbRoof && isInsideHouseFootprint(pt.x, pt.z, 0.15);
              const blockedHouse = isInsideHouseFootprint(pt.x, pt.z, 0.25) && !onRoofForCat;
              const blockedPen = !grabState.candidate.isCat && isInsidePen(pt.x, pt.z, 0.22);
              grabState.blockedByPen = blockedPen;
              grabState.validDrop = inSlab && !blockedRiver && !blockedHouse && !blockedPen;
              grabState.dropX = pt.x;
              grabState.dropZ = pt.z;

              // Follow pointer smoothly while clamped to visible area
              const followX = Math.max(TERRAIN_MIN_X - 2.0, Math.min(TERRAIN_MAX_X + 2.0, pt.x));
              const followMaxZ = isSouthOcean() ? (SLAB_D * 0.65 + ARCTIC_EXTRA_SOUTH) : (SLAB_D * 0.65);
              const followZ = Math.max(-SLAB_D * 0.65, Math.min(followMaxZ, pt.z));
              grabState.candidate.root.position.x = followX;
              grabState.candidate.root.position.z = followZ;

              dropRingMesh.visible = true;
              dropRingMesh.position.set(followX, getGroundY(followX, followZ) + 0.04, followZ);
              dropRingMat.color.setHex(grabState.validDrop ? 0x2563eb : 0xef4444);
            }
            setCanvasCursor('grabbing');
            return;
          }
        }

        if (camState.orbitEnabled && camState.dragging) {
          const dx = e.clientX - camState.lastX;
          const dy = e.clientY - camState.lastY;
          camState.lastX = e.clientX;
          camState.lastY = e.clientY;
          camState.azimuth -= dx * 0.006;
          camState.elevation = Math.max(0.32, Math.min(1.32, camState.elevation + dy * 0.005));
          updateCameraTransform();
          setCanvasCursor('grabbing');
          return;
        }

        if (drawState.active) {
          const rect = canvas.getBoundingClientRect();
          const lx = e.clientX - rect.left;
          const ly = e.clientY - rect.top;
          const last = drawState.points[drawState.points.length - 1];
          if (!last || Math.hypot(lx - last.x, ly - last.y) >= 3) {
            drawState.points.push({ x: lx, y: ly });
            renderDrawStroke(drawState.points);
          }
          setCanvasCursor('crosshair');
          return;
        }

        const hit = pickSheep(e.clientX, e.clientY, e.pointerType === 'touch');
        hoveredSheep = e.pointerType === 'touch' ? null : hit;
        // Rub cursor gently over Guardian on land (without dragging) to pet it & make it purr!
        const hitInArcticSea = hit && hit.isPolarBear && isSouthOcean() && (Boolean(hit.swimAction) || hit.root.position.z > getArcticCoastZ(hit.root.position.x) - 0.1);
        if (hit && hit.isCat && !hit.grabbed && !herdingEvent && !hitInArcticSea && hit.angerTimer <= 0 && hit.boltingTimer <= 0) {
          hit.petEnergy = Math.min(2.4, hit.petEnergy + 0.085);
          if (hit.petEnergy >= 0.65) {
            hit.purrTimer = 2.6;
          }
        }
        if (hit) {
          setCanvasCursor('pointer');
        } else {
          setCanvasCursor(camState.orbitEnabled ? 'grab' : 'default');
        }
      });

      canvas.addEventListener('pointerdown', (e) => {
        if (e.button !== 0 && e.pointerType === 'mouse') return;
        if (isMobileLayout() && demoControlsEl && demoControlsEl.classList.contains('mobile-open')) {
          demoControlsEl.classList.remove('mobile-open');
          if (btnMobileMenu) {
            btnMobileMenu.classList.remove('open');
            btnMobileMenu.setAttribute('aria-expanded', 'false');
          }
        }
        if (e.pointerType === 'touch') {
          activeTouchPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
          if (activeTouchPointers.size >= 2) {
            // Cancel single-finger draw/grab and start smooth two-finger pinch-zoom & orbit
            if (grabState.candidate) {
              if (grabState.active) {
                grabState.candidate.grabbed = false;
                grabState.candidate.root.position.x = grabState.originX;
                grabState.candidate.root.position.z = grabState.originZ;
              }
              grabState.candidate = null;
              grabState.active = false;
              dropRingMesh.visible = false;
            }
            if (drawState.active) {
              drawState.active = false;
              drawState.points = [];
              drawPathEl.classList.remove('drawing');
              drawPathEl.setAttribute('d', '');
            }
            const pts = Array.from(activeTouchPointers.values());
            pinchState.active = true;
            pinchState.startDist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
            pinchState.startZoom = camState.targetZoom;
            pinchState.lastMidX = (pts[0].x + pts[1].x) * 0.5;
            pinchState.lastMidY = (pts[0].y + pts[1].y) * 0.5;
            return;
          }
        }
        downPos = { x: e.clientX, y: e.clientY };
        const hitSheep = pickSheep(e.clientX, e.clientY, e.pointerType === 'touch');
        if (hitSheep) {
          grabState.candidate = hitSheep;
          grabState.active = false;
          grabState.originX = hitSheep.root.position.x;
          grabState.originZ = hitSheep.root.position.z;
          grabState.dropX = hitSheep.root.position.x;
          grabState.dropZ = hitSheep.root.position.z;
          grabState.validDrop = true;
          return;
        }

        if (camState.orbitEnabled) {
          camState.dragging = true;
          camState.lastX = e.clientX;
          camState.lastY = e.clientY;
          setCanvasCursor('grabbing');
        } else if (pickMeadowPoint(e.clientX, e.clientY)) {
          clearTimeout(drawState.fadeTimer);
          const rect = canvas.getBoundingClientRect();
          drawState.active = true;
          drawState.points = [{ x: e.clientX - rect.left, y: e.clientY - rect.top }];
          drawPathEl.classList.add('drawing');
          drawPathEl.setAttribute('d', '');
        }
      });

      function cleanupTouchPointer(e) {
        if (e.pointerType === 'touch') {
          activeTouchPointers.delete(e.pointerId);
          hoveredSheep = null;
          if (activeTouchPointers.size < 2 && pinchState.active) {
            pinchState.active = false;
            return true;
          }
        }
        return false;
      }
      window.addEventListener('pointercancel', cleanupTouchPointer);

      window.addEventListener('pointerup', (e) => {
        if (cleanupTouchPointer(e)) return;
        if (grabState.candidate) {
          const sheep = grabState.candidate;
          const wasGrabbed = grabState.active;
          grabState.candidate = null;
          grabState.active = false;
          dropRingMesh.visible = false;

          if (wasGrabbed) {
            sheep.grabbed = false;
            if (grabState.validDrop) {
              sheep.root.position.x = grabState.dropX;
              sheep.root.position.z = grabState.dropZ;
            } else {
              sheep.root.position.x = grabState.originX;
              sheep.root.position.z = grabState.originZ;
              showToast(grabState.blockedByPen ? getWorldConfig().circlePenToast : getWorldConfig().invalidDropToast);
            }
            sheep.dropSquash = 1.0;

            // Special handling when dropping the Golden Shaded cat
            if (sheep.isCat) {
              if (grabState.validDrop) {
                if (getWorldRules().guardian.canClimbRoof && isInsideHouseFootprint(sheep.root.position.x, sheep.root.position.z, 0.25)) {
                  sheep.angerTimer = 0;
                  sheep.boltingTimer = 0;
                  sheep.reefAction = null;
                  sheep.root.position.set(HOUSE_X, getTerrainHeight(HOUSE_X, HOUSE_Z) + 2.18, HOUSE_Z + 0.15);
                  sheep.onRoofTimer = 14.0;
                  setCanvasCursor('default');
                  selectSheep(null);
                  return;
                }

                const droppedFloeCat = isSouthOcean() ? getIceFloeAt(sheep.root.position.x, sheep.root.position.z, 0.25) : null;
                if (sheep.isPolarBear && droppedFloeCat) {
                  sheep.purrTimer = 0; sheep.petEnergy = 0; sheep.angerTimer = 0; sheep.boltingTimer = 0; sheep.wakeStretchTimer = 0; sheep.startleTimer = 0;
                  sheep.state = 'Sleep';
                  claimFloe(droppedFloeCat, sheep);
                  triggerFloeBounce(droppedFloeCat, -2.0);
                  spawnWaterRipple(droppedFloeCat.x, droppedFloeCat.z, 3.2);
                  sheep.root.position.set(droppedFloeCat.x, getFloeSurfaceY(droppedFloeCat), droppedFloeCat.z);
                  sheep.swimAction = {
                    phase: 'lounge', floe: droppedFloeCat, loungeTimer: 10.0,
                    shoreX: droppedFloeCat.x, shoreZ: getArcticCoastZ(droppedFloeCat.x) - 0.95,
                    rippleT: 0.2, enteredWater: true
                  };
                  setCanvasCursor('default');
                  selectSheep(null);
                  return;
                }
                if (sheep.isPolarBear && isSouthOcean() && sheep.root.position.z > getArcticCoastZ(sheep.root.position.x) - 0.1) {
                  sheep.purrTimer = 0; sheep.petEnergy = 0; sheep.angerTimer = 0; sheep.boltingTimer = 0; sheep.wakeStretchTimer = 0; sheep.startleTimer = 0;
                  sheep.state = 'Walk';
                  spawnWaterSplash(sheep.root.position.x, 0.06, sheep.root.position.z, 10);
                  spawnWaterRipple(sheep.root.position.x, sheep.root.position.z, 2.8);
                  sheep.swimAction = {
                    phase: 'free_swim', floe: null,
                    swimTimer: 8.5 + Math.random() * 4.5,
                    heading: Math.random() * Math.PI * 2,
                    turnTimer: 1.8,
                    shoreX: Math.max(SLAB_MIN_X + 1.0, Math.min(SLAB_MAX_X - 1.0, sheep.root.position.x)),
                    shoreZ: getArcticCoastZ(sheep.root.position.x) - 1.05,
                    rippleT: 0.2, enteredWater: true
                  };
                  setCanvasCursor('default');
                  selectSheep(null);
                  return;
                }
                if (getWorldRules().guardian.canReefFish && isOnReef(sheep.root.position.x, sheep.root.position.z, 0.45)) {
                  sheep.angerTimer = 0;
                  sheep.angerTarget = null;
                  sheep.boltingTimer = 0;
                  sheep.root.position.set(REEF_X, REEF_TOP_Y, REEF_Z);
                  const bankSide = Math.random() < 0.5 ? 1 : -1;
                  sheep.reefAction = {
                    mode: 'sit',
                    phase: 'perched',
                    t: 0,
                    duration: 0.62,
                    startX: REEF_X, startY: REEF_TOP_Y, startZ: REEF_Z,
                    endX: REEF_X, endY: REEF_TOP_Y, endZ: REEF_Z,
                    targetBankSide: bankSide,
                    perchTimer: 6.5 + Math.random() * 3.0
                  };
                  if (fishList.length < MAX_RIVER_FISH && !fishList.some(f => Math.abs(f.z - REEF_Z) < 4.0)) {
                    const sp = spawnRiverFish(false);
                    sp.z = REEF_Z - sp.dir * 2.0;
                    sp.depth = 0.9;
                    sp.targetDepth = 1.0;
                  }
                  setCanvasCursor('default');
                  selectSheep(null);
                  return;
                }

                let nearestSh = null;
                let nearestD = 1.65;
                for (let j = 0; j < sheepList.length; j++) {
                  const sh = sheepList[j];
                  if (sh.deleting || sh.grabbed) continue;
                  const d = Math.hypot(
                    sh.root.position.x - sheep.root.position.x,
                    sh.root.position.z - sheep.root.position.z
                  );
                  if (d < nearestD) {
                    nearestD = d;
                    nearestSh = sh;
                  }
                }
                if (nearestSh) {
                  const herdProb = nearestSh.isSquirrel ? 0.85 : 0.45;
                  if (!herdingEvent && Math.random() < herdProb && startHerdingEvent(nearestSh)) {
                    setCanvasCursor('default');
                    selectSheep(null);
                    return;
                  }
                  // Dropped on a sheep -> instantly catapult-leap & bolt away across the grass!
                  nearestSh.dropSquash = 0.9;
                  const ex = sheep.root.position.x - nearestSh.root.position.x;
                  const ez = sheep.root.position.z - nearestSh.root.position.z;
                  let escapeAng = Math.hypot(ex, ez) > 0.05
                    ? Math.atan2(ex, ez)
                    : Math.random() * Math.PI * 2;
                  if (isPositionBlocked(
                    sheep.root.position.x + Math.sin(escapeAng) * 2.2,
                    sheep.root.position.z + Math.cos(escapeAng) * 2.2,
                    0.1
                  )) {
                    escapeAng = computeSafeEscapeAngle(sheep.root.position.x, sheep.root.position.z, escapeAng);
                  }
                  sheep.root.rotation.y = escapeAng;
                  sheep.targetRotY = escapeAng;
                  sheep.boltingTimer = 1.65;
                  sheep.boltElapsed = 0;
                  sheep.avoidCooldown = 0;
                } else {
                  if (getWorldRules().guardian.canReefFish && isOnReef(sheep.root.position.x, sheep.root.position.z, 0.35)) {
                    sheep.root.position.set(REEF_X, REEF_TOP_Y, REEF_Z);
                    const bankSide = Math.random() < 0.5 ? 1 : -1;
                    sheep.reefAction = {
                      mode: 'sit',
                      phase: 'perched',
                      t: 0,
                      duration: 0.62,
                      startX: REEF_X, startY: REEF_TOP_Y, startZ: REEF_Z,
                      endX: REEF_X, endY: REEF_TOP_Y, endZ: REEF_Z,
                      targetBankSide: bankSide,
                      perchTimer: 6.5 + Math.random() * 3.0
                    };
                    if (fishList.length < MAX_RIVER_FISH && !fishList.some(f => Math.abs(f.z - REEF_Z) < 4.0)) {
                      const sp = spawnRiverFish(false);
                      sp.z = REEF_Z - sp.dir * 2.0;
                      sp.depth = 0.9;
                      sp.targetDepth = 1.0;
                    }
                  } else {
                    const distReef = Math.hypot(sheep.root.position.x - REEF_X, sheep.root.position.z - REEF_Z);
                    if (distReef < 3.4) {
                      sheep.reefCooldown = 0;
                      sheep.state = 'Walk';
                    }
                  }
                  if (sheep.isRedPanda) {
                    // Huff indignantly into a quick reflexive Threaten stance right after being put down!
                    sheep.state = 'Threaten';
                    sheep.threatenCycle = 0;
                    sheep.stateTimer = 3.8;
                    if (selectedSheep === sheep) syncToolbarActiveButton();
                  }
                  // Dropped near the riverbank: immediately allow fish-watching & ensure a fish is swimming nearby
                  const riverDist = Math.abs(sheep.root.position.x - getRiverCenterX(sheep.root.position.z)) - getRiverHalfWidth(sheep.root.position.z);
                  if (getWorldRules().guardian.canReefFish && riverDist < 2.8 && !sheep.reefAction) {
                    sheep.watchCooldown = 0;
                    const hasNearFish = fishList.some(f => Math.abs(f.z - sheep.root.position.z) < 4.5);
                    if (!hasNearFish && fishList.length < MAX_RIVER_FISH) {
                      const spawned = spawnRiverFish(false);
                      spawned.z = Math.max(-SLAB_D / 2 + 1.5, Math.min(SLAB_D / 2 - 1.5, sheep.root.position.z - spawned.dir * 1.6));
                      spawned.depth = 0.85;
                      spawned.targetDepth = 1.0;
                    }
                  }
                }
              }
              setCanvasCursor('default');
              selectSheep(null);
              return;
            }

            const droppedFloePeng = (grabState.validDrop && sheep.isPenguin) ? getIceFloeAt(sheep.root.position.x, sheep.root.position.z, 0.25) : null;
            if (droppedFloePeng) {
              const claimed = claimFloe(droppedFloePeng, sheep);
              if (claimed) {
                const slot = pickPenguinFloeSlot(droppedFloePeng);
                triggerFloeBounce(droppedFloePeng, -1.2);
                spawnWaterRipple(droppedFloePeng.x, droppedFloePeng.z, 2.4);
                sheep.root.position.set(droppedFloePeng.x + slot.offX, getFloeSurfaceY(droppedFloePeng), droppedFloePeng.z + slot.offZ);
                sheep.swimAction = {
                  phase: 'lounge', floe: droppedFloePeng, slotSign: slot.slotSign, offX: slot.offX, offZ: slot.offZ, loungeTimer: 9.0,
                  shoreX: droppedFloePeng.x, shoreZ: getArcticCoastZ(droppedFloePeng.x) - 0.95,
                  rippleT: 0.2, enteredWater: true
                };
              } else {
                const edge = getFloeEdgePoint(droppedFloePeng, sheep.root.position.x, sheep.root.position.z, 0.48);
                sheep.root.position.set(edge.x, getTerrainHeight(edge.x, edge.z), edge.z);
                spawnWaterSplash(edge.x, 0.06, edge.z, 7);
                spawnWaterRipple(edge.x, edge.z, 2.0);
                sheep.swimAction = {
                  phase: 'free_swim', floe: null,
                  swimTimer: 7.5 + Math.random() * 4.0,
                  heading: Math.random() * Math.PI * 2,
                  turnTimer: 1.5,
                  shoreX: Math.max(SLAB_MIN_X + 0.9, Math.min(SLAB_MAX_X - 0.9, edge.x)),
                  shoreZ: getArcticCoastZ(edge.x) - 0.95,
                  rippleT: 0.2, enteredWater: true
                };
              }
              setCanvasCursor('default');
              selectSheep(null);
              return;
            }
            if (grabState.validDrop && sheep.isPenguin && isSouthOcean() && sheep.root.position.z > getArcticCoastZ(sheep.root.position.x) - 0.1) {
              spawnWaterSplash(sheep.root.position.x, 0.06, sheep.root.position.z, 8);
              spawnWaterRipple(sheep.root.position.x, sheep.root.position.z, 2.2);
              sheep.swimAction = {
                phase: 'free_swim', floe: null,
                swimTimer: 8.0 + Math.random() * 4.5,
                heading: Math.random() * Math.PI * 2,
                turnTimer: 1.5,
                shoreX: Math.max(SLAB_MIN_X + 0.9, Math.min(SLAB_MAX_X - 0.9, sheep.root.position.x)),
                shoreZ: getArcticCoastZ(sheep.root.position.x) - 0.95,
                rippleT: 0.2, enteredWater: true
              };
              setCanvasCursor('default');
              selectSheep(null);
              return;
            }

            // Check if dropped on or right next to the Golden Shaded cat -> ALWAYS triggers cat angry (💢) & sheep scared/embarrassed (💦)!
            if (grabState.validDrop && goldenCat) {
              const cdx = sheep.root.position.x - goldenCat.root.position.x;
              const cdz = sheep.root.position.z - goldenCat.root.position.z;
              const cdist = Math.hypot(cdx, cdz);
              if (cdist < 1.95) {
                const herdProb = sheep.isSquirrel ? 0.85 : 0.45;
                if (!herdingEvent && Math.random() < herdProb && startHerdingEvent(sheep)) {
                  setCanvasCursor('default');
                  selectSheep(null);
                  return;
                }
                // Nudge sheep cleanly to the edge of the cat so they never clip
                const nx = cdist > 0.01 ? cdx / cdist : 1;
                const nz = cdist > 0.01 ? cdz / cdist : 0;
                const safeDist = getEntityRadius(goldenCat) + getEntityRadius(sheep) + 0.14;
                const safeX = goldenCat.root.position.x + nx * safeDist;
                const safeZ = goldenCat.root.position.z + nz * safeDist;
                if (!isPositionBlocked(safeX, safeZ, 0)) {
                  sheep.root.position.x = safeX;
                  sheep.root.position.z = safeZ;
                }
                goldenCat.angerTimer = 3.4;
                goldenCat.angerTarget = sheep;
                goldenCat.wakeStretchTimer = 0;
                goldenCat.disturbCooldown = 6.0;

                sheep.angerTimer = 0;
                sheep.vaultTime = 0;
                sheep.scaredTimer = 3.4;
                sheep.scaredTarget = goldenCat;

                setCanvasCursor('default');
                selectSheep(null);
                return;
              }
            }

            // If a grabbed sheep is dropped right beside the sheep pen -> immediately spooked & bolts away!
            if (grabState.validDrop && isInsidePen(sheep.root.position.x, sheep.root.position.z, 2.25)) {
              const awayX = sheep.root.position.x - PEN_X;
              const awayZ = sheep.root.position.z - PEN_Z;
              let runAng = Math.atan2(awayX - 0.6, awayZ + 0.9);
              if (isPositionBlocked(sheep.root.position.x + Math.sin(runAng) * 1.6, sheep.root.position.z + Math.cos(runAng) * 1.6, 0.05)) {
                runAng = computeSafeEscapeAngle(sheep.root.position.x, sheep.root.position.z, runAng);
              }
              sheep.root.rotation.y = runAng;
              sheep.targetRotY = runAng;
              sheep.angerTimer = 0;
              sheep.scaredTimer = 0;
              sheep.vaultTime = 0;
              sheep.fleePenTimer = 2.1;
              sheep.fleePenCooldown = 4.5;
              setCanvasCursor('default');
              selectSheep(null);
              return;
            }

            // Check if dropped right next to another sheep
            let nearestNeighbor = null;
            let nearestDist = 1.95;
            if (grabState.validDrop) {
              for (let j = 0; j < sheepList.length; j++) {
                const other = sheepList[j];
                if (other === sheep || other.deleting || other.grabbed || other.pairInteraction) continue;
                const d = Math.hypot(
                  other.root.position.x - sheep.root.position.x,
                  other.root.position.z - sheep.root.position.z
                );
                if (d < nearestDist) {
                  nearestDist = d;
                  nearestNeighbor = other;
                }
              }
            }

            if (nearestNeighbor) {
              const roll = Math.random();
              if (roll < 0.34) {
                // Scenario 1: Sweet head nuzzling + floating heart for 5s
                startPairInteraction(sheep, nearestNeighbor, 'love');
              } else if (roll < 0.68) {
                // Scenario 2: Fierce headbutt fight + swirling dust cloud for 5s
                startPairInteraction(sheep, nearestNeighbor, 'fight');
              } else {
                // Scenario 3: Angry glare reaction (neighbor gets squished & mad if dropped very close!)
                sheep.angerTimer = 3.2;
                sheep.angerLookTarget = null;
                sheep.targetRotY = Math.atan2(
                  camera.position.x - sheep.root.position.x,
                  camera.position.z - sheep.root.position.z
                );
                if (nearestDist < 1.35) {
                  nearestNeighbor.dropSquash = 1.0;
                  nearestNeighbor.angerTimer = 2.8;
                  nearestNeighbor.angerLookTarget = sheep;
                }
              }
            } else {
              sheep.angerTimer = 3.2;
              sheep.angerLookTarget = null;
              sheep.targetRotY = Math.atan2(
                camera.position.x - sheep.root.position.x,
                camera.position.z - sheep.root.position.z
              );
            }

            setCanvasCursor('default');
            selectSheep(null);
            return;
          }
        }

        if (camState.dragging) {
          camState.dragging = false;
          setCanvasCursor(camState.orbitEnabled ? 'grab' : 'default');
        }

        const moved = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);

        if (drawState.active) {
          drawState.active = false;
          drawPathEl.classList.remove('drawing');
          const pts = drawState.points.slice();
          drawState.points = [];
          drawState.fadeTimer = setTimeout(() => drawPathEl.setAttribute('d', ''), 260);
          setCanvasCursor('default');

          if (moved >= 10) {
            trySpawnFromCircle(pts);
            return;
          }
        }

        if (e.target !== canvas) return;
        if (moved < (e.pointerType === 'touch' ? 14 : 8)) {
          const hit = pickSheep(e.clientX, e.clientY, e.pointerType === 'touch');
          if (hit) {
            selectSheep(hit);
            return;
          }
          // Check click on Arctic Ice Crystals -> luminous pulse, icy sparkles & aurora boost!
          if (arcticCrystalHitMeshes.length > 0) {
            const rect = canvas.getBoundingClientRect();
            pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);
            const cHits = raycaster.intersectObjects(arcticCrystalHitMeshes, false);
            if (cHits.length > 0) {
              const cr = cHits[0].object.userData.iceCrystal;
              if (cr) {
                const nowMs = performance.now();
                cr.pulse = 1.0;
                cr.litUntil = nowMs + 10000;
                spawnCrystalSparkles(cr.x, cr.baseY, cr.z);
                const litCount = arcticCrystalMats.filter(item => item.litUntil > nowMs).length;
                if (litCount >= arcticCrystalMats.length && arcticCrystalMats.length >= 4) {
                  triggerAuroraGrandFinale();
                } else if (weatherMode === 'aurora') {
                  auroraBoostTimer = 3.6;
                  showToast(`冰晶共鸣 (${litCount}/4)，夜空极光跟着亮了起来！✨`);
                } else {
                  showToast(`点亮了极地冰晶 (${litCount}/4) ✨`);
                }
              }
              selectSheep(null);
              return;
            }
          }
          // Check click on Arctic Floating Ice Floes -> buoyancy bounce & icy splash!
          if (arcticFloeHitMeshes.length > 0) {
            const rect = canvas.getBoundingClientRect();
            pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);
            const fHits = raycaster.intersectObjects(arcticFloeHitMeshes, false);
            if (fHits.length > 0) {
              const fl = fHits[0].object.userData.iceFloe;
              if (fl) {
                triggerFloeBounce(fl, -1.65);
                spawnWaterRipple(fl.x, fl.z, 2.9);
                spawnWaterSplash(fl.x, 0.08, fl.z, 6);
                fl.occupants.forEach(occ => { if (occ) occ.dropSquash = 0.65; });
              }
              selectSheep(null);
              return;
            }
          }
          // Check click on Arctic Hot Spring -> joyful burst of warm steam!
          if (onsenHitMesh) {
            const rect = canvas.getBoundingClientRect();
            pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);
            if (raycaster.intersectObject(onsenHitMesh, false).length > 0) {
              onsenSteamBoost = 3.2;
              spawnWaterRipple(PEN_X - 1.15, PEN_Z + 0.35, 1.8);
              showToast('温泉热气咕嘟咕嘟冒出来啦 ♨️');
              selectSheep(null);
              return;
            }
          }
          // Check click on Forest nut crate -> nut fountain frenzy!
          if (forestCrateHitMesh) {
            const rect = canvas.getBoundingClientRect();
            pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);
            if (raycaster.intersectObject(forestCrateHitMesh, false).length > 0) {
              triggerCrateFountain();
              selectSheep(null);
              return;
            }
          }
          // Check click on Forest pine trees -> shake tree & drop 3 fresh nuts!
          if (forestPineHitMeshes.length > 0) {
            const rect = canvas.getBoundingClientRect();
            pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);
            const pineHits = raycaster.intersectObjects(forestPineHitMeshes, false);
            if (pineHits.length > 0) {
              const pineGrp = pineHits[0].object.userData.pineTree;
              if (pineGrp && pineGrp.userData) {
                pineGrp.userData.shakeTimer = 0.72;
                const origin = { x: pineGrp.userData.tx, z: pineGrp.userData.tz };
                if (isSouthOcean()) {
                  const baseTY = getTerrainHeight(origin.x, origin.z);
                  for (let k = 0; k < 10; k++) {
                    const a = Math.random() * Math.PI * 2;
                    const rad = 0.3 + Math.random() * 0.9;
                    spawnWaterSplash(origin.x + Math.cos(a) * rad, baseTY + 1.1 + Math.random() * 0.9, origin.z + Math.sin(a) * rad, 2);
                  }
                  showToast('摇晃雪松，簌簌抖落了一阵雪花！❄️');
                } else {
                  for (let k = 0; k < 3; k++) spawnForestGroundNut(true, origin);
                  sheepList.forEach(s => { if (s.isSquirrel) s.forageCooldown = 0; });
                  showToast('摇晃松树，哗啦掉下了几颗饱满坚果！');
                }
              }
              selectSheep(null);
              return;
            }
          }
          // Check click on the red cottage -> toggle warm interior lights & puff a big chimney smoke ring!
          if (cottageHitMesh) {
            const rect = canvas.getBoundingClientRect();
            pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);
            if (raycaster.intersectObject(cottageHitMesh, false).length > 0) {
              cottageLightsOn = !cottageLightsOn;
              syncCottageLights();
              // Puff a big playful chimney smoke ring!
              const rMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.82, side: THREE.DoubleSide });
              const ring = new THREE.Mesh(new THREE.TorusGeometry(0.18, 0.06, 8, 18), rMat);
              ring.rotation.x = Math.PI / 2;
              const smkOrig = getWorldConfig().env.smokeOrigin;
              const cosH = Math.cos(-0.18), sinH = Math.sin(-0.18);
              ring.position.set(
                HOUSE_X + smkOrig.x * cosH + smkOrig.z * sinH,
                getTerrainHeight(HOUSE_X, HOUSE_Z) + smkOrig.y + 0.05,
                HOUSE_Z - smkOrig.x * sinH + smkOrig.z * cosH
              );
              dioramaGroup.add(ring);
              extraSmokeRings.push({ mesh: ring, life: 0, maxLife: 2.2 });
              if (isSouthOcean() && weatherMode === 'aurora') {
                const nowMs = performance.now();
                if (nowMs > iglooTapResetT) iglooTapCount = 0;
                iglooTapCount++;
                iglooTapResetT = nowMs + 3500;
                if (iglooTapCount >= 3) {
                  iglooTapCount = 0;
                  triggerArcticMeteorShower();
                }
              }
              selectSheep(null);
              return;
            }
          }
          // Check click directly on the river -> splash water ripple & spook nearby fish!
          const gPt = raycastGroundRaw(e.clientX, e.clientY);
          if (gPt && isInRiver(gPt.x, gPt.z, 0.05) && !isOnBridge(gPt.x, gPt.z, 0.1) && !isOnReef(gPt.x, gPt.z, 0.1) && !getIceFloeAt(gPt.x, gPt.z, 0.1)) {
            spawnWaterRipple(gPt.x, gPt.z, 3.2);
            fishList.forEach(f => {
              const d = Math.hypot(f.group.position.x - gPt.x, f.group.position.z - gPt.z);
              if (d < 3.6) {
                f.spookTimer = 1.9;
                f.targetDepth = 0.0; // dive down toward deep silhouette!
              }
            });
            if (isSouthOcean()) {
              const nowMs = performance.now();
              if (nowMs > oceanTapResetT) oceanTapCount = 0;
              oceanTapCount++;
              oceanTapResetT = nowMs + 3500;
              if (oceanTapCount >= 3 && !arcticWhale) {
                oceanTapCount = 0;
                spawnArcticWhale();
              }
            }
          } else if (gPt && isSouthOcean() && !isPositionBlocked(gPt.x, gPt.z, 0.3)) {
            const nowMs = performance.now();
            if (nowMs - snowTapLast.time < 550 && Math.hypot(gPt.x - snowTapLast.x, gPt.z - snowTapLast.z) < 1.2) {
              snowTapLast.time = 0;
              startSnowmanBuild(gPt.x, gPt.z, null);
            } else {
              snowTapLast = { x: gPt.x, z: gPt.z, time: nowMs };
            }
          }
          selectSheep(null);
        }
      });

      canvas.addEventListener('wheel', (e) => {
        if (!camState.orbitEnabled) return;
        e.preventDefault();
        camState.radius = Math.max(42, Math.min(108, camState.radius + e.deltaY * 0.03));
        updateCameraTransform();
      }, { passive: false });

      // ------------------------------------------------------------------
      // 10. Toolbar & Demo Button Event Handlers
      // ------------------------------------------------------------------
      stateButtons.forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (!selectedSheep) return;
          clearAutoDeselect();
          if (selectedSheep.swimAction && selectedSheep.swimAction.phase !== 'lounge') {
            showToast('正在冰海里游泳呢，等游回岸边再切换动作吧');
            return;
          }
          selectedSheep.state = btn.dataset.state;
          if (selectedSheep.isCat) {
            selectedSheep.angerTimer = 0;
            selectedSheep.wakeStretchTimer = 0;
            selectedSheep.watchFish = null;
            selectedSheep.reefAction = null;
            selectedSheep.stateTimer = selectedSheep.state === 'Sleep'
              ? (30 + Math.random() * 15)
              : ((selectedSheep.state === 'Dig' || selectedSheep.state === 'Leap') ? 4.0 : 9.0);
          } else {
            selectedSheep.wadeAction = null;
            if ((selectedSheep.state === 'DustBath' || selectedSheep.state === 'Idle') && selectedSheep.isAlpaca && isNearWaterOrBridge(selectedSheep.root.position.x, selectedSheep.root.position.z, -0.15)) {
              selectedSheep.state = 'Walk';
              selectedSheep.targetRotY = getAwayFromRiverAngle(selectedSheep.root.position.x, selectedSheep.root.position.z);
              selectedSheep.stateTimer = 4.5;
              showToast('水边太湿啦，羊驼先走去干沙地上吧');
            } else if (selectedSheep.state === 'DustBath') {
              selectedSheep.dustCycle = 0;
              selectedSheep.dustLoopsLeft = 1;
              selectedSheep.stateTimer = 8.0;
            } else if (selectedSheep.state === 'Spit') {
              selectedSheep.spitCycle = 0;
              selectedSheep.spitFired = false;
              selectedSheep.spitLoopsLeft = 2;
              selectedSheep.stateTimer = 4.0;
            } else if (selectedSheep.state === 'Jump') {
              selectedSheep.jumpPhase = 'hop';
              selectedSheep.jumpTime = 0;
              selectedSheep.stateTimer = 5.5 + Math.random() * 2.0;
            } else if (selectedSheep.state === 'Graze') {
              if (canGrazeAt(selectedSheep.root.position.x, selectedSheep.root.position.z, selectedSheep.root.rotation.y)) {
                selectedSheep.grazePhase = 'eat';
                selectedSheep.grazeTimer = 3.0;
                selectedSheep.nibbleFxTimer = 0.12;
              } else {
                selectedSheep.grazePhase = 'walk';
                selectedSheep.grazeTimer = 0.5;
              }
              selectedSheep.stateTimer = 14 + Math.random() * 8;
            } else if (selectedSheep.state === 'Idle') {
              selectedSheep.idleMode = 'lookup';
              selectedSheep.idleTimer = 3.2;
              selectedSheep.stateTimer = 14 + Math.random() * 8;
            } else {
              selectedSheep.stateTimer = 14 + Math.random() * 8;
            }
          }
          syncToolbarActiveButton();
        });
      });

      btnRotate.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!selectedSheep) return;
        selectedSheep.targetRotY += Math.PI / 2;
      });

      btnReset.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!selectedSheep) return;
        selectedSheep.state = selectedSheep.isCat ? 'Sit' : getWorldRules().flock.defaultResetState;
        selectedSheep.jumpTime = 0;
        selectedSheep.targetRotY = 0;
        selectedSheep.angerTimer = 0;
        selectedSheep.scaredTimer = 0;
        selectedSheep.wadeAction = null;
        if (selectedSheep.isCat) {
          selectedSheep.watchFish = null;
          selectedSheep.reefAction = null;
        }
        syncToolbarActiveButton();
      });

      btnDuplicate.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!selectedSheep) return;
        if (sheepList.length >= 24) {
          showToast(getWorldConfig().maxFlockToast);
          return;
        }
        const angle = Math.random() * Math.PI * 2;
        let nx = selectedSheep.root.position.x + Math.cos(angle) * 1.45;
        let nz = selectedSheep.root.position.z + Math.sin(angle) * 1.45;
        nx = Math.max(TERRAIN_MIN_X + 1.5, Math.min(TERRAIN_MAX_X - 1.5, nx));
        nz = Math.max(-SLAB_D / 2 + 1.5, Math.min(SLAB_D / 2 - 1.5, nz));
        if (isInRiver(nx, nz, 0.7)) {
          if (isSouthOcean()) {
            nz = Math.max(-SLAB_D / 2 + 1.5, getArcticCoastZ(nx) - 1.05);
          } else {
            nx = Math.min(TERRAIN_MAX_X - 1.5, nx + 2.6);
          }
        }
        if (isInsidePen(nx, nz, 0.6) || isInsideHouseFootprint(nx, nz, 0.5)) { nx = PEN_X - PEN_W * 0.5 - 1.2; nz = PEN_Z + 1.5; }
        const clone = createSheep(nx, nz, selectedSheep.targetRotY + 0.3, selectedSheep.state);
        selectSheep(clone);
      });

      btnDelete.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!selectedSheep) return;
        releaseFloeOccupancy(selectedSheep);
        if (selectedSheep.forageTarget && selectedSheep.forageTarget.claimedBy === selectedSheep) {
          selectedSheep.forageTarget.claimedBy = null;
        }
        if (selectedSheep.pairInteraction) clearPairInteraction(selectedSheep.pairInteraction);
        selectedSheep.deleting = true;
        selectedSheep = null;
        updateSelectionUI();
      });

      function syncCottageLights() {
        const lightPresets = {
          sunny:     { emissive: 0.28, light: 0.0  },
          sunset:    { emissive: 0.90, light: 1.5  },
          sandstorm: { emissive: 0.65, light: 0.7  },
          mist:      { emissive: 0.65, light: 0.7  },
          autumn:    { emissive: 0.78, light: 1.2  },
          firefly:   { emissive: 1.48, light: 1.9  },
          snow:      { emissive: 0.72, light: 0.9  },
          aurora:    { emissive: 1.48, light: 1.95 },
          night:     { emissive: 1.45, light: 1.9  },
          rain:      { emissive: 0.55, light: 0.6  }
        };
        const preset = lightPresets[weatherMode] || lightPresets.sunny;
        if (cottageWindowMat) {
          cottageWindowMat.color.setHex(cottageLightsOn ? 0xfde68a : 0x8ba3b8);
          cottageWindowMat.emissiveIntensity = cottageLightsOn ? preset.emissive : 0.0;
        }
        if (cottageWarmLight) {
          cottageWarmLight.intensity = cottageLightsOn ? preset.light : 0.0;
        }
      }

        const cfg = modes.find(m => m.id === mode) || modes[0];
        weatherMode = cfg.id;
        btnWeather.textContent = cfg.label;
        document.body.style.background = cfg.bg;
        rainGroup.visible = weatherMode === 'rain';
        sandstormGroup.visible = weatherMode === 'sandstorm';
        snowGroup.visible = weatherMode === 'snow';
        auroraGroup.visible = weatherMode === 'aurora';
        starFieldGroup.visible = (weatherMode === 'night' || weatherMode === 'firefly' || weatherMode === 'aurora');

        if (weatherMode === 'sunny') {
          hemiLight.color.setHex(0xfffef8);
          hemiLight.groundColor.setHex(getWorldConfig().sunnyGroundHex);
          hemiLight.intensity = 0.88;
          dirLight.color.setHex(0xfff8e6);
          dirLight.intensity = 0.92;
          dirLight.position.set(20, 26, -12);

          hemiLight.color.setHex(0xffd6a5);
          hemiLight.groundColor.setHex(0x8e7c5a);
          hemiLight.intensity = 0.76;
          dirLight.color.setHex(0xff9b54);
          dirLight.intensity = 1.12;
          dirLight.position.set(26, 14, -18);
        } else if (weatherMode === 'sandstorm') {

          dirLight.color.setHex(0xf5c878);
