          eye.position.set(side * 0.54, 0.08, 1.05);
          g.add(eye);
        });

        // Seamless tapered tail peduncle + unified crescent fluke (zero split gap!)
        const tailPivot = new THREE.Group();
        tailPivot.position.set(0, 0.02, -1.42);
        const stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.19, 0.38, 0.92, 12), whaleBlueMat);
        stalk.rotation.x = Math.PI / 2;
        stalk.position.z = -0.34;
        tailPivot.add(stalk);
        const flukeHub = new THREE.Mesh(new THREE.SphereGeometry(0.24, 12, 10), whaleBlueMat);
        flukeHub.scale.set(1.42, 0.24, 1.08);
        flukeHub.position.set(0, 0, -0.74);
        tailPivot.add(flukeHub);
        [-1, 1].forEach(side => {
          const lobe = new THREE.Mesh(new THREE.SphereGeometry(0.30, 12, 10), whaleBlueMat);
          lobe.scale.set(1.58, 0.17, 0.78);
          lobe.position.set(side * 0.31, 0, -0.82);
          lobe.rotation.y = side * 0.36;
          tailPivot.add(lobe);
        });
        g.add(tailPivot);

        const startX = dir > 0 ? (TERRAIN_MIN_X + 1.5) : (TERRAIN_MAX_X - 1.5);
        const cruiseZ = 9.75;
        g.position.set(startX, -1.2, cruiseZ);
        g.rotation.y = dir > 0 ? Math.PI / 2 : -Math.PI / 2;
        dioramaGroup.add(g);

        arcticWhale = {
          group: g,
          tailPivot,
          dir,
          t: 0,
          dur: 9.8,
          spoutTimer: 0,
          rippleTimer: 0.15,
          floeBounced: false
        };
        arcticWhaleCooldown = 48 + Math.random() * 28;
        showToast('冰海深处游来一头小蓝鲸，正在喷水柱！🐳');
      }

      function updateArcticWhale(dt, elapsed) {
        if (!isSouthOcean()) return;
        if (!arcticWhale) {
          arcticWhaleCooldown -= dt;
          if (arcticWhaleCooldown <= 0) {
            spawnArcticWhale();
          }
          return;
        }
        const w = arcticWhale;
        w.t += dt;
        const p = Math.min(1, w.t / w.dur);
        const span = (TERRAIN_MAX_X - TERRAIN_MIN_X) - 3.6;
        const x = w.dir > 0 ? (TERRAIN_MIN_X + 1.8 + p * span) : (TERRAIN_MAX_X - 1.8 - p * span);
        const z = 9.75 + Math.sin(p * Math.PI * 2.0) * 0.36;

        // Smooth breach -> surface cruise -> graceful tail-up dive
        let y = -1.25;
        let pitch = 0;
        if (p < 0.22) {
          const u = p / 0.22;
          const su = u * u * (3 - 2 * u);
          y = -1.25 + su * 1.28;
          pitch = -0.38 * Math.sin(u * Math.PI);
        } else if (p < 0.76) {
          y = 0.03 + Math.sin(elapsed * 2.8) * 0.06;
          pitch = Math.sin(elapsed * 2.4) * 0.06;
          // Water spout fountain bursts during surface cruise!
          w.spoutTimer -= dt;
          if (w.spoutTimer <= 0 && p > 0.28 && p < 0.68) {
            w.spoutTimer = 0.14;
            const bx = x + w.dir * 0.68;
            for (let k = 0; k < 3; k++) {
              const mat = new THREE.MeshBasicMaterial({ color: k === 0 ? 0xffffff : 0xbae6fd, transparent: true, opacity: 0.90, depthWrite: false });
              const drop = new THREE.Mesh(microDropGeo, mat);
              drop.scale.setScalar(0.85 + Math.random() * 0.45);
              drop.position.set(bx, 0.56, z);
              dioramaGroup.add(drop);
              const ang = Math.random() * Math.PI * 2;
              microParticles.push({
                mesh: drop,
                vx: Math.cos(ang) * (0.45 + Math.random() * 0.55),
                vy: 3.1 + Math.random() * 1.1,
                vz: Math.sin(ang) * (0.45 + Math.random() * 0.55),
                gravity: -6.4,
                grow: 0.4,
                life: 0,
                maxLife: 0.92,
                baseOpacity: 0.90
              });
            }
          }
          if (!w.floeBounced && p > 0.42) {
            w.floeBounced = true;
            ARCTIC_FLOES.forEach(fl => triggerFloeBounce(fl, -0.75));
          }
        } else {
          const u = (p - 0.76) / 0.24;
          const su = u * u * (3 - 2 * u);
          y = 0.03 - su * 1.38;
          pitch = 0.52 * Math.sin(u * Math.PI);
        }

        w.group.position.set(x, y, z);
        w.group.rotation.x = 0;
        w.group.rotation.z = w.dir > 0 ? -pitch : pitch;
        w.tailPivot.rotation.x = Math.sin(elapsed * 5.2) * 0.34;

        w.rippleTimer -= dt;
        if (w.rippleTimer <= 0 && y > -0.65) {
          w.rippleTimer = 0.42;
          spawnWaterRipple(x, z, 3.4);
        }

        if (p >= 1) {
          dioramaGroup.remove(w.group);
          disposeObject3D(w.group);
          arcticWhale = null;
        }
      }

      // --- Arctic Easter Egg 3: Aurora Night Polar Meteor Shower ---
      function triggerArcticMeteorShower() {
        onsenSteamBoost = 4.2;
        for (let k = 0; k < 6; k++) {
          const mg = new THREE.Group();
          const headMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.95, depthWrite: false });
          const tailMat = new THREE.MeshBasicMaterial({ color: k % 2 === 0 ? 0x7dd3fc : 0x6ee7b7, transparent: true, opacity: 0.72, depthWrite: false });
          const head = new THREE.Mesh(new THREE.SphereGeometry(0.11, 8, 6), headMat);
          mg.add(head);
          const tail = new THREE.Mesh(new THREE.ConeGeometry(0.085, 2.2, 6), tailMat);
          tail.rotation.z = -Math.PI / 2;
          tail.position.x = -1.1;
          mg.add(tail);
          const startX = TERRAIN_MIN_X + 2 + Math.random() * 16;
          const startY = 8.4 + Math.random() * 3.0;
          const startZ = -10.5 - Math.random() * 5.5;
          mg.position.set(startX, startY, startZ);
          mg.rotation.z = -0.34;
          mg.visible = false;
          dioramaGroup.add(mg);
          arcticMeteors.push({
            group: mg,
            headMat,
            tailMat,
            sx: startX, sy: startY, sz: startZ,
            vx: 16.5 + Math.random() * 5.5,
            vy: -5.8 - Math.random() * 1.8,
            delay: k * 0.34,
            life: 0,
            dur: 1.05 + Math.random() * 0.25
          });
        }
        showToast('极光夜流星雨划过冰原，快许个愿吧！🌠');
      }

      function updateArcticMeteors(dt) {
        for (let i = arcticMeteors.length - 1; i >= 0; i--) {
          const mt = arcticMeteors[i];
          if (mt.delay > 0) {
            mt.delay -= dt;
            continue;
          }
          mt.group.visible = true;
          mt.life += dt;
          const p = mt.life / mt.dur;
          if (p >= 1) {
            dioramaGroup.remove(mt.group);
            disposeObject3D(mt.group);
            arcticMeteors.splice(i, 1);
            continue;
          }
          mt.group.position.set(mt.sx + mt.vx * mt.life, mt.sy + mt.vy * mt.life, mt.sz);
          const env = Math.sin(p * Math.PI);
          mt.headMat.opacity = env;
          mt.tailMat.opacity = env * 0.72;
        }
      }

      // --- Arctic Easter Egg 4 & Penguin Action: Collaborative Snowman Building ---
      function createMiniSnowmanMesh(x, z) {

        const carrotMat = new THREE.MeshStandardMaterial({ color: 0xf97316, roughness: 0.78 });
        const twigMat = new THREE.MeshStandardMaterial({ color: 0x6b4423, roughness: 0.94 });
        const scarfCol = Math.random() < 0.5 ? 0xef4444 : 0x3b82f6;
        const scarfMat = new THREE.MeshStandardMaterial({ color: scarfCol, bumpMap: feltBumpTex, bumpScale: 0.02, roughness: 0.92 });

        const base = new THREE.Mesh(new THREE.SphereGeometry(0.32, 14, 12), snowMat);
        base.position.y = 0.28; base.castShadow = true; base.receiveShadow = true;
        g.add(base);

        const mid = new THREE.Mesh(new THREE.SphereGeometry(0.24, 14, 12), snowMat);
        mid.position.y = 0.68; mid.castShadow = true; mid.receiveShadow = true;

        [0.62, 0.74].forEach(by => {
          const btn = new THREE.Mesh(new THREE.SphereGeometry(0.028, 8, 6), coalMat);
          btn.position.set(0, by, 0.23);
          g.add(btn);
        });

        const scarf = new THREE.Mesh(new THREE.TorusGeometry(0.175, 0.042, 8, 16), scarfMat);
        scarf.rotation.x = Math.PI / 2; scarf.position.y = 0.88;
        g.add(scarf);
        const scarfEnd = new THREE.Mesh(new THREE.BoxGeometry(0.075, 0.20, 0.04), scarfMat);
        scarfEnd.position.set(0.12, 0.76, 0.14); scarfEnd.rotation.z = 0.24;
        g.add(scarfEnd);

        const head = new THREE.Mesh(new THREE.SphereGeometry(0.18, 14, 12), snowMat);
        head.position.y = 1.03; head.castShadow = true;
        g.add(head);

        const carrot = new THREE.Mesh(new THREE.ConeGeometry(0.036, 0.16, 8), carrotMat);
        carrot.rotation.x = Math.PI / 2; carrot.position.set(0, 1.03, 0.22);
        g.add(carrot);

        [-0.068, 0.068].forEach(ex => {
          const eye = new THREE.Mesh(new THREE.SphereGeometry(0.022, 8, 6), coalMat);
          eye.position.set(ex, 1.09, 0.155);
          g.add(eye);
        });

        [-1, 1].forEach(side => {
          const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.020, 0.36, 6), twigMat);
          arm.position.set(side * 0.30, 0.74, 0);
          arm.rotation.z = side * -1.12;
          arm.castShadow = true;
          g.add(arm);
        });

        g.position.set(x, getTerrainHeight(x, z) - 0.02, z);
        g.rotation.y = (Math.random() - 0.5) * 0.8;
        g.scale.setScalar(0.01);
        dioramaGroup.add(g);
        return { group: g, x, z, scalePop: 0.01, life: 0 };
      }

      function startSnowmanBuild(cx, cz, initiator) {
        if (!isSouthOcean() || snowmanBuildEvent) return false;
        // Ensure spot is safely on open snow
        if (isPositionBlocked(cx, cz, 0.35)) {
          cx = Math.max(SLAB_MIN_X + 1.8, Math.min(SLAB_MAX_X - 1.8, cx));
          cz = Math.min(getArcticCoastZ(cx) - 1.6, Math.max(-SLAB_MARGIN_Z + 1.5, cz));
          if (isInsidePen(cx, cz, 1.2)) { cx = PEN_X - PEN_W * 0.5 - 1.6; cz = PEN_Z + 1.2; }
        }
        // Keep max 3 snowmen on the icefield
        if (arcticSnowmen.length >= 3) {
          const old = arcticSnowmen.shift();
          dioramaGroup.remove(old.group);
          disposeObject3D(old.group);
        }

        const helpers = [];
        if (initiator && initiator.isPenguin && !initiator.deleting && !initiator.grabbed && !initiator.swimAction && !initiator.diveAction) {
          helpers.push(initiator);
        }
        // Recruit up to 3 nearby penguins to roll snowballs together!
        const candidates = sheepList
          .filter(p => p.isPenguin && p !== initiator && !p.deleting && !p.grabbed && !p.herded && !p.swimAction && !p.diveAction && !p.pairInteraction)
          .map(p => ({ p, d: Math.hypot(p.root.position.x - cx, p.root.position.z - cz) }))
          .filter(it => it.d < 9.5)
          .sort((a, b) => a.d - b.d);

        for (let i = 0; i < candidates.length && helpers.length < 4; i++) {
          helpers.push(candidates[i].p);
        }
        if (helpers.length === 0) {
          // No nearby penguin: build snowman directly from user double-click!
          const sm = createMiniSnowmanMesh(cx, cz);
          arcticSnowmen.push(sm);
          spawnWaterSplash(cx, getTerrainHeight(cx, cz) + 0.35, cz, 8);
          showToast('在雪地上堆起了一个胡萝卜鼻子小雪人！⛄');
          return true;
        }

        const fxGroup = new THREE.Group();
        dioramaGroup.add(fxGroup);
        const ballMat = new THREE.MeshStandardMaterial({ color: 0xf8fcff, bumpMap: feltBumpTex, bumpScale: 0.018, roughness: 0.92 });
        const balls = [];

        helpers.forEach((p, idx) => {
          p.state = 'Snowman';
          p.stateTimer = 8.0;
          const ang = (idx / helpers.length) * Math.PI * 2 + 0.3;
          p.snowmanSlotAng = ang;
          const bMesh = new THREE.Mesh(new THREE.SphereGeometry(0.24, 12, 10), ballMat);
          bMesh.scale.setScalar(0.25);
          bMesh.castShadow = true;
          fxGroup.add(bMesh);
          balls.push({ mesh: bMesh, penguin: p, ang });
        });

        snowmanBuildEvent = {
          cx, cz,
          stage: 'roll',
          timer: 0,
          helpers,
          balls,
          fxGroup,
          snowman: null
        };
        showToast('附近的小企鹅凑过来一起滚雪球堆雪人啦！⛄');
        return true;
      }

      function updateSnowmenAndBuild(dt, elapsed) {
        // Animate existing snowmen pop-in + playful collision with belly-sliding penguins!
        for (let i = arcticSnowmen.length - 1; i >= 0; i--) {
          const sm = arcticSnowmen[i];
          sm.life += dt;
          if (sm.scalePop < 1) {
            sm.scalePop = Math.min(1, sm.scalePop + dt * 3.8);
            const ov = 1 + Math.sin(sm.scalePop * Math.PI) * 0.14;
            sm.group.scale.setScalar(sm.scalePop * ov);
            if (sm.scalePop >= 1) sm.group.scale.setScalar(1);
          }
          // Check if a belly-sliding penguin crashes into the snowman!
          if (sm.life > 3.2) {
            for (let j = 0; j < sheepList.length; j++) {
              const p = sheepList[j];
              if (!p.isPenguin || p.deleting || p.grabbed || p.state !== 'Slide') continue;
              const d = Math.hypot(p.root.position.x - sm.x, p.root.position.z - sm.z);
              if (d < 0.78) {
                spawnWaterSplash(sm.x, getTerrainHeight(sm.x, sm.z) + 0.45, sm.z, 12);
                spawnBreathPuff(sm.x, getTerrainHeight(sm.x, sm.z) + 0.35, sm.z, 0, 0, 1.35);
                p.dropSquash = 1.0;
                p.targetRotY += Math.PI * 0.75;
                p.state = 'Idle';
                dioramaGroup.remove(sm.group);
                disposeObject3D(sm.group);
                arcticSnowmen.splice(i, 1);
                showToast('哎呀！滑行的小企鹅一头把雪人撞成雪花啦！❄️');
                break;
              }
            }
          }
        }

        if (!snowmanBuildEvent) return;
        const ev = snowmanBuildEvent;
        ev.timer += dt;
        const baseY = getTerrainHeight(ev.cx, ev.cz);

        if (ev.stage === 'roll') {
          const p = Math.min(1, ev.timer / 3.4);
          const orbitR = 1.65 - p * 1.05;
          ev.balls.forEach((b, idx) => {
            const ang = b.ang + p * Math.PI * 1.2;
            const bx = ev.cx + Math.cos(ang) * orbitR;
            const bz = ev.cz + Math.sin(ang) * orbitR;
            const sc = 0.28 + p * 0.88;
            b.mesh.scale.setScalar(sc);
            b.mesh.position.set(bx, getTerrainHeight(bx, bz) + sc * 0.22, bz);
            b.mesh.rotation.x += dt * 4.5;
            if (b.penguin && !b.penguin.deleting && !b.penguin.grabbed) {
              const px = ev.cx + Math.cos(ang) * (orbitR + 0.55);
              const pz = ev.cz + Math.sin(ang) * (orbitR + 0.55);
              b.penguin.root.position.x += (px - b.penguin.root.position.x) * Math.min(1, dt * 4.5);
              b.penguin.root.position.z += (pz - b.penguin.root.position.z) * Math.min(1, dt * 4.5);
              b.penguin.targetRotY = Math.atan2(bx - b.penguin.root.position.x, bz - b.penguin.root.position.z);
            }
          });
          if (Math.random() < dt * 4.0) {
            spawnWaterSplash(ev.cx + (Math.random() - 0.5) * 1.4, baseY + 0.12, ev.cz + (Math.random() - 0.5) * 1.4, 2);
          }
          if (p >= 1) {
            ev.stage = 'admire';
            ev.timer = 0;
            dioramaGroup.remove(ev.fxGroup);
            disposeObject3D(ev.fxGroup);
            ev.fxGroup = null;
            const sm = createMiniSnowmanMesh(ev.cx, ev.cz);
            arcticSnowmen.push(sm);
            ev.snowman = sm;
            spawnWaterSplash(ev.cx, baseY + 0.45, ev.cz, 10);
            showToast('小企鹅齐心协力堆好了一个迷你雪人！⛄🎉');
          }
        } else if (ev.stage === 'admire') {
          ev.helpers.forEach(p => {
            if (p && !p.deleting && !p.grabbed) {
              p.targetRotY = Math.atan2(ev.cx - p.root.position.x, ev.cz - p.root.position.z);
            }
          });
          if (ev.timer >= 2.6) {
            ev.helpers.forEach(p => {
              if (p && !p.deleting && p.state === 'Snowman') {
                p.state = 'Walk';
                p.stateTimer = 8 + Math.random() * 6;
                if (selectedSheep === p) syncToolbarActiveButton();
              }
            });
            snowmanBuildEvent = null;
          }
        }
      }

      function updateMicroParticles(dt) {
        for (let i = microParticles.length - 1; i >= 0; i--) {
          const pt = microParticles[i];
          pt.life += dt;
          if (pt.life >= pt.maxLife) {
            dioramaGroup.remove(pt.mesh);
            pt.mesh.material.dispose();
            microParticles.splice(i, 1);
            continue;
          }
          const p = pt.life / pt.maxLife;
          pt.vy += pt.gravity * dt;
          pt.mesh.position.x += pt.vx * dt;
          pt.mesh.position.y += pt.vy * dt;
          pt.mesh.position.z += pt.vz * dt;
          if (pt.grow > 0) pt.mesh.scale.addScalar(pt.grow * dt);
          else pt.mesh.scale.multiplyScalar(Math.max(0.1, 1 + pt.grow * dt));
          pt.mesh.material.opacity = pt.baseOpacity * (1 - p);
        }
      }

      // --- Golden Wool Rebirth Aura & Spiraling Sparkle Motes FX ---
      const rebirthFxList = [];
      const rebirthAuraGeo = new THREE.SphereGeometry(0.68, 18, 14);
      const rebirthHaloGeo = new THREE.RingGeometry(0.45, 0.72, 28);
      const rebirthSparkGeo = new THREE.OctahedronGeometry(0.085, 0);

      function spawnGoldenRebirthFX(sheep) {
        const isPolarFX = Boolean(sheep && sheep.isPenguin);
        const g = new THREE.Group();
        const auraMat = new THREE.MeshBasicMaterial({
          color: isPolarFX ? 0x67e8f9 : 0xfde047,
          transparent: true,
          opacity: 0,
          depthWrite: false
        });
        const aura = new THREE.Mesh(rebirthAuraGeo, auraMat);
        aura.position.y = 0.62;
        aura.renderOrder = 18;
        g.add(aura);

        const haloMat = new THREE.MeshBasicMaterial({
          color: isPolarFX ? 0x34d399 : 0xfacc15,
          transparent: true,
          opacity: 0,
          side: THREE.DoubleSide,
          depthWrite: false
        });
        const halo = new THREE.Mesh(rebirthHaloGeo, haloMat);
        halo.rotation.x = -Math.PI / 2;
        halo.position.y = 0.05;
        halo.renderOrder = 17;
        g.add(halo);

        const sparks = [];
        for (let k = 0; k < 12; k++) {
          const sMat = new THREE.MeshBasicMaterial({
            color: isPolarFX ? (k % 3 === 0 ? 0x67e8f9 : (k % 3 === 1 ? 0x34d399 : 0xc4b5fd)) : (k % 2 === 0 ? 0xfef08a : 0xfbbf24),
            transparent: true,
            opacity: 0,
            depthWrite: false
          });
          const sp = new THREE.Mesh(rebirthSparkGeo, sMat);
          sp.renderOrder = 19;
          g.add(sp);
          sparks.push({
            mesh: sp,
            angle: (k / 12) * Math.PI * 2,
            radius: 0.42 + (k % 3) * 0.16,
            speed: 3.4 + (k % 3) * 0.9,
            rise: 1.45 + (k % 4) * 0.32,
            delay: (k % 4) * 0.08
          });
        }

        dioramaGroup.add(g);
        rebirthFxList.push({ sheep, group: g, aura, halo, sparks, life: 0, maxLife: 1.85, shedDone: false });

        // All other sheep on the meadow pause, turn toward their reborn friend, gently sway heads & clap '👏'!
        for (let i = 0; i < sheepList.length; i++) {
          const other = sheepList[i];
          if (other === sheep || other.deleting || other.grabbed || other.herded || other.exitingCottage) continue;
          if (other.pairInteraction) clearPairInteraction(other.pairInteraction);
          other.vaultTime = 0;
          other.drinkTimer = 0;
          other.shakeTimer = 0;
          other.fleePenTimer = 0;
          other.followLeader = null;
          other.celebrateTimer = 2.6;
          other.celebrateTarget = sheep;
        }
      }

      function updateGoldenRebirthFX(dt) {
        for (let i = rebirthFxList.length - 1; i >= 0; i--) {
          const fx = rebirthFxList[i];
          fx.life += dt;
          if (fx.life >= fx.maxLife || !fx.sheep || fx.sheep.deleting) {
            dioramaGroup.remove(fx.group);
            fx.aura.material.dispose();
            fx.halo.material.dispose();
            fx.sparks.forEach(s => s.mesh.material.dispose());
            rebirthFxList.splice(i, 1);
            continue;
          }
          const p = fx.life / fx.maxLife;
          const env = Math.sin(p * Math.PI);
          fx.group.position.copy(fx.sheep.root.position);

          // Glowing golden rebirth aura wrapping the sheep
          const auraScale = 0.85 + env * 0.55;
          fx.aura.scale.set(auraScale, auraScale * 1.08, auraScale * 1.15);
          fx.aura.material.opacity = env * 0.48;

          // Expanding golden ground halo
          fx.halo.scale.setScalar(0.8 + p * 1.6);
          fx.halo.material.opacity = env * 0.65;

          // Rising golden star motes spiraling upward
          fx.sparks.forEach(sp => {
            const lp = Math.max(0, Math.min(1, (p - sp.delay) / (1 - sp.delay)));
            const a = sp.angle + lp * sp.speed * 1.6;
            const r = sp.radius * (1.0 - lp * 0.25);
            sp.mesh.position.set(
              Math.cos(a) * r,
              0.15 + lp * sp.rise,
              Math.sin(a) * r
            );
            sp.mesh.rotation.y += dt * 6;
            sp.mesh.rotation.x += dt * 4;
            const sEnv = Math.sin(lp * Math.PI);
            sp.mesh.scale.setScalar(0.6 + sEnv * 0.85);
            sp.mesh.material.opacity = sEnv * 0.95;
          });

          // Right at the peak of the golden glow, shed the slim sweater & poof back into full fluffy white wool!
          if (p >= 0.48 && !fx.shedDone) {
            fx.shedDone = true;
            if (fx.sheep.sweaterMesh) {
              fx.sheep.bodyRig.remove(fx.sheep.sweaterMesh);

      // Undulating Northern Lights aurora sky curtains with silky feathered vertical gradient + ambient polar glow
      function createAuroraGradientTexture(r, g, b) {
        const c = document.createElement('canvas');
        c.width = 256; c.height = 128;
        const ctx = c.getContext('2d');
        const vGrad = ctx.createLinearGradient(0, 128, 0, 0);
        vGrad.addColorStop(0.0,  `rgba(${r},${g},${b},0.0)`);
        vGrad.addColorStop(0.18, `rgba(${r},${g},${b},0.92)`);
        vGrad.addColorStop(0.45, `rgba(${r},${g},${b},0.52)`);
        vGrad.addColorStop(0.78, `rgba(${r},${g},${b},0.16)`);
        vGrad.addColorStop(1.0,  `rgba(${r},${g},${b},0.0)`);
        ctx.fillStyle = vGrad;
        ctx.fillRect(0, 0, 256, 128);
        // Vertical shimmering aurora curtain rays
        for (let x = 0; x < 256; x += 6) {
          const rayA = 0.06 + 0.16 * (0.5 + 0.5 * Math.sin(x * 0.27));
          ctx.fillStyle = `rgba(255,255,255,${rayA.toFixed(2)})`;
          ctx.fillRect(x, 12, 2, 102);
        }
        // Soft horizontal edge fade so ribbon ends dissolve smoothly
        ctx.globalCompositeOperation = 'destination-in';
        const hGrad = ctx.createLinearGradient(0, 0, 256, 0);
        hGrad.addColorStop(0.0, 'rgba(0,0,0,0)');
        hGrad.addColorStop(0.14, 'rgba(0,0,0,1)');
        hGrad.addColorStop(0.86, 'rgba(0,0,0,1)');
        hGrad.addColorStop(1.0, 'rgba(0,0,0,0)');
        ctx.fillStyle = hGrad;
        ctx.fillRect(0, 0, 256, 128);
        const tex = new THREE.CanvasTexture(c);
        tex.encoding = THREE.sRGBEncoding;
        return tex;
      }

      // --- Delicate Animated Butterflies (flitting around the meadow & flowering tree) ---
      const butterflies = [];
      function createButterflies() {
        const bfColors = [0xfffbeb, 0xfde68a];
        const wingGeo = new THREE.PlaneGeometry(0.16, 0.12);
        wingGeo.translate(0.08, 0, 0);

      function updateButterflies(dt, elapsed) {
        const hideBf = getWorldConfig().env.butterflyZone === 'none';
        butterflies.forEach((bf, idx) => {
          bf.group.visible = !hideBf;
          if (hideBf) return;
          if (bf.scareBoost > 0) bf.scareBoost = Math.max(0, bf.scareBoost - dt * 1.4);
          const a = elapsed * bf.speed + bf.phase;
          const isOasisZone = getWorldConfig().env.butterflyZone === 'oasis';
          const cx = isOasisZone ? (getRiverCenterX(idx === 0 ? -2.2 : 3.0) + (idx === 0 ? -0.6 : 0.7)) : bf.centerX;
          const cz = isOasisZone ? (idx === 0 ? -2.2 : 3.0) : bf.centerZ;
          const rx = isOasisZone ? 1.5 : bf.radiusX;
          const rz = isOasisZone ? 1.8 : bf.radiusZ;
          const nx = cx + Math.cos(a) * rx + Math.sin(a * 2.3) * 0.45;
          const nz = cz + Math.sin(a * 0.85) * rz;
          const ny = getTerrainHeight(nx, nz) + 0.75 + Math.sin(elapsed * 3.4 + bf.phase) * 0.25 + bf.scareBoost * 1.3;
          const dx = nx - bf.group.position.x;
          const dz = nz - bf.group.position.z;
          if (Math.hypot(dx, dz) > 0.001) {
            bf.group.rotation.y = Math.atan2(dx, dz);
          }
          bf.group.position.set(nx, ny, nz);
          const flap = Math.sin(elapsed * (16 + bf.scareBoost * 10) + bf.phase) * 0.85;
          bf.leftW.rotation.z = flap;
          bf.rightW.rotation.z = -flap;
        });

      // Pairwise sheep interactions (Scenario 1: Sweet Nuzzle + Heart, Scenario 2: Cartoon Headbutt Fight + Big Dust Cloud & Fire)
      let pairInteractions = [];
      const fightDustGeo = new THREE.SphereGeometry(0.38, 12, 10);
      const fightDustMats = [
        new THREE.MeshStandardMaterial({ color: 0xf7f3ea, roughness: 0.96, transparent: true, opacity: 0.88 }),
        new THREE.MeshStandardMaterial({ color: 0xe7dfd0, roughness: 0.96, transparent: true, opacity: 0.84 }),

      ];

      function clearPairInteraction(inter) {
        if (!inter) return;
        if (inter.a && inter.a.pairInteraction === inter) inter.a.pairInteraction = null;
        if (inter.b && inter.b.pairInteraction === inter) inter.b.pairInteraction = null;
        if (inter.fxGroup) {
          dioramaGroup.remove(inter.fxGroup);
        }
        const idx = pairInteractions.indexOf(inter);
        if (idx !== -1) pairInteractions.splice(idx, 1);
      }

      function startPairInteraction(sheepA, sheepB, type) {
        if (sheepA.pairInteraction) clearPairInteraction(sheepA.pairInteraction);
        if (sheepB.pairInteraction) clearPairInteraction(sheepB.pairInteraction);
        if (sheepA.isSquirrel && sheepB.isSquirrel) {
          type = 'tug';
        }

        sheepA.angerTimer = 0;
        sheepB.angerTimer = 0;
        sheepA.vaultTime = 0;
        sheepB.vaultTime = 0;

        // Place them comfortably facing head-to-head at an ideal spacing
        let dx = sheepB.root.position.x - sheepA.root.position.x;
        let dz = sheepB.root.position.z - sheepA.root.position.z;
        let dist = Math.hypot(dx, dz);
        if (dist < 0.05) {
          dx = 1;
          dz = 0;
          dist = 1;
        }
        const nx = dx / dist;
        const nz = dz / dist;
        const idealDist = type === 'love' ? 1.12 : (type === 'tug' ? 1.18 : 1.24);
        const targetAx = sheepB.root.position.x - nx * idealDist;
        const targetAz = sheepB.root.position.z - nz * idealDist;
        if (!isPositionBlocked(targetAx, targetAz, 0)) {
          sheepA.root.position.x = targetAx;
          sheepA.root.position.z = targetAz;
        }

        const fxGroup = new THREE.Group();
        dioramaGroup.add(fxGroup);

        const inter = {
          a: sheepA,
          b: sheepB,
          type, // 'love' | 'fight'
          timer: 5.0,
          elapsed: 0,
          fxGroup,
          heartSprite: null,
          fireSprite: null,
          dustPuffs: []
        };

        if (type === 'tug') {
          inter.timer = 5.2;
          inter.winner = Math.random() < 0.5 ? sheepA : sheepB;
          const giantNut = createNutMesh(2.25);
          fxGroup.add(giantNut);
          inter.tugNut = giantNut;
          const tMat = new THREE.SpriteMaterial({
            map: alertMarkTex,
            transparent: true,
            opacity: 0,
            depthTest: false,
            depthWrite: false
          });
          const tSprite = new THREE.Sprite(tMat);
          tSprite.renderOrder = 1000;
          tSprite.scale.set(0.01, 0.01, 1);
          fxGroup.add(tSprite);
          inter.tugSprite = tSprite;
        } else if (type === 'love') {
          const hMat = new THREE.SpriteMaterial({
            map: heartMarkTex,
            transparent: true,
            opacity: 0,
            depthTest: false,
            depthWrite: false
          });
          const hSprite = new THREE.Sprite(hMat);
          hSprite.renderOrder = 1000;
          hSprite.scale.set(0.01, 0.01, 1);
          fxGroup.add(hSprite);
          inter.heartSprite = hSprite;
        } else {
          const isPenguinSquabble = Boolean(sheepA.isPenguin && sheepB.isPenguin);
          inter.isPenguinSquabble = isPenguinSquabble;
          const puffCount = isPenguinSquabble ? 8 : 14;
          for (let k = 0; k < puffCount; k++) {
            const pMat = isPenguinSquabble
              ? new THREE.MeshStandardMaterial({ color: k % 2 === 0 ? 0xf0f9ff : 0xe0f2fe, roughness: 0.95, transparent: true, opacity: 0.78 })

            const puff = new THREE.Mesh(fightDustGeo, pMat);
            puff.castShadow = false;
            fxGroup.add(puff);
            inter.dustPuffs.push({
              mesh: puff,
              angle: (k / puffCount) * Math.PI * 2,
              radius: isPenguinSquabble ? (0.18 + (k % 3) * 0.14) : (0.24 + (k % 4) * 0.18),
              baseY: isPenguinSquabble ? (0.14 + (k % 3) * 0.12) : (0.28 + (k % 4) * 0.23),
              speed: 2.4 + (k % 3) * 0.85,
              scaleBase: isPenguinSquabble ? (0.42 + (k % 3) * 0.14) : (0.92 + (k % 4) * 0.28),
              phase: k * 0.85

          }

          // Penguins squabble with angry mark '💢' & snow puffs instead of desert dust & fire '🔥'
          const fMat = new THREE.SpriteMaterial({

            opacity: 0,
            depthTest: false,
            depthWrite: false

          fSprite.scale.set(0.01, 0.01, 1);
          fxGroup.add(fSprite);
          inter.fireSprite = fSprite;
        }

        sheepA.pairInteraction = inter;
        sheepB.pairInteraction = inter;
        pairInteractions.push(inter);
      }

      // ------------------------------------------------------------------
      // 6.4 Sheepdog-Cat Herding -> Shearing -> ??? -> Cottage Door Event
      // ------------------------------------------------------------------
      let herdingEvent = null;
      let herdingCooldown = 0;

      function clearHerdingEvent() {
        if (!herdingEvent) return;
        if (herdingEvent.sheep) herdingEvent.sheep.herded = false;
        if (herdingEvent.fxGroup) dioramaGroup.remove(herdingEvent.fxGroup);
        herdingEvent = null;
      }

      function startHerdingEvent(sheep) {
        if (herdingEvent || !goldenCat || !sheep || sheep.deleting || sheep.isCat || sheep.grabbed || sheep.hasSweater || sheep.basketEmpty) return false;
        if (sheep.pairInteraction) clearPairInteraction(sheep.pairInteraction);
        if (sheep.forageTarget) { sheep.forageTarget.claimedBy = null; sheep.forageTarget = null; }

        // Forest Easter Egg (~25%): brave squirrel puffs its tail & startles Red Panda into reflexive Threaten stance!
        if (sheep.isSquirrel && goldenCat.isRedPanda && Math.random() < 0.25) {
          herdingCooldown = 8.0;
          goldenCat.state = 'Threaten';
          goldenCat.threatenCycle = 0;
          goldenCat.stateTimer = 3.8;
          goldenCat.targetRotY = Math.atan2(sheep.root.position.x - goldenCat.root.position.x, sheep.root.position.z - goldenCat.root.position.z);
          goldenCat.dropSquash = 0.85;
          if (selectedSheep === goldenCat) syncToolbarActiveButton();
          sheep.targetRotY = Math.atan2(sheep.root.position.x - goldenCat.root.position.x, sheep.root.position.z - goldenCat.root.position.z);
          sheep.fleePenTimer = 1.4;
          showToast('胖松鼠突然炸毛反吓了小熊猫一跳！');
          return true;
        }

        goldenCat.angerTimer = 0;
        goldenCat.boltingTimer = 0;
        goldenCat.wakeStretchTimer = 0;
        goldenCat.watchFish = null;
        goldenCat.reefAction = null;

        sheep.angerTimer = 0;
        sheep.scaredTimer = 0;
        sheep.fleePenTimer = 0;
        sheep.vaultTime = 0;
        sheep.wadeAction = null;
        sheep.herded = true;

        if (sheep.swimAction) { releaseFloeOccupancy(sheep); sheep.swimAction = null; }
        if (sheep.diveAction) { sheep.diveAction = null; }
        if (goldenCat.swimAction) { releaseFloeOccupancy(goldenCat); goldenCat.swimAction = null; }
        const waypoints = [];
        const onLeftBank = !isSouthOcean() && sheep.root.position.x < getRiverCenterX(sheep.root.position.z);
        if (onLeftBank) {
          waypoints.push({ x: BRIDGE_X - BRIDGE_SPAN * 0.5 - 0.55, z: BRIDGE_Z });
          waypoints.push({ x: BRIDGE_X + BRIDGE_SPAN * 0.5 + 0.65, z: BRIDGE_Z });
        }
        const gateX = PEN_X;
        const gateZ = PEN_Z + PEN_D * 0.5 + 0.65;
        const shearSpotX = PEN_X - 1.15;
        const shearSpotZ = PEN_Z + 0.35;
        waypoints.push({ x: gateX, z: gateZ });
        waypoints.push({ x: shearSpotX, z: shearSpotZ });

        const cosH = Math.cos(-0.18);
        const sinH = Math.sin(-0.18);
        function houseLocalToWorld(lx, lz) {
          return {
            x: HOUSE_X + lx * cosH + lz * sinH,
            z: HOUSE_Z - lx * sinH + lz * cosH
          };
        }
        const envCfg = getWorldConfig().env;
        const doorLocalX = envCfg.doorLocalX;
        const doorstep = houseLocalToWorld(doorLocalX, envCfg.doorLocalZ);
        const insideDoor = houseLocalToWorld(doorLocalX, 0.45);

        const fxGroup = new THREE.Group();
        dioramaGroup.add(fxGroup);

        herdingEvent = {
          sheep,
          cat: goldenCat,
          stage: 'herd',
          timer: 0,
          waypoints,
          wpIdx: 0,
          guardPos: { x: gateX + 0.35, z: gateZ + 0.45 },
          shearSpot: { x: shearSpotX, z: shearSpotZ },
          doorstep,
          insideDoor,
          doorAngle: 0,
          fxGroup,
          mistPuffs: [],
          qBurstSprites: []
        };
        herdingCooldown = 18.0;
        if (selectedSheep === sheep) selectSheep(null);
        return true;
      }

      function spawnShearingMist(ev) {

        for (let k = 0; k < 14; k++) {

      function updateHerdingEvent(dt, elapsed) {
        if (herdingCooldown > 0) herdingCooldown = Math.max(0, herdingCooldown - dt);
        // Handle any sheared sheep returning from the cottage wearing a cozy little sweater!
        if (!herdingEvent && sweaterReturnQueue.length > 0) {
          const sr = sweaterReturnQueue[0];
          if (sr.stage === 'wait') {
            sr.timer -= dt;
            if (sr.timer <= 0 && sheepList.length < 24) {
              sr.stage = 'open';
              sr.timer = 0.7;
            }
          } else if (sr.stage === 'open') {
            if (cottageDoorPivot) cottageDoorPivot.rotation.y += (-Math.PI * 0.62 - cottageDoorPivot.rotation.y) * Math.min(1, dt * 7);
            sr.timer -= dt;
            if (sr.timer <= 0) {
              const s = createSheep(sr.insideDoor.x, sr.insideDoor.z, Math.atan2(sr.doorstep.x - sr.insideDoor.x, sr.doorstep.z - sr.insideDoor.z), 'Walk', true);
              s.herded = true;
              s.exitingCottage = true;
              s.spawnScale = 0.35;
              sr.sheep = s;
              sr.stage = 'exit';
              sr.exitStage = 0;
            }
          } else if (sr.stage === 'exit' && sr.sheep) {
            // 3 clean waypoints: doorstep -> pen gate -> well outside pen into open meadow!
            const exitWaypoints = [
              sr.doorstep,
              { x: PEN_X, z: PEN_Z + PEN_D * 0.5 + 0.55 },
              { x: PEN_X - 0.6, z: PEN_Z + PEN_D * 0.5 + 2.65 }
            ];
            const target = exitWaypoints[sr.exitStage];
            const dx = target.x - sr.sheep.root.position.x;
            const dz = target.z - sr.sheep.root.position.z;
            const dist = Math.hypot(dx, dz);
            if (dist > 0.22) {
              sr.sheep.root.position.x += (dx / dist) * 1.85 * dt;
              sr.sheep.root.position.z += (dz / dist) * 1.85 * dt;
              sr.sheep.targetRotY = Math.atan2(dx, dz);
            } else if (sr.exitStage < exitWaypoints.length - 1) {
              sr.exitStage++;
            } else {
              sr.sheep.exitingCottage = false;
              sr.sheep.herded = false;
              sr.sheep.fleePenCooldown = 6.0;
              sr.sheep.avoidCooldown = 0.5;
              sr.sheep.targetRotY = (Math.random() - 0.5) * 0.9;
              sr.stage = 'close';
              sr.timer = 1.0;
              showToast(getWorldConfig().shearedToast);
            }
          } else if (sr.stage === 'close') {
            if (cottageDoorPivot) cottageDoorPivot.rotation.y += (0 - cottageDoorPivot.rotation.y) * Math.min(1, dt * 7);
            sr.timer -= dt;
            if (sr.timer <= 0) sweaterReturnQueue.shift();
          }
        }

        if (!herdingEvent) {
          if (cottageDoorPivot && (sweaterReturnQueue.length === 0 || sweaterReturnQueue[0].stage === 'wait')) {
            cottageDoorPivot.rotation.y += (0 - cottageDoorPivot.rotation.y) * Math.min(1, dt * 6);
          }
          return;
        }

        const ev = herdingEvent;
        const sh = ev.sheep;
        const cat = ev.cat;
        if (!cat || cat.grabbed || (ev.stage !== 'door_close' && (!sh || sh.deleting || sh.grabbed))) {
          clearHerdingEvent();
          return;
        }

        ev.timer += dt;

        if (cottageDoorPivot) {
          cottageDoorPivot.rotation.y += (ev.doorAngle - cottageDoorPivot.rotation.y) * Math.min(1, dt * 7);
        }

        if (ev.stage === 'herd') {
          const wp = ev.waypoints[ev.wpIdx];
          const dx = wp.x - sh.root.position.x;
          const dz = wp.z - sh.root.position.z;
          const dist = Math.hypot(dx, dz);

          if (dist < 0.35) {
            ev.wpIdx++;
            if (ev.wpIdx >= ev.waypoints.length) {
              ev.stage = 'shiver';
              ev.timer = 0;
              return;
            }
          } else {
            const nx = dx / dist;
            const nz = dz / dist;
            sh.root.position.x += nx * 2.75 * dt;
            sh.root.position.z += nz * 2.75 * dt;
            sh.targetRotY = Math.atan2(nx, nz);

            const weave = Math.sin(elapsed * 5.2) * 0.58;
            const behindX = sh.root.position.x - nx * 1.45 - nz * weave;
            const behindZ = sh.root.position.z - nz * 1.45 + nx * weave;
            const cdx = behindX - cat.root.position.x;
            const cdz = behindZ - cat.root.position.z;
            const cdist = Math.hypot(cdx, cdz);
            if (cdist > 0.12) {
              const cSpeed = Math.min(3.8, Math.max(2.6, cdist * 2.4));
              cat.root.position.x += (cdx / cdist) * cSpeed * dt;
              cat.root.position.z += (cdz / cdist) * cSpeed * dt;
              cat.targetRotY = Math.atan2(sh.root.position.x - cat.root.position.x, sh.root.position.z - cat.root.position.z);
            }
          }
        } else {
          const gdx = ev.guardPos.x - cat.root.position.x;
          const gdz = ev.guardPos.z - cat.root.position.z;
          const gdist = Math.hypot(gdx, gdz);
          if (gdist > 0.25) {
            cat.root.position.x += (gdx / gdist) * 2.4 * dt;
            cat.root.position.z += (gdz / gdist) * 2.4 * dt;
            cat.targetRotY = Math.atan2(gdx, gdz);
            ev.catGuarding = false;
          } else {
            ev.catGuarding = true;
            cat.targetRotY = 0.15;
          }

          if (ev.stage === 'shiver') {
            sh.targetRotY = Math.atan2(cat.root.position.x - sh.root.position.x, cat.root.position.z - sh.root.position.z);
            if (sh.isPenguin) {
              // Stage 1: Penguin resists at the rim of the hot spring!
              const rimX = PEN_X - 1.15;
              const rimZ = PEN_Z + 1.25;
              sh.root.position.x += (rimX - sh.root.position.x) * Math.min(1, dt * 6);
              sh.root.position.z += (rimZ - sh.root.position.z) * Math.min(1, dt * 6);
              if (ev.timer >= 2.6) {
                ev.stage = 'soak_bliss';
                ev.timer = 0;
                onsenSteamBoost = 2.6;
                spawnWaterSplash(PEN_X - 1.15, getTerrainHeight(PEN_X - 1.15, PEN_Z + 0.35) + 0.14, PEN_Z + 0.35, 8);
                showToast('扑通！小企鹅一进温泉瞬间真香啦 ♨️');
              }
            } else if (ev.timer >= (sh.isSquirrel ? 1.2 : 2.2)) {
              if (sh.isSquirrel) {
                ev.stage = 'shake_nuts';
                ev.timer = 0;
                ev.nutDropTimer = 0.18;
              } else {
                ev.stage = 'shear';
                ev.timer = 0;
                spawnShearingMist(ev);
              }
            }
          } else if (ev.stage === 'soak_bliss') {
            // Stage 2: Penguin blissfully soaks inside the steaming Hot Spring with a folded towel on its head!
            const px = PEN_X - 1.15;
            const pz = PEN_Z + 0.35;
            sh.root.position.x += (px - sh.root.position.x) * Math.min(1, dt * 7);
            sh.root.position.z += (pz - sh.root.position.z) * Math.min(1, dt * 7);
            sh.targetRotY = Math.atan2(camera.position.x - sh.root.position.x, camera.position.z - sh.root.position.z);
            if (sh.onsenTowelMesh) sh.onsenTowelMesh.visible = true;
            if (ev.timer >= 4.2) {
              if (sh.onsenTowelMesh) sh.onsenTowelMesh.visible = false;
              ev.stage = 'chilly_exit';
              ev.timer = 0;
              ev.gearEquipped = false;
              sh.dropSquash = 0.85;
            }
          } else if (ev.stage === 'chilly_exit') {
            // Stage 3: Climbs out of hot spring -> shivers in cold air -> equips bright Red Scarf & Pom-Pom Beanie!
            const rimX = PEN_X - 0.95;
            const rimZ = PEN_Z + 1.32;
            sh.root.position.x += (rimX - sh.root.position.x) * Math.min(1, dt * 6);
            sh.root.position.z += (rimZ - sh.root.position.z) * Math.min(1, dt * 6);
            sh.targetRotY = Math.atan2(camera.position.x - sh.root.position.x, camera.position.z - sh.root.position.z);
            if (ev.timer >= 1.55 && !ev.gearEquipped) {
              ev.gearEquipped = true;
              equipPenguinWinterGear(sh);
              sh.dropSquash = 1.0;
              showToast(getWorldConfig().shearedToast);
            }
            if (ev.timer >= 2.75) {
              ev.stage = 'exit_pen';
              ev.timer = 0;
              ev.exitIdx = 0;
            }
          } else if (ev.stage === 'shake_nuts') {
            // Lift squirrel right over the wooden nut crate, flip upside-down, and shake acorns out into the box!
            const crateX = PEN_X - 1.15;
            const crateZ = PEN_Z + 0.35;
            sh.root.position.x += (crateX - sh.root.position.x) * Math.min(1, dt * 8);
            sh.root.position.z += (crateZ - sh.root.position.z) * Math.min(1, dt * 8);
            ev.nutDropTimer -= dt;
            if (ev.nutDropTimer <= 0 && ev.timer < 2.25) {
              ev.nutDropTimer = 0.22;
              const nut = createNutMesh(1.18);
              const gy = getTerrainHeight(crateX, crateZ);
              nut.position.set(
                crateX + (Math.random() - 0.5) * 0.26,
                gy + 1.15 + Math.random() * 0.15,
                crateZ + (Math.random() - 0.5) * 0.22
              );
              dioramaGroup.add(nut);
              fallingNuts.push({
                mesh: nut,
                vx: (Math.random() - 0.5) * 0.55,
                vy: -0.35 - Math.random() * 0.4,
                vz: (Math.random() - 0.5) * 0.55,
                targetY: gy + 0.12 + Math.min(0.18, forestCrateNutCount * 0.012),
                crateX,
                crateZ,
                life: 0
              });
            }
            if (ev.timer > 1.75 && !sh.basketEmpty) {
              sh.basketEmpty = true;
              if (sh.basketNutsGroup) sh.basketNutsGroup.visible = false;
            }
            if (ev.timer >= 2.75) {
              sh.basketEmpty = true;
              if (sh.basketNutsGroup) sh.basketNutsGroup.visible = false;
              sh.dropSquash = 1.0;
              // Step slightly in front of the crate upon landing so squirrel doesn't stand inside the box
              sh.root.position.x = crateX + 0.15;
              sh.root.position.z = crateZ + 0.72;
              ev.stage = 'cry';
              ev.timer = 0;
              showToast('小熊猫把松鼠倒拎起来，背篓里的坚果全抖进箱子啦！');
            }
          } else if (ev.stage === 'cry') {
            // Landed with visibly empty basket -> crying animation!
            sh.targetRotY = Math.atan2(camera.position.x - sh.root.position.x, camera.position.z - sh.root.position.z);
            if (ev.timer >= 3.3) {
              ev.stage = 'exit_pen';
              ev.timer = 0;
              ev.exitIdx = 0;
            }
          } else if (ev.stage === 'exit_pen') {
            const exitWps = [
              { x: PEN_X, z: PEN_Z + PEN_D * 0.5 + 0.55 },
              { x: PEN_X - 0.6, z: PEN_Z + PEN_D * 0.5 + 2.55 }
            ];
            const tgt = exitWps[ev.exitIdx];
            const dx = tgt.x - sh.root.position.x;
            const dz = tgt.z - sh.root.position.z;
            const dist = Math.hypot(dx, dz);
            if (dist > 0.24) {
              sh.root.position.x += (dx / dist) * 1.75 * dt;
              sh.root.position.z += (dz / dist) * 1.75 * dt;
              sh.targetRotY = Math.atan2(dx, dz);
            } else if (ev.exitIdx < exitWps.length - 1) {
              ev.exitIdx++;
            } else {
              sh.herded = false;
              sh.fleePenCooldown = 6.0;
              if (sh.isPenguin) {
                sh.sweaterTimer = 55.0 + Math.random() * 18.0;
              } else {
                sh.refillTimer = 65.0 + Math.random() * 15.0;
                sh.nutsCollected = 0;
              }
              sh.state = 'Walk';
              clearHerdingEvent();
              if (goldenCat) {
                goldenCat.state = 'Walk';
                goldenCat.stateTimer = 7.5 + Math.random() * 3.0;
                goldenCat.targetRotY = -2.25 + (Math.random() - 0.5) * 0.75;
                if (selectedSheep === goldenCat) syncToolbarActiveButton();
              }
            }
          } else if (ev.stage === 'shear') {
            const p = ev.timer / 2.8;
            const vis = Math.min(1, p * 3.5) * Math.min(1, (1 - p) * 3.5);
            ev.mistPuffs.forEach(mp => {
              const a = mp.angle + ev.timer * mp.speed;
              const r = mp.radius * (0.85 + 0.3 * Math.sin(ev.timer * 7 + mp.phase));
              mp.mesh.position.set(
                sh.root.position.x + Math.cos(a) * r,
                sh.root.position.y + mp.baseY + Math.sin(ev.timer * 6 + mp.phase) * 0.16,
                sh.root.position.z + Math.sin(a) * r
              );
              mp.mesh.scale.setScalar(Math.max(0.01, mp.scale * vis));
              mp.mesh.material.opacity = 0.88 * vis;
            });

            if (ev.timer > 1.35 && !sh.sheared) {
              sh.sheared = true;
              sh.woolGroup.visible = false;
              sh.bareBodyMesh.visible = true;
            }

            if (ev.timer >= 2.8) {
              ev.mistPuffs.forEach(mp => ev.fxGroup.remove(mp.mesh));
              ev.mistPuffs.length = 0;
              ev.stage = 'confused';
              ev.timer = 0;
              spawnConfusedQuestions(ev);
            }
          } else if (ev.stage === 'confused') {
            ev.qBurstSprites.forEach(qb => {
              const localT = ev.timer - qb.delay;
              if (localT <= 0) {
                qb.sprite.visible = false;
                return;
              }
              const cycle = (localT * qb.speed) % 1.0;
              const fade = Math.sin(cycle * Math.PI);
              const env = Math.min(1, (2.7 - ev.timer) * 2.5);
              qb.sprite.visible = true;
              const sc = qb.size * (0.7 + 0.35 * fade) * Math.max(0, env);
              qb.sprite.scale.set(sc, sc, 1);
              qb.sprite.position.set(
                sh.root.position.x + qb.offX,
                sh.root.position.y + 1.25 + cycle * 1.15,
                sh.root.position.z + qb.offZ
              );
              qb.sprite.material.opacity = Math.max(0, fade * env);
              qb.sprite.material.rotation = Math.sin(ev.timer * 5 + qb.delay * 4) * 0.18;
            });

            if (ev.timer >= 2.7) {
              ev.qBurstSprites.forEach(qb => ev.fxGroup.remove(qb.sprite));
              ev.qBurstSprites.length = 0;
              ev.stage = 'door_open';
              ev.timer = 0;
              ev.doorAngle = -Math.PI * 0.62;
            }
          } else if (ev.stage === 'door_open') {
            sh.targetRotY = Math.atan2(ev.doorstep.x - sh.root.position.x, ev.doorstep.z - sh.root.position.z);
            if (ev.timer >= 0.75) {
              ev.stage = 'enter_house';
              ev.timer = 0;
              ev.reachedStep = false;
            }
          } else if (ev.stage === 'enter_house') {
            const target = ev.reachedStep ? ev.insideDoor : ev.doorstep;
            const dx = target.x - sh.root.position.x;
            const dz = target.z - sh.root.position.z;
            const dist = Math.hypot(dx, dz);
            if (dist > 0.14) {
              sh.root.position.x += (dx / dist) * 1.55 * dt;
              sh.root.position.z += (dz / dist) * 1.55 * dt;
              sh.targetRotY = Math.atan2(dx, dz);
              if (ev.reachedStep) {
                sh.root.scale.setScalar(Math.max(0.15, dist / 0.95));
              }
            } else if (!ev.reachedStep) {
              ev.reachedStep = true;
            } else {
              dioramaGroup.remove(sh.root);
              const idx = sheepList.indexOf(sh);
              if (idx !== -1) sheepList.splice(idx, 1);
              if (selectedSheep === sh) selectSheep(null);
              if (hoveredSheep === sh) hoveredSheep = null;
              ev.sheep = null;
              ev.stage = 'door_close';
              ev.timer = 0;
              ev.doorAngle = 0;
              // Schedule this sheep to return ~28s later wearing a cozy little knit sweater!
              sweaterReturnQueue.push({ timer: 28.0, stage: 'wait', sheep: null, doorstep: ev.doorstep, insideDoor: ev.insideDoor });
            }
          } else if (ev.stage === 'door_close') {
            if (ev.timer >= 1.1) {
              clearHerdingEvent();
              if (goldenCat) {
                goldenCat.state = 'Walk';
                goldenCat.stateTimer = 7.5 + Math.random() * 3.0;
                // Stroll casually away from the sheep pen back toward the open meadow
                goldenCat.targetRotY = -2.25 + (Math.random() - 0.5) * 0.75;
                if (selectedSheep === goldenCat) syncToolbarActiveButton();
              }
            }
          }
        }
      }

      function updatePairInteractions(dt) {
        for (let i = pairInteractions.length - 1; i >= 0; i--) {
          const inter = pairInteractions[i];
          if (
            !inter.a || !inter.b ||
            inter.a.deleting || inter.b.deleting ||
            inter.a.grabbed || inter.b.grabbed
          ) {
            clearPairInteraction(inter);
            continue;
          }

          inter.elapsed += dt;
          inter.timer -= dt;
          if (inter.timer <= 0) {
            clearPairInteraction(inter);
            continue;
          }

          const midX = (inter.a.root.position.x + inter.b.root.position.x) * 0.5;
          const midZ = (inter.a.root.position.z + inter.b.root.position.z) * 0.5;
          const midY = (inter.a.root.position.y + inter.b.root.position.y) * 0.5;

          const fadeIn = Math.min(1, inter.elapsed * 3.5);
          const fadeOut = Math.min(1, inter.timer * 2.2);
          const vis = fadeIn * fadeOut;

          if (inter.type === 'tug' && inter.tugNut) {
            const dx = inter.b.root.position.x - inter.a.root.position.x;
            const dz = inter.b.root.position.z - inter.a.root.position.z;
            const dLen = Math.hypot(dx, dz) || 1;
            const nx = dx / dLen, nz = dz / dLen;
            if (inter.elapsed < 3.5) {
              const sway = Math.sin(inter.elapsed * 9.5) * 0.16;
              inter.tugNut.position.set(
                midX + nx * sway,
                midY + 0.36 + Math.abs(Math.sin(inter.elapsed * 9.5)) * 0.07,
                midZ + nz * sway
              );
              inter.tugNut.rotation.z = sway * 1.4;
              inter.tugNut.rotation.y += dt * 2.5;
              if (inter.tugSprite) {
                const sz = 0.80 * vis * (1 + Math.sin(inter.elapsed * 12) * 0.10);
                inter.tugSprite.scale.set(sz, sz, 1);
                inter.tugSprite.position.set(midX, midY + 1.48, midZ);
                inter.tugSprite.material.opacity = vis;
              }
            } else {
              // Winner hoists the giant nut triumphantly!
              const w = inter.winner;
              inter.tugNut.position.set(
                w.root.position.x,
                w.root.position.y + 0.96 + Math.abs(Math.sin(inter.elapsed * 10)) * 0.16,
                w.root.position.z
              );
              inter.tugNut.rotation.y += dt * 5.0;
              if (inter.tugSprite) {
                if (inter.tugSprite.material.map !== partyMarkTex) {
                  inter.tugSprite.material.map = partyMarkTex;
                  inter.tugSprite.material.needsUpdate = true;
                  if (w.isSquirrel && w.basketEmpty) {
                    w.nutsCollected = (w.nutsCollected || 0) + 1;
                    if (w.basketNutsGroup) {
                      w.basketNutsGroup.visible = true;
                      w.basketNutsGroup.children.forEach((ch, ci) => { ch.visible = ci < w.nutsCollected; });
                    }
                    if (w.nutsCollected >= 6 && w.rebirthTimer <= 0) {
                      w.rebirthTimer = 1.85;
                      spawnGoldenRebirthFX(w);
                    }
                  }
                }
                const sz = 0.86 * vis;
                inter.tugSprite.scale.set(sz, sz, 1);
                inter.tugSprite.position.set(w.root.position.x, w.root.position.y + 1.65, w.root.position.z);
                inter.tugSprite.material.opacity = vis;
              }
            }
          } else if (inter.type === 'love' && inter.heartSprite) {
            const pulse = 1 + Math.sin(inter.elapsed * 6.5) * 0.12;
            const sz = 0.92 * vis * pulse;
            inter.heartSprite.scale.set(sz, sz, 1);
            inter.heartSprite.position.set(
              midX,
              midY + 1.56 + Math.sin(inter.elapsed * 3.6) * 0.08,
              midZ
            );
            inter.heartSprite.material.opacity = vis;
            inter.heartSprite.material.rotation = Math.sin(inter.elapsed * 3.2) * 0.10;
          } else if (inter.type === 'fight') {
            inter.dustPuffs.forEach(p => {
              const a = p.angle + inter.elapsed * p.speed;
              const burst = 0.82 + 0.36 * Math.abs(Math.sin(inter.elapsed * 7.2 + p.phase));
              const r = p.radius * burst;
              p.mesh.position.set(
                midX + Math.cos(a) * r,
                midY + p.baseY + Math.sin(inter.elapsed * 5.8 + p.phase) * 0.18,
                midZ + Math.sin(a) * r
              );
              const sc = p.scaleBase * vis * (0.88 + 0.30 * Math.sin(inter.elapsed * 8.5 + p.phase));
              p.mesh.scale.setScalar(Math.max(0.01, sc));
              p.mesh.material.opacity = 0.84 * vis;
            });

            if (inter.fireSprite) {
              const flicker = 1 + Math.sin(inter.elapsed * 13.5) * 0.11;
              const sz = 0.96 * vis * flicker;
              inter.fireSprite.scale.set(sz, sz, 1);
              inter.fireSprite.position.set(
                midX,
                midY + 1.68 + Math.sin(inter.elapsed * 6.5) * 0.08,
                midZ
              );
              inter.fireSprite.material.opacity = vis;
              inter.fireSprite.material.rotation = Math.sin(inter.elapsed * 10.0) * 0.12;
            }
          }
        }
      }

      // Ground placement target ring shown while dragging a sheep
      const dropRingMat = new THREE.MeshBasicMaterial({
        color: 0x2563eb,
        transparent: true,
        opacity: 0.72,
        side: THREE.DoubleSide,
        depthWrite: false
      });
      const dropRingMesh = new THREE.Mesh(
        new THREE.RingGeometry(0.46, 0.62, 32),
        dropRingMat
      );
      dropRingMesh.rotation.x = -Math.PI / 2;
      dropRingMesh.visible = false;
      dioramaGroup.add(dropRingMesh);

      let sheepList = [];
      let nextSheepId = 1;
      let selectedSheep = null;
      let hoveredSheep = null;

      const SWEATER_COLORS = [0x60a5fa, 0xfb7185, 0x34d399, 0xa78bfa];
      function createSheep(x, z, rotY, initialState, withSweater) {
        const root = new THREE.Group();
        root.position.set(x, getGroundY(x, z), z);
        root.rotation.y = rotY;

        // Animated body pivot (handles bounce, jump elevation, squash & stretch)
        const bodyRig = new THREE.Group();
        bodyRig.scale.setScalar(1.16);
        root.add(bodyRig);

        // Cute slim shaved bare body (hidden under wool until sheared in the sheep pen!)
        const bareBodyMat = new THREE.MeshStandardMaterial({
          color: 0xf4cf65,
          roughness: 0.91,
          metalness: 0.0
        });
        const bareBodyMesh = new THREE.Group();
        const bareTorso = new THREE.Mesh(new THREE.SphereGeometry(0.24, 16, 12), bareBodyMat);
        bareTorso.scale.set(0.92, 0.86, 1.50);
        bareTorso.position.set(0, 0.46, -0.01);
        bareTorso.castShadow = true;
        bareBodyMesh.add(bareTorso);
        // Cute slim neck connecting bare torso seamlessly to headPivot
        const bareNeck = new THREE.Mesh(new THREE.CylinderGeometry(0.105, 0.135, 0.24, 10), bareBodyMat);
        bareNeck.position.set(0, 0.56, 0.29);
        bareNeck.rotation.x = 0.52;
        bareNeck.castShadow = true;
        bareBodyMesh.add(bareNeck);
        // Tiny stubby sheared tail
        const bareTail = new THREE.Mesh(new THREE.SphereGeometry(0.065, 8, 8), bareBodyMat);
        bareTail.position.set(0, 0.45, -0.36);
        bareBodyMesh.add(bareTail);
        bareBodyMesh.visible = false;
        bodyRig.add(bareBodyMesh);

        const flockSpecies = getWorldConfig().flock.species;
        const isAlpaca = flockSpecies === 'alpaca';
        const isSquirrel = flockSpecies === 'squirrel';

        clearHerdingEvent();
        sweaterReturnQueue = [];
        while (pairInteractions.length > 0) {
          clearPairInteraction(pairInteractions[0]);
        }
        sheepList.forEach(s => dioramaGroup.remove(s.root));
        sheepList = [];
        selectedSheep = null;

        const arcticFlockSpecs = [
          { x: -11.6, z: -3.2, r: 0.7, s: 'Walk' },

        const specsToUse = isSouthOcean() ? arcticFlockSpecs : initialFlockSpecs;
        specsToUse.forEach((spec, idx) => {
          let initSt = spec.s;
          const fCfg = getWorldConfig().flock;
          if (!fCfg.canGraze && initSt === 'Graze') {
            initSt = fCfg.spawnPool[idx % fCfg.spawnPool.length];
          }
          if (fCfg.avoidWaterForRest && (initSt === 'Idle' || initSt === 'DustBath' || initSt === 'Huddle') && isInRiver(spec.x, spec.z, 1.55)) {
            initSt = 'Walk';
          }
          const s = createSheep(spec.x, spec.z, spec.r, initSt);
          s.spawnScale = 1;
          s.root.scale.setScalar(1);
        });
        updateSelectionUI();
