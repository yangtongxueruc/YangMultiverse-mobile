      btnWeather.addEventListener('click', () => {
        const modes = getActiveWeatherModes();
        weatherIdx = (weatherIdx + 1) % modes.length;
        applyWeatherMode(modes[weatherIdx].id);
      });

      function applyWorldUI() {
        worldTabs.forEach(tab => {
          const active = tab.dataset.world === currentWorld;
          tab.classList.toggle('active', active);
          tab.setAttribute('aria-selected', active ? 'true' : 'false');
        });
        btnAddSheep.textContent = getWorldConfig().addButtonLabel;
      }
      applyWorldUI();
      applyWeatherMode('sunny');

      // Per-world state snapshots so switching universes preserves flock, weather, lights & guardian
      const worldSnapshots = Object.create(null);

      function saveWorldSnapshot(worldId) {
        worldSnapshots[worldId] = {
          weatherIdx,
          weatherMode,
          cottageLightsOn,
          flock: sheepList
            .filter(s => !s.deleting)
            .map(s => {
              let sx = s.root.position.x;
              let sz = s.root.position.z;
              if (s.swimAction) { sx = s.swimAction.shoreX; sz = s.swimAction.shoreZ; }
              else if (s.diveAction) { sx = s.diveAction.shoreX; sz = s.diveAction.shoreZ; }
              return {
                x: sx,
                z: sz,
                rotY: s.targetRotY,
                state: s.state,
                withSweater: Boolean(s.hasSweater || s.sweaterTimer > 0 || s.basketEmpty),
                sweaterTimer: s.sweaterTimer || s.refillTimer || 0
              };
            }),
          guardian: goldenCat ? {
            x: goldenCat.swimAction ? goldenCat.swimAction.shoreX : goldenCat.root.position.x,
            z: goldenCat.swimAction ? goldenCat.swimAction.shoreZ : goldenCat.root.position.z,
            rotY: goldenCat.targetRotY,
            state: goldenCat.state,
            onRoofTimer: goldenCat.onRoofTimer || 0
          } : null
        };
      }

      function restoreWorldSnapshot(snap) {
        clearHerdingEvent();
        sweaterReturnQueue = [];
        while (pairInteractions.length > 0) {
          clearPairInteraction(pairInteractions[0]);
        }
        sheepList.forEach(s => dioramaGroup.remove(s.root));
        sheepList = [];
        selectedSheep = null;
        hoveredSheep = null;

        cottageLightsOn = Boolean(snap.cottageLightsOn);
        const modes = getActiveWeatherModes();
        weatherIdx = Math.max(0, Math.min(modes.length - 1, snap.weatherIdx || 0));
        applyWeatherMode(snap.weatherMode || modes[weatherIdx].id);

        snap.flock.forEach(item => {
          const s = createSheep(item.x, item.z, item.rotY, item.state, item.withSweater);
          if (item.withSweater && item.sweaterTimer > 0) {
            if (s.isSquirrel) s.refillTimer = item.sweaterTimer;
            else s.sweaterTimer = item.sweaterTimer;
          }
          s.spawnScale = 1;
          s.root.scale.setScalar(1);
        });

        if (goldenCat) {
          dioramaGroup.remove(goldenCat.root);
        }
        if (snap.guardian) {
          goldenCat = createGoldenCat(snap.guardian.x, snap.guardian.z, snap.guardian.rotY);
          goldenCat.state = snap.guardian.state;
          goldenCat.onRoofTimer = getWorldRules().guardian.canClimbRoof ? (snap.guardian.onRoofTimer || 0) : 0;
          if (goldenCat.onRoofTimer > 0) {
            goldenCat.root.position.y = getTerrainHeight(HOUSE_X, HOUSE_Z) + 2.18;
          }
        } else {
          goldenCat = createGoldenCat(1.4, -0.6, 0.0);
        }
        updateSelectionUI();
      }

      let worldSwitching = false;
      worldTabs.forEach(tab => {
        tab.addEventListener('click', () => {
          const targetWorld = tab.dataset.world;
          if (targetWorld === currentWorld || worldSwitching) return;
          worldSwitching = true;
          saveWorldSnapshot(currentWorld);
          worldVeilEl.style.background = (WORLD_REGISTRY[targetWorld] && WORLD_REGISTRY[targetWorld].veilColor) || '#f4f1ea';
          worldVeilEl.classList.add('fade');
          setTimeout(() => {
            currentWorld = targetWorld;
            applyWorldUI();
            buildWorldEnvironment();
            const saved = worldSnapshots[targetWorld];
            if (saved) {
              restoreWorldSnapshot(saved);
            } else {
              weatherIdx = 0;
              cottageLightsOn = false;
              applyWeatherMode('sunny');
              populateInitialFlock();
              initGoldenCat();
            }
            populateClouds();
            populateRiverFish();
            selectSheep(null);
            worldVeilEl.classList.remove('fade');
            worldSwitching = false;
            showToast(getWorldConfig().switchToast);
          }, 220);
        });
      });

      btnOrbitToggle.addEventListener('click', () => {
        camState.orbitEnabled = !camState.orbitEnabled;
        btnOrbitToggle.classList.toggle('active', camState.orbitEnabled);
        btnOrbitToggle.textContent = camState.orbitEnabled ? '自由视角: 开' : '自由视角: 关';
        if (!camState.orbitEnabled) {
          camState.azimuth = camState.baseAzimuth;
          camState.elevation = camState.baseElevation;
          camState.radius = camState.baseRadius;
          updateCameraTransform();
        }
        setCanvasCursor(camState.orbitEnabled ? 'grab' : 'default');
      });

      function syncZoomUI(val) {
        const clamped = Math.max(camState.minZoom, Math.min(camState.maxZoom, Math.round(val * 100) / 100));
        camState.targetZoom = clamped;
        zoomSliderEl.value = clamped.toFixed(2);
        zoomValueEl.textContent = Math.round(clamped * 100) + '%';
        btnZoomOut.disabled = clamped <= camState.minZoom + 0.001;
        btnZoomIn.disabled = clamped >= camState.maxZoom - 0.001;
        zoomControlEl.classList.toggle('zoomed', Math.abs(clamped - 1.0) > 0.01);
      }
      syncZoomUI(camState.targetZoom);

      // Isolate pointer & wheel events on zoom control so it never interferes with canvas interactions
      ['pointerdown', 'mousedown', 'touchstart', 'wheel'].forEach(evtName => {
        zoomControlEl.addEventListener(evtName, (e) => {
          e.stopPropagation();
        });
      });

      btnZoomOut.addEventListener('click', (e) => {
        e.stopPropagation();
        syncZoomUI(camState.targetZoom - 0.15);
      });
      btnZoomIn.addEventListener('click', (e) => {
        e.stopPropagation();
        syncZoomUI(camState.targetZoom + 0.15);
      });
      zoomSliderEl.addEventListener('input', (e) => {
        e.stopPropagation();
        syncZoomUI(parseFloat(zoomSliderEl.value));
      });
      zoomValueEl.addEventListener('click', (e) => {
        e.stopPropagation();
        syncZoomUI(1.0);
      });

      btnAddSheep.addEventListener('click', () => {
        if (sheepList.length >= 24) {
          showToast(getWorldConfig().maxFlockToast);
          return;
        }
        let x = 0, z = 0;
        for (let tries = 0; tries < 28; tries++) {
          x = TERRAIN_CENTER_X + (Math.random() - 0.5) * (SLAB_W - 3.6);
          z = isSouthOcean() ? (-SLAB_D / 2 + 1.8 + Math.random() * 9.5) : ((Math.random() - 0.5) * (SLAB_D - 3.2));
          if (!isInRiver(x, z, 0.85) && !isInsidePen(x, z, 1.2)) break;
        }
        const s = createSheep(x, z, Math.random() * Math.PI * 2, pickRandomState(x, z));
        selectSheep(s, 5000);
      });

      btnResetFlock.addEventListener('click', () => {
        worldSnapshots[currentWorld] = null;
        weatherIdx = 0;
        cottageLightsOn = true;
        buildWorldEnvironment();
        applyWeatherMode('sunny');
        populateInitialFlock();
        populateClouds();
        populateRiverFish();
        initGoldenCat();
        camState.orbitEnabled = false;
        btnOrbitToggle.classList.remove('active');
        btnOrbitToggle.textContent = '自由视角: 关';
        setCanvasCursor('default');
        camState.azimuth = camState.baseAzimuth;
        camState.elevation = camState.baseElevation;
        camState.radius = camState.baseRadius;
        syncZoomUI(1.0);
        updateCameraTransform();
        showToast(getWorldConfig().resetToast);
      });

      // Keyboard Escape to deselect
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && selectedSheep) {
          selectSheep(null);
        }
      });

      // ------------------------------------------------------------------
      // 11. Resize & Animation Loop
      // ------------------------------------------------------------------
      function applyResponsiveCameraFraming() {
        const w = stage.clientWidth;
        const h = stage.clientHeight;
        if (w <= 0 || h <= 0) return;
        const aspect = w / h;
        if (aspect < 1.15) {
          const factor = Math.min(1.68, Math.max(1.0, 1.15 / aspect));
          camera.fov = Math.min(28, 22 + (factor - 1.0) * 8.5);
          camState.baseRadius = 76.5 * (1.0 + (factor - 1.0) * 0.62);
          if (!camState.orbitEnabled) {
            camState.radius = camState.baseRadius;
          }
        } else {
          camera.fov = 22;
          camState.baseRadius = 76.5;
          if (!camState.orbitEnabled) {
            camState.radius = camState.baseRadius;
          }
        }
        camera.aspect = aspect;
        camera.updateProjectionMatrix();
        updateCameraTransform();
      }

      function onResize() {
        const w = stage.clientWidth;
        const h = stage.clientHeight;
        if (w <= 0 || h <= 0) return;
        applyResponsiveCameraFraming();
        renderer.setSize(w, h);
        if (!isMobileLayout() && demoControlsEl && btnMobileMenu) {
          demoControlsEl.classList.remove('mobile-open');
          btnMobileMenu.classList.remove('open');
        }
        updateSelectionUI();
      }
      window.addEventListener('resize', onResize);

      // Select one sheep gently on first load (after 1.2s) or let user click immediately;
      // Start with central sheep selected so the signature UI & interaction are immediately visible
      setTimeout(() => {
        if (!selectedSheep && sheepList.length > 2) {
          selectSheep(sheepList[2]);
        }
      }, 450);

      const clock = new THREE.Clock();
      function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.05);
        const elapsed = clock.elapsedTime;
        arcticAnimElapsed = elapsed;

        // Drift foreground clouds diagonally across the diorama
        clouds.forEach(c => {
          c.group.position.x += c.speedX * dt;
          c.group.position.z += c.speedZ * dt;
          if (c.group.position.x > 23.0) {
            c.group.position.x = -23.5;
          }
          if (c.group.position.z > 12.2) {
            c.group.position.z = -11.2;
          }
        });

        // Flow river water ripples downstream with gentle side sway
        waterRippleTex.offset.y -= dt * 0.17;
        waterRippleTex.offset.x = Math.sin(elapsed * 0.9) * 0.03;

        // Animate swimming river fish & gentle water-foam pulse around the river rock
        updateRiverFish(dt, elapsed);
        if (reefFoamMesh) {
          const fp = 1 + Math.sin(elapsed * 2.8) * 0.08;
          reefFoamMesh.scale.set(fp, fp * 1.12, 1);
          reefFoamMesh.material.opacity = 0.34 + Math.sin(elapsed * 2.8) * 0.10;
        }

        if (isSouthOcean()) {
          if (oceanShimmerTex) {
            oceanShimmerTex.offset.x -= dt * 0.055;
            oceanShimmerTex.offset.y = Math.sin(elapsed * 0.7) * 0.04;
          }
          ARCTIC_FLOES.forEach(fl => {
            fl.dipVel += (-fl.dip * 38.0 - fl.dipVel * 6.2) * dt;
            fl.dip += fl.dipVel * dt;
            if (Math.abs(fl.dip) < 0.0005 && Math.abs(fl.dipVel) < 0.0005) { fl.dip = 0; fl.dipVel = 0; }
            if (fl.mesh) {
              fl.mesh.position.y = Math.sin(elapsed * 1.65 + fl.phase) * 0.045 + fl.dip;
              fl.mesh.rotation.z = Math.sin(elapsed * 1.1 + fl.phase) * 0.018 + fl.dip * 0.22;
            }
          });
          if (onsenSteamBoost > 0) onsenSteamBoost = Math.max(0, onsenSteamBoost - dt * 0.9);
          onsenSteamPuffs.forEach(st => {
            const cyc = (elapsed * (0.34 + onsenSteamBoost * 0.08) + st.phase) % 1.0;
            const boostSc = 1.0 + onsenSteamBoost * 0.28;
            st.mesh.position.set(
              Math.cos(st.angle + elapsed * 0.5) * st.rad,
              0.24 + cyc * 1.25,
              Math.sin(st.angle + elapsed * 0.5) * st.rad
            );
            st.mesh.scale.setScalar((0.65 + cyc * 1.15) * boostSc);
            st.mesh.material.opacity = Math.sin(cyc * Math.PI) * (0.52 + Math.min(0.28, onsenSteamBoost * 0.1));
          });
          if (auroraBoostTimer > 0) auroraBoostTimer = Math.max(0, auroraBoostTimer - dt);
          if (auroraGrandTimer > 0) auroraGrandTimer = Math.max(0, auroraGrandTimer - dt);
          if (arcticCrystalMats.length > 0) {
            const isAur = weatherMode === 'aurora';
            const nowMs = performance.now();
            arcticCrystalMats.forEach((cr, idx) => {
              if (cr.pulse > 0) cr.pulse = Math.max(0, cr.pulse - dt * 1.4);
              const isLit = cr.litUntil > nowMs;
              cr.mat.emissive.setHex(isAur ? (idx % 2 === 0 ? 0x34d399 : 0x38bdf8) : (isLit ? 0x34d399 : 0x38bdf8));
              const baseEm = isAur ? (0.65 + Math.sin(elapsed * 2.4 + idx) * 0.30) : (isLit ? 1.05 : 0.28);
              cr.mat.emissiveIntensity = baseEm + cr.pulse * 1.85;
            });
          }
          updateArcticFishItems(dt, elapsed);
          updateArcticWhale(dt, elapsed);
          updateArcticMeteors(dt);
          updateSnowmenAndBuild(dt, elapsed);
        }

        if (getWorldConfig().env.ambientParticleStyle === 'arctic_motes') {
          const isAur = weatherMode === 'aurora';
          petals.forEach((p, idx) => {
            p.mesh.material.color.setHex(isAur ? (idx % 2 === 0 ? 0x6ee7b7 : 0x7dd3fc) : 0xe0f2fe);
            p.mesh.material.opacity = isAur ? (0.4 + Math.max(0, Math.sin(elapsed * 2.8 + idx)) * 0.55) : 0.62;
            p.mesh.position.x += dt * (isAur ? 0.28 : 0.65);
            p.mesh.position.y = 0.6 + (idx % 5) * 0.55 + Math.sin(elapsed * 1.8 + idx) * 0.25;
            if (p.mesh.position.x > TERRAIN_MAX_X - 1.0) {
              p.mesh.position.x = TERRAIN_MIN_X + 1.0;
              p.mesh.position.z = (Math.random() - 0.5) * (SLAB_D - 2.0);
            }
          });
        } else if (getWorldConfig().env.ambientParticleStyle === 'forest_leaves') {
          const isFirefly = weatherMode === 'firefly';
          const driftSpd = weatherMode === 'autumn' ? 1.85 : (isFirefly ? 0.35 : 0.75);
          petals.forEach((p, idx) => {
            if (isFirefly) {
              p.mesh.material.color.setHex(0xe9ff6b);
              p.mesh.material.opacity = 0.35 + Math.max(0, Math.sin(elapsed * 3.4 + idx * 1.7)) * 0.65;
              p.mesh.position.x += Math.sin(elapsed * 1.2 + idx) * dt * 0.42;
              p.mesh.position.z += Math.cos(elapsed * 1.0 + idx * 1.3) * dt * 0.42;
              p.mesh.position.y = 0.65 + (idx % 5) * 0.48 + Math.sin(elapsed * 2.2 + idx) * 0.25;
              p.mesh.scale.setScalar(0.9 + Math.max(0, Math.sin(elapsed * 3.4 + idx * 1.7)) * 0.65);
            } else {
              if (p.baseColorHex !== undefined) p.mesh.material.color.setHex(p.baseColorHex);
              p.mesh.material.opacity = 0.85;
              p.mesh.scale.setScalar(1.0);
              p.mesh.position.x += dt * (driftSpd + (idx % 3) * 0.2);
              p.mesh.position.y -= dt * (0.32 + (idx % 3) * 0.08);
              p.mesh.rotation.x += dt * 1.6;
              p.mesh.rotation.z += dt * 1.3;
              if (p.mesh.position.y < 0.1 || p.mesh.position.x > TERRAIN_MAX_X - 0.8) {
                p.mesh.position.x = TERRAIN_MIN_X + 0.8 + Math.random() * (SLAB_W - 2.0);
                p.mesh.position.y = 3.2 + Math.random() * 2.6;
                p.mesh.position.z = (Math.random() - 0.5) * (SLAB_D - 1.5);
              }
            }
          });
        } else if (getWorldConfig().env.ambientParticleStyle === 'sand_motes') {
          const sandWind = weatherMode === 'sandstorm' ? 4.8 : 1.35;
          petals.forEach((p, idx) => {
            p.mesh.position.x += dt * (sandWind + (idx % 4) * 0.35);
            if (p.mesh.position.x > TERRAIN_MAX_X - 1.0) {
              p.mesh.position.x = TERRAIN_MIN_X + 1.0 + Math.random() * 3.0;
              p.mesh.position.z = (Math.random() - 0.5) * (SLAB_D - 2.0);
            }
            p.mesh.position.y = getGroundY(p.mesh.position.x, p.mesh.position.z) + 0.18 + Math.abs(Math.sin(elapsed * 2.2 + p.phase)) * 0.45;
            p.mesh.rotation.y += dt * 3.0;
          });
        } else {
          petals.forEach(p => {
            p.y -= p.speed * dt;
            if (p.y < 0.06) p.y = 2.15;
            const a = elapsed * 0.8 + p.phase;
            p.mesh.position.set(
              p.originX + Math.cos(a) * p.driftR,
              p.y,
              p.originZ + Math.sin(a * 0.8) * p.driftR
            );
            p.mesh.rotation.set(a * 1.4, a * 1.1, a * 0.9);
          });
        }

        // Periodic gentle breeze gusts swaying trees, petals, and chimney smoke
        breezeState.timer -= dt;
        if (breezeState.timer <= 0) {
          breezeState.active = 3.6;
          breezeState.timer = 13.0 + Math.random() * 7.0;
        }
        if (breezeState.active > 0) {
          breezeState.active = Math.max(0, breezeState.active - dt);
          breezeState.strength = Math.sin((breezeState.active / 3.6) * Math.PI);
        } else {
          breezeState.strength = 0;
        }
        const windAmt = (weatherMode === 'rain' ? 0.45 : 0.12) + breezeState.strength * 0.88;
        treeGroups.forEach((tg, idx) => {
          let extraShake = 0;
          if (tg.userData && tg.userData.shakeTimer > 0) {
            tg.userData.shakeTimer = Math.max(0, tg.userData.shakeTimer - dt);
            extraShake = Math.sin(elapsed * 42.0) * 0.14 * (tg.userData.shakeTimer / 0.72);
          }
          tg.rotation.z = Math.sin(elapsed * 2.2 + idx * 1.1) * 0.032 * windAmt + extraShake;
          tg.rotation.x = Math.cos(elapsed * 1.7 + idx * 0.8) * 0.018 * windAmt + extraShake * 0.5;
        });
        if (forestCrateGroup && forestCrateGroup.userData && forestCrateGroup.userData.shakeTimer > 0) {
          forestCrateGroup.userData.shakeTimer = Math.max(0, forestCrateGroup.userData.shakeTimer - dt);
          const env = forestCrateGroup.userData.shakeTimer / 0.7;
          forestCrateGroup.rotation.z = Math.sin(elapsed * 38.0) * 0.14 * env;
        } else if (forestCrateGroup) {
          forestCrateGroup.rotation.z = 0;
        }
        // Bioluminescent breathing glow on Forest mushroom stumps during Firefly Night!
        if (forestGlowMushroomMats.length > 0) {
          const glowing = weatherMode === 'firefly';
          forestGlowMushroomMats.forEach((mat, idx) => {
            if (glowing) {
              mat.emissive.setHex(0x6ee7b7);
              mat.emissiveIntensity = 0.55 + Math.sin(elapsed * 2.8 + idx * 1.3) * 0.32;
            } else if (mat.emissiveIntensity > 0) {
              mat.emissiveIntensity = 0;
            }
          });
        }

        const smokeOrig = getWorldConfig().env.smokeOrigin;
        chimneySmokePuffs.forEach(p => {
          const cycle = (elapsed * 0.28 + p.phase) % 1.0;
          p.mesh.position.set(
            smokeOrig.x + Math.sin(cycle * Math.PI * 2) * 0.14 + cycle * (0.22 + windAmt * 0.65),
            smokeOrig.y + cycle * 1.15,
            smokeOrig.z + cycle * 0.08
          );
          const sc = 0.55 + cycle * 1.15;
          p.mesh.scale.setScalar(sc);
          p.mesh.material.opacity = Math.sin(cycle * Math.PI) * (cottageLightsOn ? 0.62 : 0.20);
        });

        // Extra playful smoke rings puffed when user clicks the cottage
        for (let i = extraSmokeRings.length - 1; i >= 0; i--) {
          const sr = extraSmokeRings[i];
          sr.life += dt;
          if (sr.life >= sr.maxLife) {
            dioramaGroup.remove(sr.mesh);
            sr.mesh.material.dispose();
            extraSmokeRings.splice(i, 1);
            continue;
          }
          const p = sr.life / sr.maxLife;
          sr.mesh.position.y += dt * 1.15;
          sr.mesh.position.x += dt * (0.35 + windAmt * 0.5);
          sr.mesh.scale.setScalar(1.0 + p * 2.2);
          sr.mesh.material.opacity = 0.82 * (1 - p);
        }

        updateWaterRipples(dt);
        updateMicroParticles(dt);
        updateSnowTracks(dt);
        updateGoldenRebirthFX(dt);
        updateButterflies(dt, elapsed);
        updateForestNuts(dt, elapsed);
        updateBuryMounds(dt);
        updateFountainNuts(dt);

        // Animate acorns falling from upside-down shaken squirrel into the wooden storage crate!
        for (let i = fallingNuts.length - 1; i >= 0; i--) {
          const fn = fallingNuts[i];
          fn.life += dt;
          fn.vy -= 8.8 * dt;
          fn.mesh.position.x += fn.vx * dt;
          fn.mesh.position.y += fn.vy * dt;
          fn.mesh.position.z += fn.vz * dt;
          fn.mesh.rotation.x += dt * 7.5;
          fn.mesh.rotation.z += dt * 5.2;
          if (fn.mesh.position.y <= fn.targetY || fn.life > 1.5) {
            dioramaGroup.remove(fn.mesh);
            if (forestCrateNutsGroup && forestCrateNutCount < 28) {
              const settled = createNutMesh(1.12);
              settled.position.set(
                (Math.random() - 0.5) * 0.62,
                0.10 + Math.min(0.20, forestCrateNutCount * 0.008),
                (Math.random() - 0.5) * 0.50
              );
              settled.rotation.set(Math.random() * 2, Math.random() * 3, Math.random() * 2);
              forestCrateNutsGroup.add(settled);
              forestCrateNutCount++;
              if (forestCrateNutCount >= 22) {
                triggerCrateFountain();
              }
            }
            fallingNuts.splice(i, 1);
          }
        }

        if (weatherMode === 'sandstorm') {
          sandStreaks.forEach(st => {
            st.mesh.position.x += st.speed * dt;
            st.mesh.position.y -= 0.7 * dt;
            if (st.mesh.position.x > TERRAIN_MAX_X + 2.0 || st.mesh.position.y < 0.15) {
              st.mesh.position.x = TERRAIN_MIN_X - 2.0 - Math.random() * 4.0;
              st.mesh.position.y = 0.4 + Math.random() * 5.2;
              st.mesh.position.z = (Math.random() - 0.5) * SLAB_D;
            }
          });
        }
        if (weatherMode === 'snow') {
          if (isSouthOcean() && !snowmanBuildEvent && arcticSnowmen.length < 2 && Math.random() < dt * 0.045) {
            const freeP = sheepList.find(p => p.isPenguin && !p.deleting && !p.grabbed && !p.swimAction && !p.diveAction && p.state === 'Walk');
            if (freeP) startSnowmanBuild(freeP.root.position.x, freeP.root.position.z, freeP);
          }
          snowFlakes.forEach(sf => {
            sf.mesh.position.y -= sf.speed * dt;
            sf.mesh.position.x += Math.sin(elapsed * 1.6 + sf.phase) * 0.55 * dt;
            if (sf.mesh.position.y < 0.0) {
              sf.mesh.position.y = 9.5 + Math.random() * 1.8;
              sf.mesh.position.x = TERRAIN_MIN_X + Math.random() * SLAB_W;
              sf.mesh.position.z = (Math.random() - 0.5) * SLAB_D;
            }
          });
        }
        if (starFieldGroup.visible) {
          nightStars.forEach(st => {
            const tw = 0.55 + 0.45 * Math.sin(elapsed * st.speed + st.phase);
            st.mesh.material.opacity = 0.28 + tw * 0.72;
            st.mesh.scale.setScalar(st.baseScale * (0.75 + tw * 0.45));
          });
        }
        if (weatherMode === 'aurora') {
          const boost = auroraBoostTimer > 0 ? Math.sin(Math.min(1, auroraBoostTimer / 3.6) * Math.PI) * 0.38 : 0;
          auroraRibbons.forEach((ar, idx) => {
            const pos = ar.mesh.geometry.attributes.position;
            const base = ar.basePos;
            for (let i = 0; i < pos.count; i++) {
              const bx = base[i * 3];
              const by = base[i * 3 + 1];
              const wave = Math.sin(bx * 0.28 + elapsed * 1.15 + ar.phase) * 0.55 + Math.cos(bx * 0.16 - elapsed * 0.75) * 0.35;
              pos.setY(i, by + wave);
              pos.setZ(i, Math.sin(bx * 0.22 + elapsed * 0.9 + ar.phase) * 0.85);
            }
            pos.needsUpdate = true;
            ar.mesh.material.opacity = (ar.baseOpacity || 0.42) + Math.sin(elapsed * 1.4 + idx) * 0.08 + boost;
          });
          const shift = 0.5 + 0.5 * Math.sin(elapsed * 0.55);
          auroraGlowLight.color.setRGB(0.20 + shift * 0.12, 0.78 - shift * 0.10, 0.62 + shift * 0.28);
          auroraGlowLight.intensity = 0.72 + Math.sin(elapsed * 1.1) * 0.16 + boost * 1.6;
        } else {
          auroraGlowLight.intensity = 0;
        }
        if ((weatherMode === 'night' || weatherMode === 'firefly' || weatherMode === 'aurora') && getWorldConfig().nightFlicker && cottageWarmLight && cottageWindowMat && cottageLightsOn) {
          const fl = Math.sin(elapsed * 9.5) * 0.18;
          cottageWarmLight.intensity = 1.9 + fl;
          cottageWindowMat.emissiveIntensity = 1.45 + fl * 0.6;
        }

        if (weatherMode === 'rain') {
          rainDrops.forEach(rd => {
            rd.mesh.position.y -= rd.speed * dt;
            rd.mesh.position.x += 1.6 * dt;
            if (rd.mesh.position.y < 0.0) {
              rd.mesh.position.y = 9.5 + Math.random() * 2.0;
              rd.mesh.position.x = TERRAIN_MIN_X + Math.random() * SLAB_W;
              rd.mesh.position.z = (Math.random() - 0.5) * SLAB_D;
            }
          });
          rainSplashTimer -= dt;
          if (rainSplashTimer <= 0) {
            const rz = (Math.random() - 0.5) * (SLAB_D - 1.5);
            const rx = getRiverCenterX(rz) + (Math.random() - 0.5) * getRiverHalfWidth(rz) * 1.3;
            spawnWaterRipple(rx, rz, 1.3);
            rainSplashTimer = 0.24 + Math.random() * 0.28;
          }
        }

        // Update articulated sheep flock & Golden Shaded British Shorthair cat
        updateSheep(dt, elapsed);
        updateGoldenCat(dt, elapsed);

        // Smoothly interpolate native camera zoom so raycasting & overlays stay pixel-exact
        if (Math.abs(camState.targetZoom - camState.zoom) > 0.0005) {
          camState.zoom += (camState.targetZoom - camState.zoom) * Math.min(1, dt * 12);
          if (Math.abs(camState.targetZoom - camState.zoom) <= 0.0005) {
            camState.zoom = camState.targetZoom;
          }
          camera.zoom = camState.zoom;
          camera.updateProjectionMatrix();
        }

        // Render 3D scene & sync 2D screen-space selection UI
        renderer.render(scene, camera);
        updateSelectionUI();
      }

      window.onload = function () {
        onResize();
        animate();
      };
    })();
  </script>
</body>
</html>
